name: Diagnose streaming production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-streaming-production.yml'
  workflow_run:
    workflows: ["Deploy Neptune Media to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-streaming-production-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      OFFICIAL_TV: https://tv.neptunebusiness.com
      OFFICIAL_TUNNEL: https://media.neptunebusiness.com/
      MEDIA_SITE: https://media.neptunebusiness.com
    steps:
      - uses: actions/checkout@v4

      - name: Collect production evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/neptune-streaming-production
          fetch() {
            local name="$1"
            local url="$2"
            curl --silent --show-error --dump-header "/tmp/neptune-streaming-production/$name.headers" --output "/tmp/neptune-streaming-production/$name.body" --write-out '%{http_code}' "$url"
          }
          fetch_follow() {
            local name="$1"
            local url="$2"
            curl --location --silent --show-error --dump-header "/tmp/neptune-streaming-production/$name.headers" --output "/tmp/neptune-streaming-production/$name.body" --write-out '%{http_code}' "$url"
          }
          echo "HOME_STATUS=$(fetch home "$PUBLIC_URL/")" >> "$GITHUB_ENV"
          echo "CSS_STATUS=$(fetch css "$PUBLIC_URL/styles/neptune-streaming.css")" >> "$GITHUB_ENV"
          echo "JS_STATUS=$(fetch js "$PUBLIC_URL/ux-aida.js")" >> "$GITHUB_ENV"
          echo "LIVE_JS_STATUS=$(fetch live "$PUBLIC_URL/live-channel.js")" >> "$GITHUB_ENV"
          echo "DIRECT_STATUS=$(fetch direct "$PUBLIC_URL/direct/")" >> "$GITHUB_ENV"
          echo "WEBTV_STATE_STATUS=$(fetch webtv_state "$PUBLIC_URL/api/public/webtv/state")" >> "$GITHUB_ENV"
          echo "TV_DIRECT_STATUS=$(fetch tv_direct "$OFFICIAL_TV/direct/")" >> "$GITHUB_ENV"
          echo "TV_WEBTV_STATE_STATUS=$(fetch tv_webtv_state "$OFFICIAL_TV/api/public/webtv/state")" >> "$GITHUB_ENV"
          echo "MEDIA_DIRECT_STATUS=$(fetch_follow media_direct "$MEDIA_SITE/direct/")" >> "$GITHUB_ENV"
          echo "EMISSIONS_STATUS=$(fetch emissions "$PUBLIC_URL/emissions/")" >> "$GITHUB_ENV"
          echo "HEALTH_STATUS=$(fetch health "$PUBLIC_URL/api/health")" >> "$GITHUB_ENV"
          echo "ROBOTS_STATUS=$(fetch robots "$PUBLIC_URL/robots.txt")" >> "$GITHUB_ENV"
          echo "SITEMAP_STATUS=$(fetch sitemap "$PUBLIC_URL/sitemap.xml")" >> "$GITHUB_ENV"
          echo "VIDEO_SITEMAP_STATUS=$(fetch video_sitemap "$PUBLIC_URL/video-sitemap.xml")" >> "$GITHUB_ENV"
          echo "LLMS_STATUS=$(fetch llms "$PUBLIC_URL/llms.txt")" >> "$GITHUB_ENV"
          echo "STUDIO_STATUS=$(fetch studio "$PUBLIC_URL/studio/")" >> "$GITHUB_ENV"
          echo "CLIENT_STATUS=$(fetch client "$PUBLIC_URL/espace-client/")" >> "$GITHUB_ENV"
          echo "ADMIN_API_STATUS=$(fetch admin_api "$PUBLIC_URL/api/admin/clients")" >> "$GITHUB_ENV"
          echo "CLIENT_API_STATUS=$(fetch client_api "$PUBLIC_URL/api/client/session")" >> "$GITHUB_ENV"
          webhook_status=$(curl --silent --show-error --output /tmp/neptune-streaming-production/webhook.body --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$PUBLIC_URL/api/webhooks/conversion")
          echo "WEBHOOK_STATUS=$webhook_status" >> "$GITHUB_ENV"

      - name: Validate current production contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('/tmp/neptune-streaming-production')
          def text(name, suffix='body'):
              path = root / f'{name}.{suffix}'
              return path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''
          def has(name, needle, suffix='body'):
              return needle in text(name, suffix)
          def status(name):
              return os.environ.get(name, '')
          def json_body(name):
              try:
                  return json.loads(text(name))
              except Exception:
                  return {}
          def native_hls(state):
              if not isinstance(state, dict):
                  return False
              stream = state.get('stream')
              return isinstance(stream, dict) and stream.get('protocol') == 'hls' and stream.get('manifestUrl') == '/direct/live/index.m3u8' and stream.get('watchUrl') == '/direct/'

          webtv = json_body('webtv_state')
          tv_webtv = json_body('tv_webtv_state')

          checks = {
              'home_200': status('HOME_STATUS') == '200',
              'home_catalog_rail': has('home', 'data-content-rail'),
              'home_live_card': has('home', 'live-now-card'),
              'home_official_tunnel': os.environ['OFFICIAL_TUNNEL'] in text('home'),
              'streaming_css_200': status('CSS_STATUS') == '200',
              'streaming_css_contract': has('css', 'content-rail-shell'),
              'ux_js_200': status('JS_STATUS') == '200',
              'watch_progress_contract': has('js', 'neptune_watch_progress_v2'),
              'live_js_200': status('LIVE_JS_STATUS') == '200',
              'direct_200': status('DIRECT_STATUS') == '200',
              'direct_native_player': has('direct', 'id="player"') and has('direct', 'id="scheduleList"'),
              'direct_public_state_binding': has('direct', '/api/public/webtv/state') and has('direct', '/direct/live/index.m3u8'),
              'webtv_state_200': status('WEBTV_STATE_STATUS') == '200',
              'webtv_state_native_hls': native_hls(webtv),
              'official_tv_direct_200': status('TV_DIRECT_STATUS') == '200',
              'official_tv_direct_native_player': has('tv_direct', 'id="player"') and has('tv_direct', 'id="scheduleList"'),
              'official_tv_webtv_state_200': status('TV_WEBTV_STATE_STATUS') == '200',
              'official_tv_webtv_state_native_hls': native_hls(tv_webtv),
              'emissions_200': status('EMISSIONS_STATUS') == '200',
              'emissions_streaming_shell': has('emissions', 'data-public-ux="streaming-v3"'),
              'health_200': status('HEALTH_STATUS') == '200',
              'health_ok': has('health', '"ok":true'),
              'robots_200': status('ROBOTS_STATUS') == '200',
              'robots_protects_private_routes': all(value in text('robots') for value in ('Disallow: /studio/', 'Disallow: /espace-client/', 'Disallow: /api/')),
              'sitemap_200': status('SITEMAP_STATUS') == '200',
              'sitemap_valid': '<urlset' in text('sitemap'),
              'video_sitemap_200': status('VIDEO_SITEMAP_STATUS') == '200',
              'video_sitemap_valid': '<video:video>' in text('video_sitemap'),
              'llms_200': status('LLMS_STATUS') == '200',
              'llms_neptune': 'Neptune Media' in text('llms'),
              'studio_200': status('STUDIO_STATUS') == '200',
              'studio_no_store': 'no-store' in text('studio', 'headers').lower(),
              'studio_noindex': 'noindex' in text('studio', 'headers').lower(),
              'client_200': status('CLIENT_STATUS') == '200',
              'client_no_store': 'no-store' in text('client', 'headers').lower(),
              'client_noindex': 'noindex' in text('client', 'headers').lower(),
              'admin_api_protected': status('ADMIN_API_STATUS') == '401',
              'client_api_protected': status('CLIENT_API_STATUS') == '401',
              'webhook_protected': status('WEBHOOK_STATUS') == '401',
          }
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'ready': all(checks.values()),
              'webtv_release': webtv.get('release') if isinstance(webtv, dict) else None,
              'official_tv_webtv_release': tv_webtv.get('release') if isinstance(tv_webtv, dict) else None,
              'media_direct': {
                  'status': status('MEDIA_DIRECT_STATUS'),
                  'native_neptune_direct': has('media_direct', 'id="player"') and has('media_direct', '/api/public/webtv/state'),
              },
              'checks': checks,
          }
          Path('streaming-production-diagnostic.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('production contracts failed: ' + ', '.join(failed))
          print(f"Streaming production diagnostic: {len(checks)} contracts OK")
          print(f"Media direct informational: status={report['media_direct']['status']} native={report['media_direct']['native_neptune_direct']}")
          PY

      - name: Upload streaming diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-production-diagnostic-${{ github.run_id }}
          path: streaming-production-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
