name: Verify Studio Information Architecture Production V65

on:
  push:
    branches:
      - main
      - 'fix/studio-*'
    paths:
      - '.github/workflows/verify-studio-information-architecture-production-v65-20260731.yml'
      - 'wrangler.jsonc'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'neptune-tv-media-cloudflare/src/entry-v36.js'
      - 'neptune-tv-media-cloudflare/public/studio/clients.html'
      - 'neptune-tv-media-cloudflare/public/studio/video-ai.html'
      - 'neptune-tv-media-cloudflare/public/studio/webtv.html'
      - 'neptune-tv-media-cloudflare/public/studio/advanced.html'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65-1.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-shell-v105.css'
      - 'neptune-tv-media-cloudflare/public/studio/webtv-workspace-v1.js'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-information-architecture-production-v65.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-studio-information-architecture-production-v65-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check verifier syntax
        run: node --check neptune-tv-media-cloudflare/scripts/verify-studio-information-architecture-production-v65.mjs

      - name: Verify Studio v105 and Catalogue v109 on production domains
        id: verify
        env:
          STUDIO_PRODUCTION_BASE_URLS: https://neptune-media-webtv.neptunebusinessclub.workers.dev,https://tv.neptunebusiness.com
          STUDIO_PRODUCTION_ATTEMPTS: '15'
          STUDIO_PRODUCTION_DELAY_MS: '10000'
        shell: bash
        run: |
          set -o pipefail
          node neptune-tv-media-cloudflare/scripts/verify-studio-information-architecture-production-v65.mjs 2>&1 | tee /tmp/studio-v109-production.log

      - name: Build production verification artifact
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/studio-production-v109
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          log_path = '/tmp/studio-v109-production.log'
          try:
              log = open(log_path, encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              log = 'Verification did not start or produced no log.'
          outcome = os.environ.get('VERIFY_OUTCOME', 'unknown')
          report = {
              'status': 'success' if outcome == 'success' else 'failed',
              'verifier': 'studio-production-verifier-v109',
              'source_sha': os.environ.get('SOURCE_SHA', ''),
              'workflow_run_id': os.environ.get('WORKFLOW_RUN_ID', ''),
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'production_domains': [
                  'https://neptune-media-webtv.neptunebusinessclub.workers.dev',
                  'https://tv.neptunebusiness.com',
              ],
              'expected_navigation': ['Parcours clients', 'Diffusion', 'Réglages'],
              'expected_studio_release': 'neptune-studio-ui-20260812-v105-three-tab-canonical-shell',
              'expected_catalog_audit': 'neptune-media-catalog-audit-20260813-v109',
              'expected_shell_assets': {
                  'runtime': '/studio/studio-information-architecture-v65-1.js?v=107',
                  'stylesheet': '/studio/studio-shell-v105.css?v=3',
              },
              'outcome': outcome,
              'log_tail': log[-8000:],
          }
          with open('test-results/studio-production-v109/status.json', 'w', encoding='utf-8') as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          PY

      - name: Upload production verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-production-v109-${{ github.run_id }}
          path: test-results/studio-production-v109
          if-no-files-found: error
          retention-days: 14
