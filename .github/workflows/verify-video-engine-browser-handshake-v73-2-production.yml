name: Verify Neptune Browser Handshake V73.2 Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-video-engine-browser-handshake-v73-2-production.yml'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      matrix:
        domain:
          - https://tv.neptunebusiness.com
          - https://neptune-media-webtv.neptunebusinessclub.workers.dev
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Studio bridge
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ matrix.domain }}/studio/video-ai-engine-v73.js?release=v73.2-${GITHUB_RUN_ID}"
          for attempt in $(seq 1 24); do
            body="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$URL" || true)"
            if grep -Fq 'async probe(timeoutMs = 8000)' <<<"$body" \
              && grep -Fq "engine_token_missing" <<<"$body" \
              && grep -Fq "bridge.probe(interactive ? 30000 : 7000)" <<<"$body" \
              && grep -Fq "interactive: true" <<<"$body"; then
              echo "Browser handshake v73.2 active on ${{ matrix.domain }}"
              exit 0
            fi
            echo "Attempt $attempt: deployment not active yet"
            sleep 10
          done
          echo "Browser handshake v73.2 was not observed on ${{ matrix.domain }}" >&2
          exit 1
