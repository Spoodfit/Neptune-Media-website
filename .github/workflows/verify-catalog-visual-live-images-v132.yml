name: Verify Catalogue V132 Live Images

on:
  pull_request:
    paths:
      - 'neptune-tv-media-cloudflare/tests/audit-catalog-visual-live-images-v132.mjs'
      - '.github/workflows/verify-catalog-visual-live-images-v132.yml'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-v132.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-v132.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: neptune-tv-media-cloudflare
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Validate audit
        run: node --check neptune-tv-media-cloudflare/tests/audit-catalog-visual-live-images-v132.mjs
      - name: Start active Worker
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/"compatibility_date": "2026-07-30"/"compatibility_date": "2026-07-07"/' neptune-tv-media-cloudflare/wrangler.jsonc
          ./neptune-tv-media-cloudflare/node_modules/.bin/wrangler dev --config neptune-tv-media-cloudflare/wrangler.jsonc --local --port 8787 > /tmp/wrangler-v132-live-images.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/studio/advanced.html > /tmp/v132-live-images.html; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/wrangler-v132-live-images.log; exit 1; fi
      - name: Render v132 with current production images
        env:
          STUDIO_BASE_URL: http://127.0.0.1:8787
          CATALOG_SCREENSHOT: /tmp/catalog-v132-live-images.png
        run: node neptune-tv-media-cloudflare/tests/audit-catalog-visual-live-images-v132.mjs
      - name: Upload verified screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-v132-live-images
          path: |
            /tmp/catalog-v132-live-images.png
            /tmp/wrangler-v132-live-images.log
          if-no-files-found: warn
          retention-days: 2
