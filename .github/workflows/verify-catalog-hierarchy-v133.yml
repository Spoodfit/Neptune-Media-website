name: Verify Catalogue Hierarchy V133

on:
  pull_request:
    paths:
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-hierarchy-v133.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-hierarchy-actions-v133-1.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-hierarchy-v133.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-hierarchy-guard-v133.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-hierarchy-polish-v133-1.css'
      - 'neptune-tv-media-cloudflare/public/studio/advanced.html'
      - 'neptune-tv-media-cloudflare/tests/audit-catalog-hierarchy-v133.mjs'
      - '.github/workflows/verify-catalog-hierarchy-v133.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: neptune-tv-media-cloudflare
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript
        run: |
          node --check neptune-tv-media-cloudflare/public/studio/studio-catalog-hierarchy-v133.js
          node --check neptune-tv-media-cloudflare/public/studio/studio-catalog-hierarchy-actions-v133-1.js
          node --check neptune-tv-media-cloudflare/tests/audit-catalog-hierarchy-v133.mjs
          grep -Fq 'studio-catalog-hierarchy-polish-v133-1.css?v=2' neptune-tv-media-cloudflare/public/studio/advanced.html
          grep -Fq 'studio-catalog-hierarchy-actions-v133-1.js?v=2' neptune-tv-media-cloudflare/public/studio/advanced.html
      - name: Start active Worker
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          source.compatibility_date = '2026-07-17';
          delete source.containers;
          if (source.durable_objects?.bindings) {
            source.durable_objects.bindings = source.durable_objects.bindings.filter(
              (binding) => binding.name !== 'WEBTV_ENCODER' && binding.class_name !== 'WebTvEncoder'
            );
          }
          if (Array.isArray(source.migrations)) {
            source.migrations = source.migrations.filter(
              (migration) => !(migration.new_sqlite_classes || []).includes('WebTvEncoder')
            );
          }
          fs.writeFileSync('.wrangler-v133.local.jsonc', JSON.stringify(source, null, 2));
          NODE
          ./neptune-tv-media-cloudflare/node_modules/.bin/wrangler dev --config .wrangler-v133.local.jsonc --local --port 8787 > /tmp/wrangler-v133.log 2>&1 &
          echo $! > /tmp/wrangler-v133.pid
          ready=0
          for attempt in $(seq 1 60); do
            worker_pid="$(cat /tmp/wrangler-v133.pid)"
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/wrangler-v133.log
              exit 1
            fi
            if curl --fail --silent --max-time 3 http://127.0.0.1:8787/studio/advanced.html >/tmp/v133.html; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/wrangler-v133.log; exit 1; fi
      - name: Audit hierarchy in Chrome
        env:
          STUDIO_BASE_URL: http://127.0.0.1:8787
          CATALOG_SCREENSHOT: /tmp/catalog-hierarchy-v133.png
        run: node neptune-tv-media-cloudflare/tests/audit-catalog-hierarchy-v133.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-hierarchy-v133
          path: |
            /tmp/catalog-hierarchy-v133.png
            /tmp/wrangler-v133.log
          retention-days: 2
          if-no-files-found: warn
      - name: Stop local Worker
        if: always()
        run: |
          if [ -f /tmp/wrangler-v133.pid ]; then kill "$(cat /tmp/wrangler-v133.pid)" 2>/dev/null || true; fi
          rm -f .wrangler-v133.local.jsonc /tmp/wrangler-v133.pid
