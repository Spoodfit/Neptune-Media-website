name: Verify Content Visual Library v17

on:
  pull_request:
    paths:
      - '.github/workflows/verify-content-visual-library-v17.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify release and production assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://tv.neptunebusiness.com'
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$base/api/public/release?verify=v17-$attempt" > /tmp/release.json || true
            if grep -Fq '"release":"neptune-visual-content-library-20260725-v17"' /tmp/release.json \
              && grep -Fq '"clientVideoLibrary":"passage-selector-paginated-eight-items-v3"' /tmp/release.json \
              && grep -Fq '"clientCalendarLibrary":"passage-selector-paginated-eight-shorts-v5"' /tmp/release.json \
              && grep -Fq '"studioContentLibrary":"visual-grid-paginated-eight-items"' /tmp/release.json \
              && grep -Fq '"contentScrollModel":"bounded-by-passage-filter-and-page"' /tmp/release.json; then
              ok=1
              break
            fi
            sleep 10
          done
          cat /tmp/release.json
          test "$ok" = 1

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$base/espace-client/?verify=v17" > /tmp/client.html
          grep -Fq '/espace-client/content-snapshot-v48.css?v=1' /tmp/client.html
          grep -Fq '/espace-client/content-snapshot-v48.js?v=1' /tmp/client.html

          curl --fail --silent --show-error "$base/espace-client/content-snapshot-v48.js?v=1" > /tmp/snapshot.js
          grep -Fq 'shortFiles.slice(0,4)' /tmp/snapshot.js

          curl --fail --silent --show-error "$base/espace-client/videos/?verify=v17" > /tmp/videos.html
          grep -Fq '/espace-client/videos/videos-compact-v3.js?v=1' /tmp/videos.html
          grep -Fq '/espace-client/videos/videos-compact-v3.css?v=1' /tmp/videos.html
          curl --fail --silent --show-error "$base/espace-client/videos/videos-compact-v3.js?v=1" > /tmp/videos.js
          grep -Fq 'const PAGE_SIZE=8' /tmp/videos.js
          grep -Fq 'passage-selector' /tmp/videos.js

          curl --fail --silent --show-error "$base/espace-client/calendrier/?verify=v17" > /tmp/calendar.html
          grep -Fq '/espace-client/calendrier/calendar-compact-v5.js?v=1' /tmp/calendar.html
          grep -Fq '/espace-client/calendrier/calendar-compact-v5.css?v=1' /tmp/calendar.html
          curl --fail --silent --show-error "$base/espace-client/calendrier/calendar-compact-v5.js?v=1" > /tmp/calendar.js
          grep -Fq 'const PAGE_SIZE=8' /tmp/calendar.js
          grep -Fq 'observer?.disconnect()' /tmp/calendar.js

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$base/studio/clients?verify=v17" > /tmp/studio.html
          grep -Fq '/studio/content-gallery-v49.css?v=1' /tmp/studio.html
          grep -Fq '/studio/content-gallery-v49.js?v=1' /tmp/studio.html
          curl --fail --silent --show-error "$base/studio/content-gallery-v49.js?v=1" > /tmp/studio.js
          grep -Fq 'const PAGE_SIZE=8' /tmp/studio.js
          grep -Fq 'studio-upload-details' /tmp/studio.js
          grep -Fq 'observer?.disconnect()' /tmp/studio.js

          echo 'Production visual content library v17 verified.'
