name: Diagnose public accessibility production

on:
  push:
    paths:
      - .github/workflows/diagnose-public-accessibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Probe accessibility deployment
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 24); do
            home_code=$(curl --silent --show-error --output /tmp/home.html --write-out '%{http_code}' "$PUBLIC_URL/")
            js_code=$(curl --silent --show-error --output /tmp/accessibility.js --write-out '%{http_code}' "$PUBLIC_URL/accessibility.js")
            css_code=$(curl --silent --show-error --output /tmp/accessibility.css --write-out '%{http_code}' "$PUBLIC_URL/styles/accessibility.css")
            if test "$home_code" = "200" \
              && grep -q 'Aller au contenu principal' /tmp/home.html \
              && test "$js_code" = "200" \
              && grep -q 'trapFocus' /tmp/accessibility.js \
              && test "$css_code" = "200" \
              && grep -q 'skip-link' /tmp/accessibility.css \
              && grep -q ':focus-visible' /tmp/accessibility.css; then
              ready=true
              break
            fi
            sleep 10
          done
          printf 'ready=%s\nhome_code=%s\njs_code=%s\ncss_code=%s\n' "$ready" "${home_code:-}" "${js_code:-}" "${css_code:-}" > /tmp/a11y-statuses.env
          test "$ready" = 'true'

      - name: Build accessibility report
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        shell: bash
        run: |
          set -a
          source /tmp/a11y-statuses.env 2>/dev/null || true
          set +a
          python3 - <<'PY'
          import datetime, json, os, pathlib
          def read(path):
              try: return pathlib.Path(path).read_text(errors='replace')[:1800]
              except Exception as exc: return f'ERROR:{exc}'
          home=read('/tmp/home.html'); js=read('/tmp/accessibility.js'); css=read('/tmp/accessibility.css')
          report={
            'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'ready':os.environ.get('PROBE_OUTCOME')=='success',
            'home':{'status':os.environ.get('home_code',''),'skip_link':'Aller au contenu principal' in home},
            'javascript':{'status':os.environ.get('js_code',''),'focus_trap':'trapFocus' in js},
            'css':{'status':os.environ.get('css_code',''),'skip_link':'skip-link' in css,'focus_visible':':focus-visible' in css},
          }
          pathlib.Path('public-accessibility-production-diagnostic.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-accessibility-production-diagnostic-${{ github.run_id }}
          path: public-accessibility-production-diagnostic.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce accessibility probe
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: test "$PROBE_OUTCOME" = 'success'
