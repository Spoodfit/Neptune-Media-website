name: Deploy Neptune Media to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'neptune-video-engine/**'
      - 'neptune-tv-media-cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-media-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'issue_comment' || (github.actor == 'neptunebusinessclub' && github.event.issue.pull_request && github.event.comment.body == '/deploy-neptune-media')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: https://tv.neptunebusiness.com
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      RELEASE_ID: neptune-verified-content-runtime-20260730-v18
      EDITORIAL_RELEASE: neptune-editorial-workspace-20260730-v2
      STUDIO_OPERATIONS_RELEASE: neptune-studio-client-journey-20260805-v77
      SMART_EMAIL_RELEASE: neptune-smart-email-governor-20260806-v84

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build and validate application
        run: npm run check

      - name: Validate Worker bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Deploy Worker and Studio assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify Studio and client journey v77 on both production domains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/neptune-studio-v77

          verify_domain() {
            local base="$1"
            local slug="$2"
            local ready=0

            for attempt in $(seq 1 36); do
              local query="studio_v77=$GITHUB_SHA&attempt=$attempt"
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/api/public/release?$query" > "/tmp/neptune-studio-v77/$slug-release.json" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/clients?$query" > "/tmp/neptune-studio-v77/$slug-clients.html" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/espace-client/?$query" > "/tmp/neptune-studio-v77/$slug-client.html" || true
              curl --silent --show-error --head -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai?$query" > "/tmp/neptune-studio-v77/$slug-retired-route.txt" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/content-gallery-v76.js?$query" > "/tmp/neptune-studio-v77/$slug-gallery.js" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/studio-journey-v77.js?$query" > "/tmp/neptune-studio-v77/$slug-journey.js" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/studio-journey-v77.css?$query" > "/tmp/neptune-studio-v77/$slug-journey.css" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/espace-client/client-preparation-v77.js?$query" > "/tmp/neptune-studio-v77/$slug-preparation.js" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/confirmation-studio/app.js?$query" > "/tmp/neptune-studio-v77/$slug-confirmation.js" || true

              if RELEASE_FILE="/tmp/neptune-studio-v77/$slug-release.json" node <<'NODE'
          const fs = require('node:fs');
          let data;
          try { data = JSON.parse(fs.readFileSync(process.env.RELEASE_FILE, 'utf8')); } catch { process.exit(1); }
          if (data.release !== process.env.RELEASE_ID) process.exit(1);
          if (data.editorialWorkspace !== process.env.EDITORIAL_RELEASE) process.exit(1);
          if (data.studioClientOperations !== process.env.STUDIO_OPERATIONS_RELEASE) process.exit(1);
          if (data.studioInformationArchitecture !== 'three-primary-destinations-v77') process.exit(1);
          if (JSON.stringify(data.studioPrimaryNavigation) !== JSON.stringify(['Parcours clients', 'Diffusion', 'Réglages'])) process.exit(1);
          if (data.studioVideoProductionWorkspace !== 'removed-external-editing-drive-sync-only') process.exit(1);
          if (data.studioClientManagement !== 'edit-archive-reactivate-confirmed-delete') process.exit(1);
          if (data.studioClientDeletionPolicy !== 'database-and-r2-deleted-google-drive-preserved') process.exit(1);
          if (data.studioContentLibrary !== 'equal-height-cards-compact-plus-upload-paginated-24-v77') process.exit(1);
          if (data.studioPreparationJourney !== 'calendar-synced-link-or-one-click-booking-v77') process.exit(1);
          if (data.supplierDateConfirmation !== 'two-preselected-safe-email-actions-v77') process.exit(1);
          if (data.clientHorsNormePreparation !== 'ten-presenter-inspired-interactive-cards-v77') process.exit(1);
          if (data.studioCanonicalVideoPath !== null) process.exit(1);
          if (data.studioSmartEmailGovernor !== process.env.SMART_EMAIL_RELEASE) process.exit(1);
          if (data.testClientEmailProtection !== 'supplier-emails-rerouted-to-contact-neptunebusiness-com-v84') process.exit(1);
          if (data.notificationCadence !== 'one-useful-email-per-recipient-context-every-45-minutes-v84') process.exit(1);
          if (data.notificationDecisionMode !== 'state-aware-priority-and-stale-message-supersession-v84') process.exit(1);
          NODE
              then
                if grep -Fq '/studio/content-gallery-v76.js?v=1' "/tmp/neptune-studio-v77/$slug-clients.html" \
                  && grep -Fq '/studio/studio-journey-v77.js?v=1' "/tmp/neptune-studio-v77/$slug-clients.html" \
                  && grep -Fq '/espace-client/client-preparation-v77.js?v=1' "/tmp/neptune-studio-v77/$slug-client.html" \
                  && grep -Fq 'const PAGE_SIZE = 24;' "/tmp/neptune-studio-v77/$slug-gallery.js" \
                  && grep -Fq 'studio-upload-details-v77' "/tmp/neptune-studio-v77/$slug-journey.js" \
                  && grep -Fq 'Réserver la préparation' "/tmp/neptune-studio-v77/$slug-journey.js" \
                  && grep -Fq 'height:286px' "/tmp/neptune-studio-v77/$slug-journey.css" \
                  && grep -Fq 'cards-rendered-without-binary-assets-v77' "/tmp/neptune-studio-v77/$slug-preparation.js" \
                  && grep -Fq 'Réserver ma préparation' "/tmp/neptune-studio-v77/$slug-preparation.js" \
                  && grep -Fq 'requestedDecision' "/tmp/neptune-studio-v77/$slug-confirmation.js" \
                  && grep -Fq 'Confirmer définitivement ce créneau' "/tmp/neptune-studio-v77/$slug-confirmation.js" \
                  && grep -Eqi '^HTTP/[0-9.]+ 302' "/tmp/neptune-studio-v77/$slug-retired-route.txt" \
                  && grep -Eqi '^location: .*/studio/clients' "/tmp/neptune-studio-v77/$slug-retired-route.txt"; then
                  ready=1
                  echo "$base: Studio and client journey v77 plus smart email governor v84 verified on attempt $attempt."
                  break
                fi
              fi
              echo "$base: Studio and client journey v77 plus smart email governor v84 not fully propagated on attempt $attempt; retrying."
              sleep 10
            done
            test "$ready" = 1
          }

          verify_domain "$WORKERS_URL" workers
          verify_domain "$PUBLIC_URL" public

      - name: Verify editorial production asset
        run: |
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/assets/neptune-editorial-workspace-v59.js?release=$GITHUB_SHA" > /tmp/neptune-editorial-workspace-v59.js
          grep -Fq 'publishExpress' /tmp/neptune-editorial-workspace-v59.js

      - name: Verify Resend authentication from production
        run: |
          curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/api/public/email-health?release=$GITHUB_SHA" > /tmp/email-health.json
          grep -Fq '"configured":true' /tmp/email-health.json
          grep -Fq '"providerKeyAccepted":true' /tmp/email-health.json
          grep -Fq '"transport":"resend-node-6.18.0"' /tmp/email-health.json

      - name: Verify trusted Neptune client login
        run: |
          curl --silent --show-error --cookie-jar /tmp/client-cookie.txt \
            -X POST "$PUBLIC_URL/api/client/request-code" \
            -H "Origin: $PUBLIC_URL" -H 'Content-Type: application/json' \
            --data '{"email":"contact@neptunebusiness.com"}' > /tmp/trusted-login.json
          grep -Fq '"ok":true' /tmp/trusted-login.json
          grep -Fq '"authenticated":true' /tmp/trusted-login.json
          grep -Fq '"trustedAccess":true' /tmp/trusted-login.json
          curl --fail --silent --show-error --cookie /tmp/client-cookie.txt \
            "$PUBLIC_URL/api/client/session" > /tmp/client-session.json
          grep -Fq '"client"' /tmp/client-session.json
          grep -Fq '"orders"' /tmp/client-session.json
