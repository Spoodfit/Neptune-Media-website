name: Deploy Neptune Media to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-media-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: https://tv.neptunebusiness.com
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      RELEASE_ID: neptune-verified-content-runtime-20260730-v18
      EFFICIENCY_RELEASE: neptune-efficiency-operational-fallback-20260730-v11
      EDITORIAL_RELEASE: neptune-editorial-workspace-20260730-v2
      VIDEO_AI_RELEASE: neptune-video-orchestrator-20260801-v71
      OPENAI_RELEASE: neptune-openai-video-analysis-20260731-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build and validate application
        run: npm run check

      - name: Validate Worker, Queue and Container bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Ensure durable video Queues exist
        shell: bash
        run: |
          set -euo pipefail

          ensure_queue() {
            local queue_name="$1"
            local log_file="/tmp/${queue_name}-create.log"
            set +e
            npx wrangler queues create "$queue_name" 2>&1 | tee "$log_file"
            local status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ] && ! grep -Eqi 'already exists|name is already in use|code.?10014' "$log_file"; then
              echo "Impossible de créer ou confirmer la Queue $queue_name." >&2
              exit "$status"
            fi
          }

          ensure_queue neptune-video-jobs
          ensure_queue neptune-video-jobs-dlq

      - name: Deploy Worker, Queue consumer, Container and Studio assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify video orchestrator v71 on both production domains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/neptune-video-v71

          verify_domain() {
            local base="$1"
            local slug="$2"
            local ready=0

            for attempt in $(seq 1 30); do
              local query="video_v71=$GITHUB_SHA&attempt=$attempt"
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/api/public/release?$query" > "/tmp/neptune-video-v71/$slug-release.json" || true
              curl --fail --silent --show-error --location --max-redirs 5 -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai?$query" > "/tmp/neptune-video-v71/$slug-video-ai.html" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai-cloud-resilience-v67.js?v=1&$query" > "/tmp/neptune-video-v71/$slug-resilience.js" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai-v1.js?v=67&$query" > "/tmp/neptune-video-v71/$slug-client.js" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai-story-v70.js?v=1&$query" > "/tmp/neptune-video-v71/$slug-story-v70.js" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai-story-v70.css?v=1&$query" > "/tmp/neptune-video-v71/$slug-story-v70.css" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai-story-v71.js?v=1&$query" > "/tmp/neptune-video-v71/$slug-story-v71.js" || true
              curl --fail --silent --show-error -I -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai.html?$query" > "/tmp/neptune-video-v71/$slug-headers.txt" || true

              if RELEASE_FILE="/tmp/neptune-video-v71/$slug-release.json" node <<'NODE'
          const fs = require('node:fs');
          const file = process.env.RELEASE_FILE;
          let data;
          try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch { process.exit(1); }
          const expected = {
            release: process.env.RELEASE_ID,
            efficiencyRelease: process.env.EFFICIENCY_RELEASE,
            editorialWorkspace: process.env.EDITORIAL_RELEASE,
            videoAiStudio: process.env.VIDEO_AI_RELEASE,
            videoAiOpenAiIntegration: process.env.OPENAI_RELEASE,
            videoAiEngineMode: 'cloud-asynchronous-with-local-fallback',
            videoAiDispatchMode: 'direct-acceptance-then-durable-queue-fallback',
            videoAiPipeline: 'multipart-r2-direct-container-acceptance-durable-queue-fallback-persisted-heartbeat-openai-ffmpeg-review-drive',
            videoAiRecoveryPolicy: 'five-bounded-attempts-with-persisted-errors',
            videoAiSourcePrivacy: 'encrypted-cloud-temporary-source-storage',
            videoAiUpload: 'r2-multipart-16mb-three-way-parallel-retry',
            videoAiSourceRetention: 'deleted-after-successful-generation',
            videoAiStudioExperience: 'simple-production-story-with-honest-recovery-state',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (data[key] !== value) process.exit(1);
          }
          for (const key of [
            'videoAiOpenAiConfigured',
            'videoAiOpenAiStructuredOutputs',
            'videoAiContainerRequired',
            'videoAiContainerBindingPresent',
            'videoAiStorageBindingPresent',
            'videoAiWorkersAiBindingPresent',
            'videoAiQueueBindingPresent',
            'videoAiInternalSecretRequired',
            'videoAiInternalSecretPresent',
            'videoAiR2SourceUploadRequired',
            'videoAiBackgroundProcessing',
            'videoAiSafeToCloseAfterUpload',
            'videoAiReady',
            'resendSecretPresent',
            'webhookSecretPresent',
            'driveSecretPresent',
          ]) {
            if (data[key] !== true) process.exit(1);
          }
          if (data.videoAiStatusReadSideEffects !== false) process.exit(1);
          if (data.videoAiPersistentHeartbeatSeconds !== 20 || data.videoAiProcessorPoolSize !== 2) process.exit(1);
          if (data.videoAiMinimumScore !== 60 || data.videoAiEditorialProposals !== 3) process.exit(1);
          NODE
              then
                if grep -Fq 'TRAITEMENT CLOUD RÉSILIENT' "/tmp/neptune-video-v71/$slug-video-ai.html" \
                  && grep -Fq 'Production cloud' "/tmp/neptune-video-v71/$slug-video-ai.html" \
                  && grep -Fq 'Importer et lancer la production' "/tmp/neptune-video-v71/$slug-video-ai.html" \
                  && grep -Fq '/studio/video-ai-story-v70.js?v=1' "/tmp/neptune-video-v71/$slug-video-ai.html" \
                  && grep -Fq '/studio/video-ai-story-v71.js?v=1' "/tmp/neptune-video-v71/$slug-video-ai.html" \
                  && grep -Fq 'multipartUpload' "/tmp/neptune-video-v71/$slug-client.js" \
                  && grep -Fq 'fetchWithRetry' "/tmp/neptune-video-v71/$slug-resilience.js" \
                  && grep -Fq 'Neptune crée vos contenus' "/tmp/neptune-video-v71/$slug-story-v70.js" \
                  && grep -Fq 'Vidéo prise en charge' "/tmp/neptune-video-v71/$slug-story-v70.js" \
                  && grep -Fq '#videoLiveMonitor{display:none!important}' "/tmp/neptune-video-v71/$slug-story-v70.css" \
                  && grep -Fq 'job.attemptStartedAt' "/tmp/neptune-video-v71/$slug-story-v71.js" \
                  && grep -Fq 'job.errorDetail' "/tmp/neptune-video-v71/$slug-story-v71.js" \
                  && grep -Fq 'stopped_with_code' "/tmp/neptune-video-v71/$slug-story-v71.js" \
                  && grep -Fqi "x-neptune-video-ai: $VIDEO_AI_RELEASE" "/tmp/neptune-video-v71/$slug-headers.txt"; then
                  ready=1
                  echo "$base: Neptune Video orchestrator v71 verified on attempt $attempt."
                  break
                fi
              fi

              echo "$base: video orchestrator v71 not fully propagated on attempt $attempt; retrying."
              sleep 10
            done

            test "$ready" = 1
          }

          verify_domain "$WORKERS_URL" workers
          verify_domain "$PUBLIC_URL" public

      - name: Verify editorial production asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/assets/neptune-editorial-workspace-v59.js?release=$GITHUB_SHA" > /tmp/neptune-editorial-workspace-v59.js
          grep -Fq 'publishExpress' /tmp/neptune-editorial-workspace-v59.js

      - name: Verify Resend authentication from production
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/api/public/email-health?release=$GITHUB_SHA" > /tmp/email-health.json
          cat /tmp/email-health.json
          grep -Fq '"configured":true' /tmp/email-health.json
          grep -Fq '"providerKeyAccepted":true' /tmp/email-health.json
          grep -Fq '"transport":"resend-node-6.18.0"' /tmp/email-health.json
          grep -Fq '"retryPolicy":"3-attempts-idempotent"' /tmp/email-health.json
          grep -Fq '"senderDomain":"media.neptunebusiness.com"' /tmp/email-health.json

      - name: Verify trusted Neptune client login
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --cookie-jar /tmp/client-cookie.txt \
            -X POST "$PUBLIC_URL/api/client/request-code" \
            -H "Origin: $PUBLIC_URL" \
            -H 'Content-Type: application/json' \
            -H 'Cache-Control: no-cache, no-store' \
            --data '{"email":"contact@neptunebusiness.com"}' > /tmp/trusted-login.json
          cat /tmp/trusted-login.json
          grep -Fq '"ok":true' /tmp/trusted-login.json
          grep -Fq '"authenticated":true' /tmp/trusted-login.json
          grep -Fq '"trustedAccess":true' /tmp/trusted-login.json
          curl --fail --silent --show-error --cookie /tmp/client-cookie.txt \
            "$PUBLIC_URL/api/client/session" > /tmp/client-session.json
          grep -Fq '"client"' /tmp/client-session.json
          grep -Fq '"orders"' /tmp/client-session.json
