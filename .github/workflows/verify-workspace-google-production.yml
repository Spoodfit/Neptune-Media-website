name: Verify Workspace Google Production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-workspace-google-production.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed release
        shell: bash
        run: |
          set -euo pipefail
          public='https://tv.neptunebusiness.com'
          workers='https://neptune-media-webtv.neptunebusinessclub.workers.dev'
          expected='neptune-workspace-google-appointment-20260724-v10'
          for base in "$workers" "$public"; do
            for attempt in 1 2 3 4 5 6 7 8; do
              curl --silent --show-error -H 'Cache-Control: no-cache, no-store' "$base/api/public/release?attempt=$attempt" > /tmp/release.json || true
              if grep -Fq "\"release\":\"$expected\"" /tmp/release.json; then break; fi
              sleep 10
            done
            cat /tmp/release.json
            grep -Fq "\"release\":\"$expected\"" /tmp/release.json
            grep -Fq '"workflowStore":"store-v5"' /tmp/release.json
            grep -Fq '"studioWorkflowUi":"workspace-v42-fullscreen"' /tmp/release.json
            grep -Fq '"appointmentAuthority":"google_calendar_event"' /tmp/release.json
          done

      - name: Verify integrated Studio workspace
        shell: bash
        run: |
          set -euo pipefail
          public='https://tv.neptunebusiness.com'
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$public/studio/clients?verify=v10" > /tmp/studio.html
          grep -Fq '/studio/workspace-v42.css?v=1' /tmp/studio.html
          grep -Fq '/studio/workspace-v42.js?v=1' /tmp/studio.html
          curl --fail --silent --show-error "$public/studio/workspace-v42.js?v=1" > /tmp/workspace.js
          grep -Fq 'studio-workspace-v42' /tmp/workspace.js
          grep -Fq 'studio-sidebar-collapsed' /tmp/workspace.js
          grep -Fq 'date-action-grid' /tmp/workspace.js

      - name: Verify client workflow source markers
        shell: bash
        run: |
          set -euo pipefail
          public='https://tv.neptunebusiness.com'
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$public/espace-client/?verify=v10" > /tmp/client.html
          grep -Fq '/espace-client/workflow-v45.js?v=3' /tmp/client.html
          curl --fail --silent --show-error "$public/espace-client/workflow-v45.js?v=3" > /tmp/client.js
          grep -Fq 'client-minimal-flow' /tmp/client.js
