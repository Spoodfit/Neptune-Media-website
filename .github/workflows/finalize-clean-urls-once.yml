name: Finalize canonical URLs once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-clean-urls-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Replace deprecated booking URL and self-remove
        shell: bash
        run: |
          set -euo pipefail
          old='https://media.neptunebusiness.com/reserver'
          new='https://neptune-media-webtv.neptunebusinessclub.workers.dev/reserver'
          files=(
            neptune-tv-media-cloudflare/public/espace-client/media-catalog-v95.js
            neptune-tv-media-cloudflare/src/entry-v31.js
            neptune-tv-media-cloudflare/src/portal-simple-journey-v92.js
            neptune-tv-media-cloudflare/src/reservation-stripe-redirect-v180.js
          )
          python3 - "$old" "$new" "${files[@]}" <<'PY'
          import pathlib, sys
          old, new, *files = sys.argv[1:]
          for name in files:
              path = pathlib.Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  print(f'no deprecated URL in {name}')
                  continue
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'updated {name}')
          PY
          git rm .github/workflows/finalize-clean-urls-once.yml
          git config user.name 'Neptune Repository Cleaner'
          git config user.email 'actions@users.noreply.github.com'
          git add "${files[@]}"
          git diff --cached --check
          git commit -m 'Remove deprecated booking URL references'
          git push origin HEAD:main
