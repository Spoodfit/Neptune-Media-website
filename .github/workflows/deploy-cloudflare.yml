name: Deploy Neptune Media to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-media-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: https://tv.neptunebusiness.com
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      RELEASE_ID: neptune-verified-content-runtime-20260730-v18
      EFFICIENCY_RELEASE: neptune-efficiency-operational-fallback-20260730-v11
      EDITORIAL_RELEASE: neptune-editorial-workspace-20260730-v2
      VIDEO_AI_RELEASE: neptune-video-local-engine-20260802-v72
      OPENAI_RELEASE: neptune-openai-video-analysis-20260731-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build and validate application
        run: npm run check

      - name: Validate free-plan Worker bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Deploy Worker and Studio assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify local video engine v72 on both production domains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/neptune-video-v72

          verify_domain() {
            local base="$1"
            local slug="$2"
            local ready=0

            for attempt in $(seq 1 30); do
              local query="video_v72=$GITHUB_SHA&attempt=$attempt"
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/api/public/release?$query" > "/tmp/neptune-video-v72/$slug-release.json" || true
              curl --fail --silent --show-error --location --max-redirs 5 -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai?$query" > "/tmp/neptune-video-v72/$slug-video-ai.html" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/local-engine/neptune-video-local-engine-v1.js?v=72&$query" > "/tmp/neptune-video-v72/$slug-engine.js" || true
              curl --fail --silent --show-error -I -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai.html?$query" > "/tmp/neptune-video-v72/$slug-headers.txt" || true

              if RELEASE_FILE="/tmp/neptune-video-v72/$slug-release.json" node <<'NODE'
          const fs = require('node:fs');
          const file = process.env.RELEASE_FILE;
          let data;
          try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch { process.exit(1); }
          const expected = {
            release: process.env.RELEASE_ID,
            efficiencyRelease: process.env.EFFICIENCY_RELEASE,
            editorialWorkspace: process.env.EDITORIAL_RELEASE,
            videoAiStudio: process.env.VIDEO_AI_RELEASE,
            videoAiOpenAiIntegration: process.env.OPENAI_RELEASE,
            videoAiEngineMode: 'browser-local',
            videoAiDispatchMode: 'no-container-no-queue',
            videoAiPipeline: 'browser-local-whisper-openai-workers-ai-selection-webcodecs-render-indexeddb-review-drive',
            videoAiSourcePrivacy: 'source-never-uploaded',
            videoAiLegacyCloudRecovery: 'retired-reselect-source-locally-no-upload',
            videoAiStudioExperience: 'local-production-with-real-progress-no-fake-restarts',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (data[key] !== value) process.exit(1);
          }
          if (data.videoAiContainerRequired !== false) process.exit(1);
          if (data.videoAiContainerBindingPresent !== false) process.exit(1);
          if (data.videoAiQueueBindingPresent !== false) process.exit(1);
          if (data.videoAiR2SourceUploadRequired !== false) process.exit(1);
          if (data.videoAiBackgroundProcessing !== false) process.exit(1);
          if (data.videoAiSafeToCloseAfterUpload !== false) process.exit(1);
          if (data.videoAiReady !== true) process.exit(1);
          if (data.videoAiWorkersAiBindingPresent !== true) process.exit(1);
          if (data.videoAiMinimumScore !== 60 || data.videoAiEditorialProposals !== 3) process.exit(1);
          NODE
              then
                if grep -Fq 'NEPTUNE VIDEO ENGINE LOCAL' "/tmp/neptune-video-v72/$slug-video-ai.html" \
                  && grep -Fq 'Production locale' "/tmp/neptune-video-v72/$slug-video-ai.html" \
                  && grep -Fq 'Lancer la production locale' "/tmp/neptune-video-v72/$slug-video-ai.html" \
                  && grep -Fq '/studio/local-engine/neptune-video-local-engine-v1.js?v=72' "/tmp/neptune-video-v72/$slug-video-ai.html" \
                  && ! grep -Eq 'video-ai-(cloud-resilience-v67|dispatch-recovery-v68|story-v7[01])\.js' "/tmp/neptune-video-v72/$slug-video-ai.html" \
                  && grep -Fq 'openAiAnalysisAvailable' "/tmp/neptune-video-v72/$slug-engine.js" \
                  && grep -Fq 'workersAiAssistAvailable' "/tmp/neptune-video-v72/$slug-engine.js" \
                  && grep -Fqi "x-neptune-video-ai: $VIDEO_AI_RELEASE" "/tmp/neptune-video-v72/$slug-headers.txt" \
                  && grep -Fqi 'cross-origin-opener-policy: same-origin' "/tmp/neptune-video-v72/$slug-headers.txt" \
                  && grep -Fqi 'cross-origin-embedder-policy: require-corp' "/tmp/neptune-video-v72/$slug-headers.txt"; then
                  ready=1
                  echo "$base: Neptune Video local engine v72 verified on attempt $attempt."
                  break
                fi
              fi

              echo "$base: local video engine v72 not fully propagated on attempt $attempt; retrying."
              sleep 10
            done

            test "$ready" = 1
          }

          verify_domain "$WORKERS_URL" workers
          verify_domain "$PUBLIC_URL" public

      - name: Verify editorial production asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/assets/neptune-editorial-workspace-v59.js?release=$GITHUB_SHA" > /tmp/neptune-editorial-workspace-v59.js
          grep -Fq 'publishExpress' /tmp/neptune-editorial-workspace-v59.js

      - name: Verify Resend authentication from production
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/api/public/email-health?release=$GITHUB_SHA" > /tmp/email-health.json
          cat /tmp/email-health.json
          grep -Fq '"configured":true' /tmp/email-health.json
          grep -Fq '"providerKeyAccepted":true' /tmp/email-health.json
          grep -Fq '"transport":"resend-node-6.18.0"' /tmp/email-health.json
          grep -Fq '"retryPolicy":"3-attempts-idempotent"' /tmp/email-health.json
          grep -Fq '"senderDomain":"media.neptunebusiness.com"' /tmp/email-health.json

      - name: Verify trusted Neptune client login
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --cookie-jar /tmp/client-cookie.txt \
            -X POST "$PUBLIC_URL/api/client/request-code" \
            -H "Origin: $PUBLIC_URL" \
            -H 'Content-Type: application/json' \
            -H 'Cache-Control: no-cache, no-store' \
            --data '{"email":"contact@neptunebusiness.com"}' > /tmp/trusted-login.json
          cat /tmp/trusted-login.json
          grep -Fq '"ok":true' /tmp/trusted-login.json
          grep -Fq '"authenticated":true' /tmp/trusted-login.json
          grep -Fq '"trustedAccess":true' /tmp/trusted-login.json
          curl --fail --silent --show-error --cookie /tmp/client-cookie.txt \
            "$PUBLIC_URL/api/client/session" > /tmp/client-session.json
          grep -Fq '"client"' /tmp/client-session.json
          grep -Fq '"orders"' /tmp/client-session.json
