name: Verify Viewport Fit V55 20260730

on:
  pull_request:
    paths:
      - '.github/workflows/verify-viewport-fit-v55-20260730.yml'
      - 'tests/audit-viewport-v55.mjs'
      - 'neptune-tv-media-cloudflare/public/assets/neptune-viewport-fit-v55.css'
      - 'neptune-tv-media-cloudflare/src/entry-v11.js'

permissions:
  contents: read

jobs:
  verify-viewport-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate viewport-fit source contract
        shell: bash
        run: |
          set -euo pipefail
          css='neptune-tv-media-cloudflare/public/assets/neptune-viewport-fit-v55.css'
          entry='neptune-tv-media-cloudflare/src/entry-v11.js'
          node --check "$entry"
          node --check tests/audit-viewport-v55.mjs
          grep -Fq 'desktop-one-screen-task-layout-v55' "$entry"
          grep -Fq '/assets/neptune-viewport-fit-v55.css?v=1' "$entry"
          grep -Fq 'body:has(.dashboard-v37)' "$css"
          grep -Fq 'body:has(.library-shell)' "$css"
          grep -Fq 'body:has(.calendar-shell)' "$css"
          grep -Fq 'body.clients-app' "$css"
          grep -Fq 'overflow: hidden' "$css"
          grep -Fq 'grid-template-rows: auto minmax(0, 1fr)' "$css"

      - name: Verify deployment and asset injection
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://tv.neptunebusiness.com'
          ready=0
          for attempt in $(seq 1 42); do
            curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$BASE/api/public/release?viewport_fit=$GITHUB_RUN_ID-$attempt" > /tmp/release.json || true
            if grep -Fq '"viewportFit":"desktop-one-screen-task-layout-v55"' /tmp/release.json \
              && grep -Fq '"verticalScrollPolicy":"document-scroll-disabled-desktop-local-data-regions-only"' /tmp/release.json; then
              ready=1
              break
            fi
            sleep 10
          done
          cat /tmp/release.json
          test "$ready" = 1

          for path in '/espace-client/' '/espace-client/videos/' '/espace-client/calendrier/' '/studio/clients'; do
            curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$BASE$path?viewport_asset=$GITHUB_RUN_ID" > /tmp/page.html
            grep -Fq '/assets/neptune-viewport-fit-v55.css?v=1' /tmp/page.html
          done

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$BASE/assets/neptune-viewport-fit-v55.css?v=1" > /tmp/viewport.css
          grep -Fq 'body:has(.library-shell)' /tmp/viewport.css
          grep -Fq '.clients-app .pipeline' /tmp/viewport.css

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium

      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory neptune-tv-media-cloudflare/public >/tmp/neptune-static.log 2>&1 &
          echo $! > /tmp/neptune-static.pid
          sleep 2

      - name: Audit client and Studio viewport composition
        run: node tests/audit-viewport-v55.mjs

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neptune-viewport-fit-v55
          path: test-results/viewport-fit-v55
          if-no-files-found: warn
          retention-days: 7
