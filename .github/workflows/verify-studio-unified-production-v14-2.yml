name: Verify Studio Unified Production v14.2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-studio-unified-production-v14-2.yml'
      - '.github/scripts/verify-studio-unified-v14-2.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check production contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            'https://tv.neptunebusiness.com/api/public/release?verify=v14-2' > /tmp/release.json
          grep -Fq '"studioCanonicalPath":"/studio/clients"' /tmp/release.json
          grep -Fq '"legacyStudioDashboard":"removed"' /tmp/release.json
          grep -Fq '"retiredStudioAssets":"blocked-with-404"' /tmp/release.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://tv.neptunebusiness.com/studio/control-v37.js')" = '404'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://tv.neptunebusiness.com/studio/control-v36.css')" = '404'
          echo 'Contrat de production Studio unifié : OK'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright silently
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Diagnose canonical authenticated landing
        run: node .github/scripts/verify-studio-unified-v14-2.mjs

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-unified-production-v14-2
          path: |
            /tmp/studio-unified-v14-2.png
            /tmp/studio-unified-v14-2.json
          if-no-files-found: warn
