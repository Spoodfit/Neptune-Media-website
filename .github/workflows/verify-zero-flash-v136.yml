name: Verify Zero Flash V136

on:
  pull_request:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/src/entry-v40.js'
      - 'neptune-tv-media-cloudflare/src/studio-zero-flash-v136.js'
      - 'neptune-tv-media-cloudflare/src/client-zero-flash-v136.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-zero-flash-v136.*'
      - 'neptune-tv-media-cloudflare/public/espace-client/session-zero-flash-v136.*'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65-1.js'
      - 'neptune-tv-media-cloudflare/tests/zero-flash-v136.mjs'
      - '.github/workflows/verify-zero-flash-v136.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-zero-flash:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources
        run: |
          node --check neptune-tv-media-cloudflare/src/entry-v40.js
          node --check neptune-tv-media-cloudflare/src/studio-zero-flash-v136.js
          node --check neptune-tv-media-cloudflare/src/client-zero-flash-v136.js
          node --check neptune-tv-media-cloudflare/public/studio/studio-zero-flash-v136.js
          node --check neptune-tv-media-cloudflare/public/espace-client/session-zero-flash-v136.js
          node --check neptune-tv-media-cloudflare/tests/zero-flash-v136.mjs
          grep -Fq "from './studio-zero-flash-v136.js'" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -Fq "from './client-zero-flash-v136.js'" neptune-tv-media-cloudflare/src/entry-v40.js
      - name: Install Worker and browser dependencies
        run: |
          cd neptune-tv-media-cloudflare
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Start active Worker
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/"compatibility_date": "2026-07-30"/"compatibility_date": "2026-07-07"/' neptune-tv-media-cloudflare/wrangler.jsonc
          ./neptune-tv-media-cloudflare/node_modules/.bin/wrangler dev --config neptune-tv-media-cloudflare/wrangler.jsonc --local --port 8787 >/tmp/wrangler-v136.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/studio/clients >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/wrangler-v136.log
          exit 1
      - name: Audit first paint and equivalent state flashes
        working-directory: neptune-tv-media-cloudflare
        env:
          ZERO_FLASH_BASE_URL: http://127.0.0.1:8787
        run: node tests/zero-flash-v136.mjs
      - name: Dry-run active Worker bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-v136-dry-run
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zero-flash-v136-diagnostics
          path: /tmp/wrangler-v136.log
          if-no-files-found: warn
          retention-days: 5
