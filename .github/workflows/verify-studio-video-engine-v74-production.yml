name: Verify Studio Video Engine V74 Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-studio-video-engine-v74-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate every bridge reference
        shell: bash
        run: |
          set -euo pipefail
          echo '=== exact stale query ==='
          grep -R -n --exclude-dir=.git --exclude='*.map' -F 'video-ai-engine-v73.js?v=1' . || true
          echo '=== every bridge reference ==='
          grep -R -n --exclude-dir=.git --exclude='*.map' -F 'video-ai-engine-v73.js' . || true

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        base:
          - https://tv.neptunebusiness.com
          - https://neptune-media-webtv.neptunebusinessclub.workers.dev
    steps:
      - name: Collect deployed Studio assets
        shell: bash
        run: |
          set -euo pipefail
          query="verify_v74=$GITHUB_SHA"
          curl -fsSL --max-redirs 5 -D /tmp/html-headers.txt -H 'Cache-Control: no-cache, no-store' \
            "${{ matrix.base }}/studio/video-ai?$query" > /tmp/video-ai.html
          curl -fsS -D /tmp/bridge-headers.txt -H 'Cache-Control: no-cache, no-store' \
            "${{ matrix.base }}/studio/video-ai-engine-v73.js?v=74&$query" > /tmp/bridge.js
          curl -fsS -D /tmp/installer-headers.txt -H 'Cache-Control: no-cache, no-store' \
            "${{ matrix.base }}/studio/install-neptune-video-engine.ps1?$query" > /tmp/installer.ps1

      - name: Print exact marker matrix
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local file="$1"
            local marker="$2"
            if grep -Fq "$marker" "$file"; then
              printf 'true  | %s | %s\n' "$file" "$marker"
            else
              printf 'false | %s | %s\n' "$file" "$marker"
            fi
          }
          echo '=== sizes ==='
          wc -c /tmp/video-ai.html /tmp/bridge.js /tmp/installer.ps1
          echo '=== HTML script references ==='
          grep -oE '<script[^>]+src="[^"]+"' /tmp/video-ai.html || true
          echo '=== marker matrix ==='
          check /tmp/video-ai.html '/studio/video-ai-engine-v73.js?v=74'
          check /tmp/video-ai.html 'id="engineInstallButton"'
          check /tmp/bridge.js 'neptune-video-engine-20260803-v74'
          check /tmp/bridge.js 'Mettre à jour le moteur'
          check /tmp/bridge.js 'Moteur Neptune v74 connecté'
          check /tmp/installer.ps1 'NEPTUNE_TARGET_CLIPS_PER_HOUR=20'
          check /tmp/installer.ps1 'Mise à jour du moteur existant sans supprimer les productions'

      - name: Assert functional v74 assets
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id="engineInstallButton"' /tmp/video-ai.html
          grep -Fq 'neptune-video-engine-20260803-v74' /tmp/bridge.js
          grep -Fq 'Mettre à jour le moteur' /tmp/bridge.js
          grep -Fq 'Moteur Neptune v74 connecté' /tmp/bridge.js
          grep -Fq 'NEPTUNE_TARGET_CLIPS_PER_HOUR=20' /tmp/installer.ps1
          grep -Fq 'Mise à jour du moteur existant sans supprimer les productions' /tmp/installer.ps1
