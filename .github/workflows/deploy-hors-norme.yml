name: Deploy HORS NORME landing

on:
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/public/hors-norme/**'
      - '.github/workflows/deploy-hors-norme.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-hors-norme-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Prepare deploy config without custom-domain mutations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          delete config.route;
          delete config.routes;
          fs.writeFileSync('.wrangler-hors-norme.jsonc', JSON.stringify(config, null, 2) + '\n');
          NODE
          node -e "const c=require('./.wrangler-hors-norme.jsonc'); if(c.routes||c.route) process.exit(1); if(c.main!=='neptune-tv-media-cloudflare/src/entry-v48.js') process.exit(1);"

      - name: Deploy Worker assets
        run: npx wrangler deploy --config .wrangler-hors-norme.jsonc

      - name: Verify HORS NORME landing on workers.dev
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            html=$(curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$WORKERS_URL/hors-norme?release=$GITHUB_SHA&attempt=$attempt" || true)
            if grep -Fq '30 contenus minimum garantis' <<<"$html" \
              && grep -Fq '3 mois de contenus' <<<"$html" \
              && grep -Fq 'Arrêtez de chercher quoi publier' <<<"$html"; then
              ready=1
              echo "HORS NORME landing verified on attempt $attempt."
              break
            fi
            sleep 5
          done
          test "$ready" = 1
