name: Apply Neptune Video Engine V74 Runtime Injection

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-video-engine-v74-runtime-injection.py'
      - '.github/workflows/apply-video-engine-v74-runtime-injection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/video-engine-v74-runtime-injection
          fetch-depth: 0

      - name: Apply runtime injection fix
        run: python scripts/apply-video-engine-v74-runtime-injection.py

      - name: Validate Worker and Studio
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const PERMANENT_ENGINE_UI_JS = '/studio/video-ai-engine-v73.js?v=74';" neptune-tv-media-cloudflare/src/entry-v16.js
          ! grep -Fq "const PERMANENT_ENGINE_UI_JS = '/studio/video-ai-engine-v73.js?v=1';" neptune-tv-media-cloudflare/src/entry-v16.js
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm run check

      - name: Commit validated runtime file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neptune-tv-media-cloudflare/src/entry-v16.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix(video-engine): inject v74 Studio bridge at runtime'
          git push origin HEAD:fix/video-engine-v74-runtime-injection
