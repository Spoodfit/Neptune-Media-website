name: Validate Neptune Video Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'neptune-video-engine/**'
      - 'neptune-tv-media-cloudflare/public/studio/install-neptune-video-engine.ps1'
      - 'neptune-tv-media-cloudflare/public/studio/video-ai-engine-v73.js'
      - 'neptune-tv-media-cloudflare/public/studio/video-ai.html'
      - 'neptune-tv-media-cloudflare/src/**'
      - 'neptune-tv-media-cloudflare/scripts/smoke-test-v73.mjs'
      - 'neptune-tv-media-cloudflare/scripts/validate-video-generation-v75-1.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/video-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-video-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate engine and compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            neptune-video-engine/app.py \
            neptune-video-engine/runtime.py \
            neptune-video-engine/runtime_v74.py \
            neptune-video-engine/runtime_v75.py
          ! grep -Fq '"class_name": "WebTvEncoder"' wrangler.jsonc
          ! grep -Fq '"WEBTV_ENCODER"' wrangler.jsonc
          grep -Fq '"bucket_name": "neptune-media-assets"' wrangler.jsonc
          ! grep -Fq '"class_name": "VideoProcessor"' wrangler.jsonc
          ! grep -Fq '"class_name": "VideoProcessorV2"' wrangler.jsonc
          ! grep -Fq '"VIDEO_PROCESSOR"' wrangler.jsonc
          ! grep -Fq '"VIDEO_JOBS"' wrangler.jsonc
          grep -Fq 'from runtime_v75 import app as app' neptune-video-engine/runtime.py
          grep -Fq 'neptune-video-engine-20260803-v75' neptune-video-engine/runtime_v75.py
          grep -Fq 'FaceDetectorYN_create' neptune-video-engine/runtime_v75.py
          grep -Fq 'sentence-density-v75' neptune-video-engine/runtime_v75.py
          grep -Fq 'core.select_candidates = select_candidates' neptune-video-engine/runtime_v75.py
          grep -Fq 'core.write_subtitles = write_subtitles' neptune-video-engine/runtime_v75.py
          grep -Fq 'core.render_clip = render_clip' neptune-video-engine/runtime_v75.py
          grep -Fq 'runtime:app' neptune-video-engine/Dockerfile
          grep -Fq 'restart: unless-stopped' neptune-video-engine/docker-compose.yml
          grep -Fq 'neptune_video_data' neptune-video-engine/docker-compose.yml
          grep -Fq '/studio/video-ai-engine-v73.js?v=75' neptune-tv-media-cloudflare/public/studio/video-ai.html
          grep -Fq 'neptune-video-engine-20260803-v75' neptune-tv-media-cloudflare/public/studio/video-ai-engine-v73.js
          grep -Fq 'docker compose up -d --build' neptune-tv-media-cloudflare/public/studio/install-neptune-video-engine.ps1

      - name: Install and validate application
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm run check

      - name: Build video engine image
        run: docker build -t neptune-video-engine:ci neptune-video-engine

      - name: Verify one-hour density, exact hooks, face detection and captions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python neptune-video-engine:ci - <<'PY'
          import tempfile
          from pathlib import Path
          import runtime_v75 as v

          assert v.VERSION == 'neptune-video-engine-20260803-v75'
          assert v.get_yunet() is not None, 'YuNet model was not loaded'
          segments = []
          for index in range(120):
              start = index * 30.0
              text = (
                  f"La vérité numéro {index + 1}, c'est que cette erreur coûte du temps aux entreprises. "
                  "Voici comment un client peut appliquer une méthode concrète et obtenir un résultat mesurable."
              )
              words = v.v74.synthetic_words(text, start, start + 24.0)
              segments.append({'start': start, 'end': start + 24.0, 'text': text, 'words': words})
          transcript = {'text': ' '.join(item['text'] for item in segments), 'segments': segments}
          media = {'durationSeconds': 3600.0, 'width': 1920, 'height': 1080, 'audioCodec': 'aac'}
          candidates = v.local_sentence_candidates(transcript, media)
          assert 16 <= len(candidates) <= 24, len(candidates)
          assert all(item['score'] >= v.MIN_SCORE for item in candidates)
          assert all(item['hookMoment'] in item['transcriptSegments'][0]['text'] for item in candidates)
          candidate = candidates[0]
          v.v74.build_montage_segments(candidate)
          with tempfile.TemporaryDirectory() as directory:
              subtitle_path = Path(directory) / 'captions.ass'
              v.write_subtitles._candidate = candidate
              v.write_subtitles(subtitle_path, candidate['transcriptSegments'], candidate['startSeconds'], candidate['endSeconds'])
              v.write_subtitles._candidate = None
              content = subtitle_path.read_text(encoding='utf-8')
              assert 'MarginL, MarginR, MarginV' in content
              assert '&H006FE8FF' in content
              assert 'NeptuneCaption' in content
          print({'candidateCount': len(candidates), 'minimumScore': min(item['score'] for item in candidates)})
          PY

      - name: Start engine API
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name neptune-video-engine-ci \
            -p 127.0.0.1:4318:4318 \
            -e NEPTUNE_ENGINE_TOKEN=ci-token \
            -e NEPTUNE_ENGINE_WORKERS=1 \
            -e NEPTUNE_ENGINE_TEST_MODE=1 \
            neptune-video-engine:ci
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'X-Neptune-Engine-Token: ci-token' http://127.0.0.1:4318/health > /tmp/video-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          grep -Fq '"ok":true' /tmp/video-health.json
          grep -Fq 'neptune-video-engine-20260803-v75' /tmp/video-health.json

      - name: Verify browser private-network preflight
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/video-pna-headers.txt -o /tmp/video-pna-body.txt -X OPTIONS \
            -H 'Origin: https://tv.neptunebusiness.com' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: X-Neptune-Engine-Token' \
            -H 'Access-Control-Request-Private-Network: true' \
            http://127.0.0.1:4318/health
          grep -Fqi 'access-control-allow-private-network: true' /tmp/video-pna-headers.txt
          grep -Fqi 'access-control-allow-origin: https://tv.neptunebusiness.com' /tmp/video-pna-headers.txt

      - name: Generate and submit deterministic interview
        shell: bash
        run: |
          set -euo pipefail
          docker exec neptune-video-engine-ci ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=1280x720:rate=25 \
            -f lavfi -i sine=frequency=660:sample_rate=48000 \
            -t 12 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac \
            -shortest -y /tmp/neptune-video-source.mp4
          docker cp neptune-video-engine-ci:/tmp/neptune-video-source.mp4 /tmp/neptune-video-source.mp4
          test "$(stat -c%s /tmp/neptune-video-source.mp4)" -gt 20000
          curl -fsS -H 'X-Neptune-Engine-Token: ci-token' \
            -F 'metadata={"jobId":"ci-video-render-job","objective":"Valider le rendu Neptune"}' \
            -F 'file=@/tmp/neptune-video-source.mp4;type=video/mp4' \
            http://127.0.0.1:4318/v1/jobs > /tmp/video-submit.json
          grep -Fq '"accepted":true' /tmp/video-submit.json

      - name: Wait for rendered short
        shell: bash
        run: |
          set -euo pipefail
          completed=0
          for attempt in $(seq 1 120); do
            curl -fsS -H 'X-Neptune-Engine-Token: ci-token' http://127.0.0.1:4318/v1/jobs/ci-video-render-job > /tmp/video-job.json
            status=$(python -c "import json; print(json.load(open('/tmp/video-job.json'))['job']['status'])")
            if [ "$status" = 'completed' ]; then completed=1; break; fi
            if [ "$status" = 'failed' ]; then
              cat /tmp/video-job.json
              docker logs --tail 300 neptune-video-engine-ci
              exit 1
            fi
            sleep 2
          done
          test "$completed" = 1
          python - <<'PY'
          import json
          data = json.load(open('/tmp/video-job.json'))['job']
          assert data['progress'] == 100, data
          assert data['result']['candidates'], data['result']
          open('/tmp/video-clip-id.txt', 'w').write(data['result']['candidates'][0]['id'])
          PY

      - name: Download and inspect rendered media
        shell: bash
        run: |
          set -euo pipefail
          clip_id=$(cat /tmp/video-clip-id.txt)
          curl -fsS -H 'X-Neptune-Engine-Token: ci-token' http://127.0.0.1:4318/v1/jobs/ci-video-render-job/preview > /tmp/video-preview.jpg
          test "$(stat -c%s /tmp/video-preview.jpg)" -gt 1000
          curl -fsS -H 'X-Neptune-Engine-Token: ci-token' "http://127.0.0.1:4318/v1/jobs/ci-video-render-job/clips/$clip_id" > /tmp/video-short.mp4
          test "$(stat -c%s /tmp/video-short.mp4)" -gt 20000
          docker cp /tmp/video-short.mp4 neptune-video-engine-ci:/tmp/video-short.mp4
          docker exec neptune-video-engine-ci ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/video-short.mp4 > /tmp/video-dimensions.txt
          grep -Fxq '1080,1920' /tmp/video-dimensions.txt

      - name: Print diagnostics on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/video-health.json 2>/dev/null || true
          cat /tmp/video-job.json 2>/dev/null || true
          docker logs --tail 400 neptune-video-engine-ci 2>&1 || true

      - name: Stop engine API
        if: always()
        run: docker rm -f neptune-video-engine-ci || true

      - name: Validate deployable Cloudflare bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-video-engine-dry-run
