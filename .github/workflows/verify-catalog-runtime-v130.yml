name: Verify Catalogue Compatibility V131

on:
  pull_request:
    paths:
      - 'neptune-tv-media-cloudflare/src/entry-v40.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-cockpit-v131.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-cockpit-v131.css'
      - '.github/workflows/verify-catalog-runtime-v130.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog-compat-v131:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: neptune-tv-media-cloudflare
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Validate compatibility contract
        run: |
          node --check neptune-tv-media-cloudflare/src/entry-v40.js
          grep -Fq "CATALOG_RUNTIME_RELEASE='neptune-studio-catalog-cockpit-20260820-v131'" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -Fq "CATALOG_VISUAL_RELEASE='neptune-studio-catalog-visual-20260820-v132'" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -Fq 'application/x-neptune-compat' neptune-tv-media-cloudflare/src/entry-v40.js
      - name: Start active Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/"compatibility_date": "2026-07-30"/"compatibility_date": "2026-07-07"/' neptune-tv-media-cloudflare/wrangler.jsonc
          ./neptune-tv-media-cloudflare/node_modules/.bin/wrangler dev --config neptune-tv-media-cloudflare/wrangler.jsonc --local --port 8787 > /tmp/wrangler-catalog-compat.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error -D /tmp/catalog-compat.headers http://127.0.0.1:8787/studio/advanced.html > /tmp/catalog-compat.html; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/wrangler-catalog-compat.log; exit 1; fi
          grep -Fqi 'x-neptune-catalog-runtime: neptune-studio-catalog-cockpit-20260820-v131' /tmp/catalog-compat.headers
          grep -Fqi 'x-neptune-catalog-visual: neptune-studio-catalog-visual-20260820-v132' /tmp/catalog-compat.headers
          grep -Fq 'type="application/x-neptune-compat"' /tmp/catalog-compat.html
          grep -Fq '/studio/studio-catalog-cockpit-v131.js?v=1' /tmp/catalog-compat.html
          grep -Fq '/studio/studio-catalog-visual-v132.js?v=1' /tmp/catalog-compat.html
          grep -Fq '/studio/studio-catalog-visual-v132.css?v=1' /tmp/catalog-compat.html
