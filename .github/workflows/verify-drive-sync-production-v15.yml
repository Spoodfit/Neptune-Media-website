name: Verify Drive Sync Production v15

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-drive-sync-production-v15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-drive-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_URL: https://tv.neptunebusiness.com
    steps:
      - name: Wait for Drive sync deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$PUBLIC_URL/api/public/release?drive-sync=$attempt" > /tmp/release.json || true
            if grep -Fq '"release":"neptune-drive-delivery-sync-20260725-v15"' /tmp/release.json \
              && grep -Fq '"driveSecretPresent":true' /tmp/release.json \
              && grep -Fq '"driveFolderArchitecture":"client/passage/long-and-shorts"' /tmp/release.json; then
              cat /tmp/release.json
              exit 0
            fi
            sleep 10
          done
          cat /tmp/release.json
          exit 1

      - name: Verify webhook security and UI assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --silent --output /tmp/plan.json --write-out '%{http_code}' -X POST "$PUBLIC_URL/api/webhooks/drive/sync-plan")" = '401'
          grep -Fq '"error":"unauthorized"' /tmp/plan.json

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/espace-client/?verify=$GITHUB_SHA" > /tmp/client.html
          grep -Fq '/espace-client/workflow-v45.js?v=7' /tmp/client.html
          grep -Fq '/espace-client/workflow-v45.css?v=7' /tmp/client.html

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/studio/clients?verify=$GITHUB_SHA" > /tmp/studio.html
          grep -Fq '/studio/drive-sync-v47.js?v=1' /tmp/studio.html
          grep -Fq '/studio/drive-sync-v47.css?v=1' /tmp/studio.html

          curl --fail --silent --show-error "$PUBLIC_URL/studio/drive-sync-v47.js?v=1" | grep -Fq 'studioDrivePanel'
          curl --fail --silent --show-error "$PUBLIC_URL/espace-client/workflow-v45.js?v=7" | grep -Fq 'clientDriveDeliveries'
          echo 'Production Drive sync contract: OK'
