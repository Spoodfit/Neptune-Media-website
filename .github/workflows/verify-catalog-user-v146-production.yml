name: Verify Catalog User Reliability V146 Production

on:
  workflow_run:
    workflows: ["Deploy Neptune Media to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify production assets and protected data boundary
        shell: bash
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          verify() {
            local base="$1" slug="$2" ok=0
            mkdir -p /tmp/catalog-v146
            for attempt in $(seq 1 24); do
              q="v146=$HEAD_SHA&attempt=$attempt"
              curl -fsS -D "/tmp/catalog-v146/$slug.headers" -H 'Cache-Control: no-cache, no-store' "$base/studio/advanced.html?$q" > "/tmp/catalog-v146/$slug.html" || true
              curl -fsS -H 'Cache-Control: no-cache, no-store' "$base/studio/studio-catalog-commercial-cockpit-v145.js?$q" > "/tmp/catalog-v146/$slug-v145.js" || true
              curl -fsS -H 'Cache-Control: no-cache, no-store' "$base/studio/studio-catalog-user-reliability-v146.js?$q" > "/tmp/catalog-v146/$slug-v146.js" || true
              status=$(curl -sS -o "/tmp/catalog-v146/$slug-protected.json" -w '%{http_code}' -X POST "$base/api/admin/media-catalog-v98/context" -H "Origin: $base" -H 'Content-Type: application/json' --data '{}' || true)
              if grep -Fqi 'x-neptune-catalog-cockpit: v145' "/tmp/catalog-v146/$slug.headers" \
                && grep -Fqi 'x-neptune-catalog-reliability: v146' "/tmp/catalog-v146/$slug.headers" \
                && grep -Fq '/studio/studio-catalog-commercial-cockpit-v145.js?v=1' "/tmp/catalog-v146/$slug.html" \
                && grep -Fq '/studio/studio-catalog-user-reliability-v146.js?v=1' "/tmp/catalog-v146/$slug.html" \
                && grep -Fq 'neptune-catalog-user-reliability-v146-20260825' "/tmp/catalog-v146/$slug-v146.js" \
                && grep -Fq 'commercialCityIds' "/tmp/catalog-v146/$slug-v145.js" \
                && grep -Fq 'commercialSupplierIds' "/tmp/catalog-v146/$slug-v145.js" \
                && grep -Fq "if(state.status==='hidden')state.showInactive=true" "/tmp/catalog-v146/$slug-v145.js" \
                && grep -Fq "clean.startsWith('/')" "/tmp/catalog-v146/$slug-v145.js" \
                && grep -Fq "pop.setAttribute('role','menu')" "/tmp/catalog-v146/$slug-v145.js" \
                && { test "$status" = 401 || test "$status" = 403; }; then
                ok=1; echo "$base: native v145 fixes + v146 certification verified"; break
              fi
              sleep 5
            done
            test "$ok" = 1
          }
          verify https://neptune-media-webtv.neptunebusinessclub.workers.dev workers
          verify https://tv.neptunebusiness.com public
