<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neptune Media · Réserver votre passage</title>
<meta name="description" content="Choisissez votre ville, votre format Neptune Media, votre offre et sécurisez votre passage.">
<link rel="icon" href="/reserver/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/reserver/assets/styles-v96.css">
<style>.cal-nav{width:44px;height:44px;min-width:44px;min-height:44px}.day{min-height:44px}@media(max-width:420px){.cal-head{grid-template-columns:44px 1fr 44px}}@media(max-width:820px){.screen{align-items:flex-start}.shell{margin:0 auto}}</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="/reserver" aria-label="Neptune Media"><img src="/reserver/favicon.svg" alt=""><span>Neptune Media</span></a>
    <div class="progress" id="progress" aria-label="Progression de la réservation"></div>
    <div class="secure">Paiement sécurisé</div>
  </header>
  <div class="launch-banner"><div class="launch-track"><span>Un passage. Un format. Une équipe qui s’occupe du reste.</span><span>Choisissez votre ville et votre concept.</span><span>Paiement sécurisé avec Stripe.</span></div></div>
  <main class="stage">
    <section class="screen active">
      <div class="shell" id="app-content" aria-live="polite"></div>
    </section>
  </main>
</div>
<script>
(() => {
  const stage = document.querySelector('.stage');
  const content = document.getElementById('app-content');
  if (!stage || !content) return;
  new MutationObserver(() => {
    stage.scrollTop = 0;
    stage.scrollLeft = 0;
  }).observe(content, { childList: true });
})();
</script>
<script type="module" src="/reserver/assets/app-v96.js"></script>
</body>
</html>
