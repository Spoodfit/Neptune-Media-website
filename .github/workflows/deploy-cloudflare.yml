name: Deploy Neptune Media to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/src/**'
      - 'neptune-tv-media-cloudflare/public/**'
      - 'neptune-tv-media-cloudflare/containers/**'
      - 'neptune-tv-media-cloudflare/local-video-engine/**'
      - 'neptune-tv-media-cloudflare/scripts/**'
      - 'neptune-tv-media-cloudflare/tests/**'
      - 'wrangler.jsonc'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/verify-production-after-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-media-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Verify migration boundaries
        run: npm run audit:migration

      - name: Validate application
        run: npm run check

      - name: Validate Worker bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-dry-run

      - name: Prepare immutable deploy config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          delete config.route;
          delete config.routes;
          const expected = 'neptune-tv-media-cloudflare/src/entry-v48.js';
          if (config.main !== expected) {
            throw new Error(`Unexpected Worker entry: ${config.main}; expected ${expected}`);
          }
          fs.writeFileSync('.wrangler-ci-deploy.jsonc', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config .wrangler-ci-deploy.jsonc

      - name: Verify deployed Worker responds
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 24); do
            release=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache, no-store' "$WORKERS_URL/api/public/release?deploy=$GITHUB_SHA&attempt=$attempt" || true)
            if RELEASE_JSON="$release" node <<'NODE'
          const payload = JSON.parse(process.env.RELEASE_JSON || '{}');
          if (!payload || typeof payload !== 'object' || Array.isArray(payload)) process.exit(1);
          NODE
            then
              ready=1
              echo "Worker responded with a valid release payload on attempt $attempt."
              break
            fi
            sleep 5
          done
          test "$ready" = 1
