name: Diagnose WebTV Timestamps V119.6

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-webtv-timestamps-v1196.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timestamps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://tv.neptunebusiness.com
    steps:
      - uses: actions/checkout@v4
      - name: Trace audio and video DTS across the current HLS window
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || { sudo apt-get update >/dev/null; sudo apt-get install -y ffmpeg >/dev/null; }
          mkdir -p /tmp/webtv-ts
          curl -fsS "$BASE/direct/live/index.m3u8" -o /tmp/webtv-ts/index.m3u8
          cat /tmp/webtv-ts/index.m3u8
          grep -E '^segment-[0-9]+\.ts$' /tmp/webtv-ts/index.m3u8 > /tmp/webtv-ts/segments.txt
          while read -r segment; do
            curl -fsS "$BASE/direct/live/$segment" -o "/tmp/webtv-ts/$segment"
          done < /tmp/webtv-ts/segments.txt
          python3 - <<'PY'
          import json, subprocess, pathlib
          root=pathlib.Path('/tmp/webtv-ts')
          rows=[]
          failures=[]
          previous={'video':None,'audio':None}
          for name in root.joinpath('segments.txt').read_text().splitlines():
              path=root/name
              row={'segment':name}
              for kind,selector in [('video','v:0'),('audio','a:0')]:
                  raw=subprocess.check_output(['ffprobe','-v','error','-select_streams',selector,'-show_entries','packet=dts_time,pts_time,duration_time,flags','-of','json',str(path)],text=True)
                  packets=json.loads(raw).get('packets') or []
                  dts=[float(p['dts_time']) for p in packets if p.get('dts_time') not in (None,'N/A')]
                  pts=[float(p['pts_time']) for p in packets if p.get('pts_time') not in (None,'N/A')]
                  durations=[float(p['duration_time']) for p in packets if p.get('duration_time') not in (None,'N/A')]
                  inside=sum(1 for a,b in zip(dts,dts[1:]) if b<=a)
                  first=dts[0] if dts else None
                  last=dts[-1] if dts else None
                  end=(last+(durations[-1] if durations else 0)) if last is not None else None
                  cross=previous[kind] is not None and first is not None and first<previous[kind]-0.00001
                  row.update({
                      f'{kind}_first_dts':first,
                      f'{kind}_last_dts':last,
                      f'{kind}_end_dts':end,
                      f'{kind}_first_pts':pts[0] if pts else None,
                      f'{kind}_last_pts':pts[-1] if pts else None,
                      f'{kind}_packets':len(dts),
                      f'{kind}_non_increasing_inside':inside,
                      f'{kind}_backwards_from_previous':cross,
                  })
                  if inside: failures.append(f'{name}:{kind}:inside={inside}')
                  if cross: failures.append(f'{name}:{kind}:previous_end={previous[kind]} first={first}')
                  if end is not None: previous[kind]=end
              if row.get('video_first_dts') is not None and row.get('audio_first_dts') is not None:
                  row['av_start_delta']=row['audio_first_dts']-row['video_first_dts']
              if row.get('video_end_dts') is not None and row.get('audio_end_dts') is not None:
                  row['av_end_delta']=row['audio_end_dts']-row['video_end_dts']
              rows.append(row)
          print(json.dumps(rows,indent=2))
          print('FAILURES',json.dumps(failures,indent=2))
          max_start=max((abs(r.get('av_start_delta',0)) for r in rows),default=0)
          max_end=max((abs(r.get('av_end_delta',0)) for r in rows),default=0)
          print('MAX_AV_START_DELTA',max_start,'MAX_AV_END_DELTA',max_end)
          if failures: raise SystemExit('non-monotonic audio/video DTS detected')
          PY
