name: Verify Studio Runtime V115 Production

on:
  workflow_run:
    workflows: ["Deploy Neptune Media to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-studio-runtime-v115-production
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Diffusion, Réglages and tunnel preview v115 in production
        env:
          STUDIO_PRODUCTION_BASE_URLS: https://neptune-media-webtv.neptunebusinessclub.workers.dev,https://tv.neptunebusiness.com
          STUDIO_PRODUCTION_ATTEMPTS: '24'
          STUDIO_PRODUCTION_DELAY_MS: '5000'
        run: node neptune-tv-media-cloudflare/scripts/verify-studio-runtime-production-v115.mjs
