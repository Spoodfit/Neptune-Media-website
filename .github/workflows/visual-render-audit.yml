name: Visual Render Audit

on:
  workflow_run:
    workflows: ['Deploy Neptune Media to Cloudflare']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-visual-render-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://tv.neptunebusiness.com
      PUBLIC_URL: https://tv.neptunebusiness.com
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit runtime
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for deployed public ingress
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE_URL/api/health?visual_release=$DEPLOY_SHA&attempt=$attempt" | grep -q '"ok":true'; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1

      - name: Run UI quality contract
        run: node neptune-tv-media-cloudflare/scripts/qa-production-ui.mjs

      - name: Capture full visual render audit
        env:
          VISUAL_AUDIT_DIR: visual-audit/latest
        run: node neptune-tv-media-cloudflare/scripts/visual-render-audit.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neptune-visual-audit-${{ github.run_id }}
          path: |
            artifacts/ui-qa/
            visual-audit/latest/
          if-no-files-found: warn
          retention-days: 14
