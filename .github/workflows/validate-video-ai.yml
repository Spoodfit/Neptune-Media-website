name: Validate Neptune Video Local Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/src/**'
      - 'neptune-tv-media-cloudflare/public/studio/**'
      - 'neptune-tv-media-cloudflare/local-video-engine/**'
      - 'neptune-tv-media-cloudflare/scripts/**'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'neptune-tv-media-cloudflare/package.json'
      - '.github/workflows/validate-video-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install Worker and local engine dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build and validate application
        run: npm run check

      - name: Confirm local browser video architecture
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '"containers"' wrangler.jsonc
          ! grep -Fq '"VIDEO_PROCESSOR"' wrangler.jsonc
          ! grep -Fq '"VIDEO_JOBS"' wrangler.jsonc
          ! grep -Fq '"containers"' neptune-tv-media-cloudflare/wrangler.jsonc
          ! grep -Fq '"VIDEO_PROCESSOR"' neptune-tv-media-cloudflare/wrangler.jsonc
          ! grep -Fq '"VIDEO_JOBS"' neptune-tv-media-cloudflare/wrangler.jsonc
          grep -Fq '"tag": "v5"' wrangler.jsonc
          grep -Fq '"deleted_classes": ["VideoProcessorV2"]' wrangler.jsonc
          grep -Fq "from './video-ai-local-routes-v1.js'" neptune-tv-media-cloudflare/src/entry-v16.js
          grep -Fq "videoAiEngineMode: 'browser-local'" neptune-tv-media-cloudflare/src/entry-v16.js
          grep -Fq "videoAiDispatchMode: 'no-container-no-queue'" neptune-tv-media-cloudflare/src/entry-v16.js
          grep -Fq 'videoAiContainerRequired: false' neptune-tv-media-cloudflare/src/entry-v16.js
          grep -Fq "'/portal/video-ai-retire-cloud-jobs'" neptune-tv-media-cloudflare/src/entry-v16.js
          grep -Fq 'cloud_engine_retired_use_local' neptune-tv-media-cloudflare/src/store-v13.js
          grep -Fq 'NEPTUNE VIDEO ENGINE LOCAL' neptune-tv-media-cloudflare/public/studio/video-ai.html
          grep -Fq '/studio/local-engine/neptune-video-local-engine-v1.js?v=72' neptune-tv-media-cloudflare/public/studio/video-ai.html
          grep -Fq 'openAiSemanticAssistPlugin' neptune-tv-media-cloudflare/local-video-engine/vite.config.js
          grep -Fq 'startLocalProduction' neptune-tv-media-cloudflare/local-video-engine/src/main.js
          grep -Fq 'processFileLocally' neptune-tv-media-cloudflare/local-video-engine/src/main.js
          grep -Fq 'renderCandidate' neptune-tv-media-cloudflare/local-video-engine/src/main.js
          grep -Fq 'workersAiAssistAvailable' neptune-tv-media-cloudflare/public/studio/local-engine/neptune-video-local-engine-v1.js
          if grep -Eq 'video-ai-(cloud-resilience-v67|dispatch-recovery-v68|story-v7[01])\.js' neptune-tv-media-cloudflare/public/studio/video-ai.html; then
            echo 'Un ancien runtime cloud ou de fausse relance est encore chargé.' >&2
            exit 1
          fi

      - name: Validate deployable free-plan Worker bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-dry-run
