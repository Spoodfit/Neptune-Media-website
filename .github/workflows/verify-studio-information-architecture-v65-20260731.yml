name: Verify Studio Information Architecture V65

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-studio-information-architecture-v65-20260731.yml'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'neptune-tv-media-cloudflare/src/entry-v34.js'
      - 'neptune-tv-media-cloudflare/src/entry-v36.js'
      - 'neptune-tv-media-cloudflare/src/media-catalog-visuals-v98.js'
      - 'neptune-tv-media-cloudflare/src/portal-media-catalog-v98.js'
      - 'neptune-tv-media-cloudflare/public/studio/app.html'
      - 'neptune-tv-media-cloudflare/public/studio/studio-app-router-v104.js'
      - 'neptune-tv-media-cloudflare/public/studio/media-catalog-loader-v104.js'
      - 'neptune-tv-media-cloudflare/public/studio/clients.html'
      - 'neptune-tv-media-cloudflare/public/studio/video-ai.html'
      - 'neptune-tv-media-cloudflare/public/studio/webtv.html'
      - 'neptune-tv-media-cloudflare/public/studio/advanced.html'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65-1.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-shell-v105.css'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-information-architecture-v65.mjs'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-unified.mjs'
      - 'neptune-tv-media-cloudflare/scripts/verify-media-catalog-v98.mjs'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-shell-v105-entry.mjs'
      - 'neptune-tv-media-cloudflare/tests/audit-studio-information-architecture-v65.mjs'
      - 'neptune-tv-media-cloudflare/tests/audit-media-catalog-v109.mjs'
  push:
    branches:
      - main
      - 'fix/studio-*'
      - 'fix/settings-*'
      - 'fix/catalog-*'
    paths:
      - '.github/workflows/verify-studio-information-architecture-v65-20260731.yml'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'neptune-tv-media-cloudflare/src/entry-v34.js'
      - 'neptune-tv-media-cloudflare/src/entry-v36.js'
      - 'neptune-tv-media-cloudflare/src/media-catalog-visuals-v98.js'
      - 'neptune-tv-media-cloudflare/src/portal-media-catalog-v98.js'
      - 'neptune-tv-media-cloudflare/public/studio/app.html'
      - 'neptune-tv-media-cloudflare/public/studio/studio-app-router-v104.js'
      - 'neptune-tv-media-cloudflare/public/studio/media-catalog-loader-v104.js'
      - 'neptune-tv-media-cloudflare/public/studio/clients.html'
      - 'neptune-tv-media-cloudflare/public/studio/video-ai.html'
      - 'neptune-tv-media-cloudflare/public/studio/webtv.html'
      - 'neptune-tv-media-cloudflare/public/studio/advanced.html'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65-1.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-shell-v105.css'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-information-architecture-v65.mjs'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-unified.mjs'
      - 'neptune-tv-media-cloudflare/scripts/verify-media-catalog-v98.mjs'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-shell-v105-entry.mjs'
      - 'neptune-tv-media-cloudflare/tests/audit-studio-information-architecture-v65.mjs'
      - 'neptune-tv-media-cloudflare/tests/audit-media-catalog-v109.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-studio-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: neptune-tv-media-cloudflare
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Validate architecture sources
        working-directory: neptune-tv-media-cloudflare
        run: |
          node --check src/entry-v34.js
          node --check src/entry-v36.js
          node --check src/media-catalog-visuals-v98.js
          node --check src/portal-media-catalog-v98.js
          node --check public/studio/studio-app-router-v104.js
          node --check public/studio/media-catalog-loader-v104.js
          node --check public/studio/studio-information-architecture-v65-1.js
          node --check tests/audit-studio-information-architecture-v65.mjs
          node --check tests/audit-media-catalog-v109.mjs
          node scripts/verify-studio-information-architecture-v65.mjs
          node scripts/verify-studio-unified.mjs
          node scripts/verify-media-catalog-v98.mjs
          node scripts/verify-studio-shell-v105-entry.mjs

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start active local Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/"compatibility_date": "2026-07-30"/"compatibility_date": "2026-07-07"/' neptune-tv-media-cloudflare/wrangler.jsonc
          ./neptune-tv-media-cloudflare/node_modules/.bin/wrangler dev --config neptune-tv-media-cloudflare/wrangler.jsonc --local --port 8787 > /tmp/wrangler-v105.log 2>&1 &
          echo $! > /tmp/wrangler-v105.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location http://127.0.0.1:8787/studio/clients > /tmp/studio-v105.html; then
              if grep -Fq '/studio/studio-information-architecture-v65.css?v=1' /tmp/studio-v105.html \
                && grep -Fq '/studio/studio-shell-v105.css?v=3' /tmp/studio-v105.html \
                && grep -Fq '/studio/studio-information-architecture-v65-1.js?v=107' /tmp/studio-v105.html \
                && grep -Fq 'data-neptune-studio-shell-boot="v105"' /tmp/studio-v105.html \
                && ! grep -Fq 'studio_embed=' /tmp/studio-v105.html; then
                ready=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/wrangler-v105.log
            exit 1
          fi

      - name: Audit Studio v105 canonical sidebar
        env:
          STUDIO_BASE_URL: http://127.0.0.1:8787
          OUTPUT_DIR: test-results/studio-information-architecture-v105
        run: node neptune-tv-media-cloudflare/tests/audit-studio-information-architecture-v65.mjs

      - name: Audit Catalogue Media v109 regressions
        env:
          STUDIO_BASE_URL: http://127.0.0.1:8787
        run: node neptune-tv-media-cloudflare/tests/audit-media-catalog-v109.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-information-architecture-v109-evidence
          path: |
            test-results/studio-information-architecture-v105
            /tmp/wrangler-v105.log
          if-no-files-found: warn
          retention-days: 14
