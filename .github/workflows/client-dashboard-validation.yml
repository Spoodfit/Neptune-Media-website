name: Client Dashboard Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/public/espace-client/**'
      - 'neptune-tv-media-cloudflare/public/assets/media-dialog-safety-v50.js'
      - 'neptune-tv-media-cloudflare/src/entry-v38.js'
      - 'neptune-tv-media-cloudflare/src/store-v29.js'
      - 'neptune-tv-media-cloudflare/src/portal-client-direct-booking-v118-5.js'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'tests/client-dashboard-visual.mjs'
      - 'tests/client-content-runtime.mjs'
      - 'tests/client-command-center-v117.mjs'
      - 'tests/client-command-center-v118.mjs'
      - 'tests/client-visual-coherence-v118-2.mjs'
      - 'tests/client-ux-polish-v118-3.mjs'
      - 'tests/client-ux-v118-4.mjs'
      - 'tests/client-direct-booking-v118-5.mjs'
      - 'tests/client-production-real-account-audit.mjs'
      - 'tests/client-production-direct-booking-v118-5.mjs'
      - '.github/workflows/client-dashboard-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local static application
        shell: bash
        run: |
          python3 -m http.server 4173 --directory neptune-tv-media-cloudflare/public > /tmp/client-dashboard-server.log 2>&1 &
          echo $! > /tmp/client-dashboard-server.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/espace-client/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/client-dashboard-server.log
          exit 1

      - name: Validate responsive dashboard
        shell: bash
        env:
          DASHBOARD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/client-dashboard-visual.mjs 2>&1 | tee /tmp/client-dashboard-run.log

      - name: Validate v117 client command center
        shell: bash
        env:
          DASHBOARD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/client-command-center-v117.mjs 2>&1 | tee /tmp/client-command-center-v117.log

      - name: Validate v118 contextual client command center
        shell: bash
        env:
          DASHBOARD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/client-command-center-v118.mjs 2>&1 | tee /tmp/client-command-center-v118.log

      - name: Validate v118.2 visual coherence
        shell: bash
        env:
          DASHBOARD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/client-visual-coherence-v118-2.mjs 2>&1 | tee /tmp/client-visual-coherence-v118-2.log

      - name: Validate v118.3 UX polish
        shell: bash
        env:
          DASHBOARD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/client-ux-polish-v118-3.mjs 2>&1 | tee /tmp/client-ux-polish-v118-3.log

      - name: Validate v118.4 client planning UX
        shell: bash
        env:
          DASHBOARD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/client-ux-v118-4.mjs 2>&1 | tee /tmp/client-ux-v118-4.log

      - name: Validate v118.5 direct client booking
        shell: bash
        env:
          DASHBOARD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/client-direct-booking-v118-5.mjs 2>&1 | tee /tmp/client-direct-booking-v118-5.log

      - name: Validate authenticated content runtime
        shell: bash
        env:
          DASHBOARD_BASE_URL: http://127.0.0.1:4173
        run: |
          set -o pipefail
          node tests/client-content-runtime.mjs 2>&1 | tee /tmp/client-content-runtime.log

      - name: Audit real Neptune test account in production
        continue-on-error: true
        shell: bash
        env:
          CLIENT_PRODUCTION_URL: https://tv.neptunebusiness.com
          CLIENT_AUDIT_EMAIL: contact@neptunebusiness.com
        run: |
          set -o pipefail
          node tests/client-production-real-account-audit.mjs 2>&1 | tee /tmp/client-production-real-account-audit.log

      - name: Verify v118.5 direct booking in production
        shell: bash
        env:
          CLIENT_PRODUCTION_URL: https://tv.neptunebusiness.com
          CLIENT_AUDIT_EMAIL: contact@neptunebusiness.com
        run: |
          set -o pipefail
          node tests/client-production-direct-booking-v118-5.mjs 2>&1 | tee /tmp/client-production-direct-booking-v118-5.log

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-dashboard-real-production-audit
          path: |
            test-results/client-dashboard
            test-results/client-command-center-v117
            test-results/client-command-center-v118
            test-results/client-visual-coherence-v118-2
            test-results/client-ux-polish-v118-3
            test-results/client-ux-v118-4
            test-results/client-content-runtime
            test-results/client-production-real-account-audit
            test-results/client-production-direct-booking-v118-5
            /tmp/client-dashboard-run.log
            /tmp/client-command-center-v117.log
            /tmp/client-command-center-v118.log
            /tmp/client-visual-coherence-v118-2.log
            /tmp/client-ux-polish-v118-3.log
            /tmp/client-ux-v118-4.log
            /tmp/client-direct-booking-v118-5.log
            /tmp/client-content-runtime.log
            /tmp/client-production-real-account-audit.log
            /tmp/client-production-direct-booking-v118-5.log
            /tmp/client-dashboard-server.log
          if-no-files-found: warn
          retention-days: 7
