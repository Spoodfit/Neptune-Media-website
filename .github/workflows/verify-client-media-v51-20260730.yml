name: Verify Client Media V51.2 20260730

on:
  pull_request:
    paths:
      - '.github/workflows/verify-client-media-v51-20260730.yml'
      - 'neptune-tv-media-cloudflare/src/portal-client-media-v51.js'
      - 'neptune-tv-media-cloudflare/src/portal-youtube-client-v53.js'
      - 'neptune-tv-media-cloudflare/src/store-v7.js'
      - 'neptune-tv-media-cloudflare/src/entry-v11.js'
      - 'neptune-tv-media-cloudflare/public/espace-client/client-media-runtime-v51.js'
      - 'neptune-tv-media-cloudflare/scripts/verify-client-media-runtime-v51.mjs'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify stable latest delivery, YouTube integrity and Drive stream
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://tv.neptunebusiness.com'

          ready=0
          for attempt in $(seq 1 36); do
            curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$BASE/api/public/release?client_media_v512_integrity_attempt=$attempt" > /tmp/release.json || true
            if grep -Fq '"clientMediaRuntime":"client-media-runtime-v51.2-stable-broadcast-download-feedback"' /tmp/release.json \
              && grep -Fq '"youtubePublicationIntegrity":"thumbnail-video-id-consistency-v1"' /tmp/release.json; then
              ready=1
              break
            fi
            sleep 10
          done
          cat /tmp/release.json
          test "$ready" = 1

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$BASE/espace-client/?runtime=v512-integrity" > /tmp/client.html
          grep -Fq '/espace-client/client-media-runtime-v51.js?v=2' /tmp/client.html
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$BASE/espace-client/client-media-runtime-v51.js?v=2" > /tmp/client-media.js
          for marker in neptuneBroadcastKey data-neptune-broadcast-player interceptDownloadClick neptuneDownloadSpin; do
            grep -Fq "$marker" /tmp/client-media.js
          done

          curl --silent --show-error --cookie-jar /tmp/client-cookie.txt \
            -X POST "$BASE/api/client/request-code" \
            -H "Origin: $BASE" \
            -H 'Content-Type: application/json' \
            --data '{"email":"contact@neptunebusiness.com"}' > /tmp/login.json
          grep -Fq '"authenticated":true' /tmp/login.json

          curl --fail --silent --show-error --cookie /tmp/client-cookie.txt \
            "$BASE/api/client/session" > /tmp/session.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/session.json'))
          files=[f for o in data.get('orders',[]) for f in o.get('files',[])]
          drive=[f for f in files if f.get('driveFileId')]
          long_files=[f for f in files if str(f.get('fileType','')).lower() in {'final','emission','full','master','episode','long'}]
          assert files and drive and len(long_files) >= 2
          assert all(f.get('previewUrl') and f.get('downloadUrl') for f in drive)
          open('/tmp/file-id.txt','w').write(drive[0]['id'])
          print({'files':len(files),'drive':len(drive),'long':len(long_files)})
          PY

          curl --fail --silent --show-error --cookie /tmp/client-cookie.txt \
            "$BASE/api/client/youtube-publications?validation=v512-integrity" > /tmp/youtube.json
          cat /tmp/youtube.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/youtube.json'))
          assert data.get('ok') is True
          assert data.get('integrityFilter') == 'thumbnail-video-id-consistency-v1'
          ids=[v.get('videoId') for v in data.get('matched',[])]
          assert '6TAWaXDZDnA' in ids
          assert 'jemcOyxlM6c' in ids
          assert 'wJflctxdjIo' not in ids
          assert all(v.get('embedUrl') and v.get('watchUrl') for v in data['matched'])
          print({'matched':len(ids),'ids':ids})
          PY

          FILE_ID="$(cat /tmp/file-id.txt)"
          status="$(curl --silent --show-error --output /tmp/media.bin --write-out '%{http_code}' \
            --cookie /tmp/client-cookie.txt -H 'Range: bytes=0-1023' \
            "$BASE/api/client/files/$FILE_ID?inline=1")"
          echo "Drive media status: $status"
          test "$status" = 200 -o "$status" = 206
          test "$(wc -c < /tmp/media.bin)" -gt 0

# validation-trigger: stable-broadcast-youtube-integrity-download-feedback-v512
