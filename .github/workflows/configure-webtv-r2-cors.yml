name: Configure WebTV R2 CORS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-webtv-r2-cors-production
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Apply WebTV browser upload CORS to R2
        run: |
          set -euo pipefail
          npx wrangler r2 bucket cors set neptune-media-assets \
            --file neptune-tv-media-cloudflare/config/webtv-r2-cors-wrangler.json

      - name: Verify WebTV R2 CORS
        run: |
          set -euo pipefail
          npx wrangler r2 bucket cors list neptune-media-assets | tee /tmp/neptune-webtv-r2-cors.txt
          grep -Fq 'https://tv.neptunebusiness.com' /tmp/neptune-webtv-r2-cors.txt
          grep -Fq 'https://media.neptunebusiness.com' /tmp/neptune-webtv-r2-cors.txt
          grep -Fq 'PUT' /tmp/neptune-webtv-r2-cors.txt
          grep -Fq 'ETag' /tmp/neptune-webtv-r2-cors.txt
