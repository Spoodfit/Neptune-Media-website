<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="/reserver" aria-label="Neptune Media"><img src="/assets/logo-neptune.svg" alt=""><span>Neptune Media</span></a>
    <div class="progress" id="progress" aria-label="Progression de la réservation"></div>
    <div class="secure">Paiement sécurisé</div>
  </header>
  <div class="launch-banner"><div class="launch-track"><span>Choisissez ce qui vous ressemble.</span><span>Puis votre ville et votre décor.</span><span>Vous gardez la main jusqu’au paiement.</span></div></div>
  <main class="stage">
    <section class="screen active">
      <div class="shell" id="app-content" aria-live="polite"></div>
    </section>
  </main>
</div>
<script>
(() => {
  const nativeFetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const response = await nativeFetch(input, init);
    try {
      const requestUrl = typeof input === 'string' ? input : String(input?.url || '');
      if (!requestUrl.includes('/api/reservation/prospect/context') || !response.ok) return response;
      const data = await response.clone().json();
      const selection = data?.selection;
      const incompleteSelection = selection && !selection.city && !selection.format && !selection.offer;
      if (!incompleteSelection) return response;
      data.selection = null;
      const headers = new Headers(response.headers);
      headers.delete('content-length');
      return new Response(JSON.stringify(data), {
        status: response.status,
        statusText: response.statusText,
        headers,
      });
    } catch {
      return response;
    }
  };
})();
</script>

<script>
(() => {
  const STORAGE = 'neptune_media_reservation_v163';
  const token = new URLSearchParams(location.search).get('reservation_token');
  if (!token) return;
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORAGE) || 'null'); } catch {}
  if (!saved?.conceptId || saved.cityId) return;

  const host = document.getElementById('app-content');
  if (!host) return;
  let replayed = false;
  let observer = null;

  const replayPendingConcept = () => {
    if (replayed) return true;
    const selector = `[data-concept="${CSS.escape(String(saved.conceptId))}"]`;
    const button = host.querySelector(selector);
    if (!button) return false;
    replayed = true;
    observer?.disconnect();
    button.click();
    return true;
  };

  observer = new MutationObserver(replayPendingConcept);
  observer.observe(host, { childList: true, subtree: true });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', replayPendingConcept, { once: true });
  } else {
    replayPendingConcept();
  }
  setTimeout(() => observer?.disconnect(), 5000);
})();
</script>
