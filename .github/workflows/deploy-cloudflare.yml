name: Deploy Neptune Media to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-media-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: neptune-tv-media-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: https://tv.neptunebusiness.com
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      RELEASE_ID: neptune-workflow-minimal-20260724-v9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --registry=https://registry.npmjs.org

      - name: Validate application
        run: npm run check

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker and assets
        run: npx wrangler deploy

      - name: Verify deployed release and preserved secrets
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for base in "$WORKERS_URL" "$PUBLIC_URL"; do
            for attempt in 1 2 3 4 5 6; do
              curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/api/public/release?attempt=$attempt" > /tmp/release.json || true
              if grep -Fq "\"release\":\"$RELEASE_ID\"" /tmp/release.json \
                && grep -Fq '"resendSecretPresent":true' /tmp/release.json \
                && grep -Fq '"webhookSecretPresent":true' /tmp/release.json \
                && grep -Fq '"workflowStore":"store-v5"' /tmp/release.json \
                && grep -Fq '"clientWorkflowUi":"workflow-v45-minimal"' /tmp/release.json \
                && grep -Fq '"studioWorkflowUi":"clients-workflow-v37-stage-tabs"' /tmp/release.json; then
                break
              fi
              sleep 10
            done
            cat /tmp/release.json
            grep -Fq "\"release\":\"$RELEASE_ID\"" /tmp/release.json
            grep -Fq '"resendSecretPresent":true' /tmp/release.json
            grep -Fq '"webhookSecretPresent":true' /tmp/release.json
            grep -Fq '"workflowStore":"store-v5"' /tmp/release.json
            grep -Fq '"clientWorkflowUi":"workflow-v45-minimal"' /tmp/release.json
            grep -Fq '"studioWorkflowUi":"clients-workflow-v37-stage-tabs"' /tmp/release.json
          done

      - name: Verify client and Studio workflow interfaces
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/espace-client/?release=$GITHUB_SHA" > /tmp/client.html
          grep -Fq '/espace-client/workflow-v45.css?v=2' /tmp/client.html
          grep -Fq '/espace-client/workflow-v45.js?v=2' /tmp/client.html
          curl --fail --silent --show-error "$PUBLIC_URL/espace-client/workflow-v45.js?v=2" > /tmp/client-workflow.js
          grep -Fq 'client-minimal-flow' /tmp/client-workflow.js
          grep -Fq 'Aucune action n’est requise de votre part' /tmp/client-workflow.js

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/studio/clients?release=$GITHUB_SHA" > /tmp/studio.html
          grep -Fq '/studio/clients-workflow-v37.css?v=2' /tmp/studio.html
          grep -Fq '/studio/clients-workflow-v37.js?v=2' /tmp/studio.html
          curl --fail --silent --show-error "$PUBLIC_URL/studio/clients-workflow-v37.js?v=2" > /tmp/studio-workflow.js
          grep -Fq 'workflow-stage-tabs' /tmp/studio-workflow.js
          grep -Fq 'Parcours clients' /tmp/studio-workflow.js

      - name: Verify Resend authentication from production
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/api/public/email-health?release=$GITHUB_SHA" > /tmp/email-health.json
          cat /tmp/email-health.json
          grep -Fq '"configured":true' /tmp/email-health.json
          grep -Fq '"providerKeyAccepted":true' /tmp/email-health.json

      - name: Verify trusted Neptune client login
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --cookie-jar /tmp/client-cookie.txt \
            -X POST "$PUBLIC_URL/api/client/request-code" \
            -H "Origin: $PUBLIC_URL" \
            -H 'Content-Type: application/json' \
            -H 'Cache-Control: no-cache, no-store' \
            --data '{"email":"contact@neptunebusiness.com"}' > /tmp/trusted-login.json
          cat /tmp/trusted-login.json
          grep -Fq '"ok":true' /tmp/trusted-login.json
          grep -Fq '"authenticated":true' /tmp/trusted-login.json
          grep -Fq '"trustedAccess":true' /tmp/trusted-login.json

          curl --silent --show-error \
            --cookie /tmp/client-cookie.txt \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/api/client/session" > /tmp/client-session.json
          cat /tmp/client-session.json
          grep -Fq '"authenticated":true' /tmp/client-session.json
          grep -Fq '"email":"contact@neptunebusiness.com"' /tmp/client-session.json
