name: One-time repository cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Delete every branch except main
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(
            git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#refs/heads/##' \
              | grep -vx 'main' || true
          )

          echo "Branches to delete: ${#branches[@]}"

          chunk_size=40
          total=${#branches[@]}
          start=0

          while (( start < total )); do
            args=()
            end=$(( start + chunk_size ))
            if (( end > total )); then
              end=$total
            fi

            for (( i=start; i<end; i++ )); do
              args+=(":refs/heads/${branches[$i]}")
            done

            git push origin "${args[@]}"
            start=$end
          done

          mapfile -t remaining < <(
            git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#refs/heads/##'
          )

          printf 'Remaining branches:\n'
          printf ' - %s\n' "${remaining[@]}"

          if (( ${#remaining[@]} != 1 )) || [[ "${remaining[0]}" != "main" ]]; then
            echo "Repository cleanup failed: non-canonical branches remain." >&2
            exit 1
          fi
