name: Verify Workflow Production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-workflow-production.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify active release, secrets and workflow store
        shell: bash
        run: |
          set -euo pipefail
          expected='neptune-workflow-clear-20260724-v8'
          for base in 'https://neptune-media-webtv.neptunebusinessclub.workers.dev' 'https://tv.neptunebusiness.com'; do
            ok=false
            for attempt in 1 2 3 4 5 6; do
              curl --silent --show-error -H 'Cache-Control: no-cache, no-store' "$base/api/public/release?attempt=$attempt" > /tmp/release.json || true
              cat /tmp/release.json
              if grep -Fq "\"release\":\"$expected\"" /tmp/release.json \
                && grep -Fq '"resendSecretPresent":true' /tmp/release.json \
                && grep -Fq '"webhookSecretPresent":true' /tmp/release.json \
                && grep -Fq '"workflowStore":"store-v5"' /tmp/release.json; then
                ok=true
                break
              fi
              sleep 10
            done
            test "$ok" = true
          done

      - name: Verify client workflow interface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' 'https://tv.neptunebusiness.com/espace-client/?verify=workflow-v8' > /tmp/client.html
          grep -Fq '/espace-client/workflow-v45.css' /tmp/client.html
          grep -Fq '/espace-client/workflow-v45.js' /tmp/client.html

      - name: Verify Studio workflow interface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' 'https://tv.neptunebusiness.com/studio/clients?verify=workflow-v8' > /tmp/studio.html
          grep -Fq '/studio/clients-workflow-v37.css' /tmp/studio.html
          grep -Fq '/studio/clients-workflow-v37.js' /tmp/studio.html
