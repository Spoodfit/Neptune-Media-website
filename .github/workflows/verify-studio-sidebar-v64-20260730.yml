name: Verify Studio Sidebar V64 20260730

# Compatibility check retained for branch protection. The v65 information architecture
# supersedes the former eight-link v64 sidebar and owns the final Studio shell.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-studio-sidebar-v64-20260730.yml'
      - 'neptune-tv-media-cloudflare/src/entry-v15.js'
      - 'neptune-tv-media-cloudflare/public/studio/clients.html'
      - 'neptune-tv-media-cloudflare/public/studio/studio-sidebar-authority-v64.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-sidebar-authority-v64.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65.js'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-information-architecture-v65.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-studio-sidebar-v64-20260730.yml'
      - 'neptune-tv-media-cloudflare/src/entry-v15.js'
      - 'neptune-tv-media-cloudflare/public/studio/clients.html'
      - 'neptune-tv-media-cloudflare/public/studio/studio-sidebar-authority-v64.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-sidebar-authority-v64.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-information-architecture-v65.js'
      - 'neptune-tv-media-cloudflare/scripts/verify-studio-information-architecture-v65.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate active Studio shell
        working-directory: neptune-tv-media-cloudflare
        run: |
          if grep -Fq "four-primary-destinations-v65" src/entry-v15.js; then
            node --check src/entry-v15.js
            node --check public/studio/studio-information-architecture-v65.js
            node scripts/verify-studio-information-architecture-v65.mjs
            echo "The v64 sidebar is intentionally superseded by the unified v65 Studio architecture."
          else
            node --check src/entry-v11.js
            node --check public/studio/studio-sidebar-authority-v64.js
            node scripts/verify-studio-sidebar-v64.mjs
          fi
