name: Verify Catalogue Visual V132

on:
  pull_request:
    paths:
      - 'wrangler.jsonc'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'neptune-tv-media-cloudflare/src/entry-v44.js'
      - 'neptune-tv-media-cloudflare/src/entry-v40.js'
      - 'neptune-tv-media-cloudflare/public/studio/advanced.html'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-v132.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-v132.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-polish-v132-1.css'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-commercial-cockpit-v145.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-commercial-cockpit-v145.css'
      - 'neptune-tv-media-cloudflare/tests/audit-catalog-visual-v132.mjs'
      - 'neptune-tv-media-cloudflare/tests/catalog-commercial-cockpit-v145.mjs'
      - 'neptune-tv-media-cloudflare/tests/audit-catalog-commercial-v145.mjs'
      - '.github/workflows/verify-catalog-visual-v132.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog-visual-v132:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: neptune-tv-media-cloudflare
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript and visual assets
        run: |
          node --check neptune-tv-media-cloudflare/src/entry-v44.js
          node --check neptune-tv-media-cloudflare/src/entry-v40.js
          node --check neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-v132.js
          node --check neptune-tv-media-cloudflare/public/studio/studio-catalog-commercial-cockpit-v145.js
          node --check neptune-tv-media-cloudflare/tests/audit-catalog-visual-v132.mjs
          node --check neptune-tv-media-cloudflare/tests/audit-catalog-commercial-v145.mjs
          node neptune-tv-media-cloudflare/tests/catalog-commercial-cockpit-v145.mjs
          grep -Fq '"main": "neptune-tv-media-cloudflare/src/entry-v44.js"' wrangler.jsonc
          test -L neptune-tv-media-cloudflare/wrangler.jsonc
          test "$(readlink neptune-tv-media-cloudflare/wrangler.jsonc)" = '../wrangler.jsonc'
          grep -Fq "from './entry-v41.js'" neptune-tv-media-cloudflare/src/entry-v44.js
          ! grep -Fq "from './entry-v42.js'" neptune-tv-media-cloudflare/src/entry-v44.js
          ! grep -Fq "from './entry-v43.js'" neptune-tv-media-cloudflare/src/entry-v44.js
          grep -Fq 'studio-catalog-commercial-cockpit-v145.css?v=1' neptune-tv-media-cloudflare/src/entry-v44.js
          grep -Fq 'studio-catalog-commercial-cockpit-v145.js?v=1' neptune-tv-media-cloudflare/src/entry-v44.js
          grep -Fq 'studio-catalog-visual-polish-v132-1.css?v=1' neptune-tv-media-cloudflare/public/studio/advanced.html
          grep -Fq 'body.v132-catalog-visual{height:100dvh!important;overflow:hidden!important}' neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-polish-v132-1.css
      - name: Start active Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          sed -i 's/"compatibility_date": "2026-07-30"/"compatibility_date": "2026-07-07"/' wrangler.jsonc
          ./neptune-tv-media-cloudflare/node_modules/.bin/wrangler dev --config wrangler.jsonc --local --port 8787 > /tmp/wrangler-catalog-v145.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error -D /tmp/catalog-v145.headers http://127.0.0.1:8787/studio/advanced.html > /tmp/catalog-v145.html; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/wrangler-catalog-v145.log; exit 1; fi
          grep -Fqi 'x-neptune-catalog-visual: neptune-studio-catalog-visual-20260820-v132' /tmp/catalog-v145.headers
          grep -Fqi 'x-neptune-catalog-cockpit: v145' /tmp/catalog-v145.headers
          grep -Fq '/studio/studio-catalog-commercial-cockpit-v145.js?v=1' /tmp/catalog-v145.html
          grep -Fq '/studio/studio-catalog-commercial-cockpit-v145.css?v=1' /tmp/catalog-v145.html
      - name: Audit v145 commercial cockpit in Chrome
        env:
          STUDIO_BASE_URL: http://127.0.0.1:8787
          CATALOG_SCREENSHOT: /tmp/catalog-commercial-v145.png
        run: node neptune-tv-media-cloudflare/tests/audit-catalog-commercial-v145.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-commercial-v145-evidence
          path: |
            /tmp/wrangler-catalog-v145.log
            /tmp/catalog-v145.headers
            /tmp/catalog-v145.html
            /tmp/catalog-commercial-v145.png
          if-no-files-found: warn
          retention-days: 14
