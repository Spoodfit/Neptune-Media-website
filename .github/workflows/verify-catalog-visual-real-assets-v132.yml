name: Verify Catalogue V132 Real Assets

on:
  pull_request:
    paths:
      - 'neptune-tv-media-cloudflare/tests/audit-catalog-visual-real-assets-v132.mjs'
      - '.github/workflows/verify-catalog-visual-real-assets-v132.yml'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-v132.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-v132.css'
      - 'neptune-tv-media-cloudflare/public/assets/catalog-v98/hors-norme.svg'
      - 'neptune-tv-media-cloudflare/public/assets/posters/concept-libre-wide.webp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-real-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: neptune-tv-media-cloudflare
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Check canonical visual contract
        run: |
          node --check neptune-tv-media-cloudflare/tests/audit-catalog-visual-real-assets-v132.mjs
          grep -Fq "return '/assets/catalog-v98/hors-norme.svg'" neptune-tv-media-cloudflare/src/media-catalog-visuals-v98.js
          grep -Fq "return '/assets/posters/concept-libre-wide.webp'" neptune-tv-media-cloudflare/src/media-catalog-visuals-v98.js
          grep -Fq '...formatVisualV98(store,x.id,x.slug)' neptune-tv-media-cloudflare/src/portal-media-catalog-v98.js
          grep -Fq 'format.image||format.imageUrl' neptune-tv-media-cloudflare/public/studio/studio-catalog-visual-v132.js
      - name: Start active Worker
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/"compatibility_date": "2026-07-30"/"compatibility_date": "2026-07-07"/' neptune-tv-media-cloudflare/wrangler.jsonc
          ./neptune-tv-media-cloudflare/node_modules/.bin/wrangler dev --config neptune-tv-media-cloudflare/wrangler.jsonc --local --port 8787 > /tmp/wrangler-v132-real-assets.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/studio/advanced.html > /tmp/v132-real-assets.html; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/wrangler-v132-real-assets.log; exit 1; fi
      - name: Render actual integrated visuals in Chrome
        env:
          STUDIO_BASE_URL: http://127.0.0.1:8787
          CATALOG_SCREENSHOT: /tmp/catalog-v132-real-assets.png
        run: node neptune-tv-media-cloudflare/tests/audit-catalog-visual-real-assets-v132.mjs
      - name: Upload verified screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-v132-real-assets
          path: |
            /tmp/catalog-v132-real-assets.png
            /tmp/wrangler-v132-real-assets.log
          if-no-files-found: warn
          retention-days: 14
