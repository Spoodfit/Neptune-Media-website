name: Verify Sales Tunnel V180

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-sales-tunnel-v96.yml'
      - 'neptune-tv-media-cloudflare/src/entry-v47.js'
      - 'neptune-tv-media-cloudflare/src/entry-v46.js'
      - 'neptune-tv-media-cloudflare/src/reservation-domain-v173.js'
      - 'neptune-tv-media-cloudflare/src/reservation-policy-v173.js'
      - 'neptune-tv-media-cloudflare/src/reservation-slot-management-v172.js'
      - 'neptune-tv-media-cloudflare/src/reservation-client-projection-v179.js'
      - 'neptune-tv-media-cloudflare/src/reservation-stripe-redirect-v180.js'
      - 'neptune-tv-media-cloudflare/src/portal-sales-tunnel-v96.js'
      - 'neptune-tv-media-cloudflare/src/portal-sales-tunnel-options-v96.js'
      - 'neptune-tv-media-cloudflare/src/portal-sales-tunnel-v97.js'
      - 'neptune-tv-media-cloudflare/public/reserver/**'
      - 'neptune-tv-media-cloudflare/public/studio/studio-reservations-v172.js'
      - 'neptune-tv-media-cloudflare/public/espace-client/client-reservation-truth-v179.js'
      - 'neptune-tv-media-cloudflare/scripts/verify-sales-tunnel-v96.mjs'
      - 'neptune-tv-media-cloudflare/tests/sales-tunnel-v96.mjs'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'wrangler.jsonc'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sales-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESERVATION_FINALIZATION_RELEASE: neptune-reservation-finalization-20260905-v180
      MEDIA_URL: https://media.neptunebusiness.com
      TV_URL: https://tv.neptunebusiness.com
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate finalized source contract
        working-directory: neptune-tv-media-cloudflare
        run: |
          node --check src/entry-v47.js
          node --check src/entry-v46.js
          node --check src/reservation-domain-v173.js
          node --check src/reservation-policy-v173.js
          node --check src/reservation-slot-management-v172.js
          node --check src/reservation-client-projection-v179.js
          node --check src/reservation-stripe-redirect-v180.js
          node --check public/reserver/assets/app-v163.js
          node --check public/reserver/assets/tunnel-runtime-v179.js
          node --check public/reserver/assets/reservation-availability-v172.js
          node --check public/espace-client/client-reservation-truth-v179.js
          node scripts/verify-sales-tunnel-v96.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory neptune-tv-media-cloudflare/public >/tmp/tunnel-v180.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/reserver/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/tunnel-v180.log; exit 1
      - name: Audit finalized desktop and mobile flow
        env:
          LOCAL_BASE_URL: http://127.0.0.1:4173
          OUTPUT_DIR: test-results/sales-tunnel-v180
        run: node neptune-tv-media-cloudflare/tests/sales-tunnel-v96.mjs
      - name: Upload reservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-tunnel-v180-evidence
          path: test-results/sales-tunnel-v180
          if-no-files-found: warn
          retention-days: 14
      - name: Verify production propagation
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          verify_release() {
            local base="$1"; local ready=0
            for attempt in $(seq 1 48); do
              q="v180=$GITHUB_SHA&attempt=$attempt"
              release=$(curl -fsS -H 'Cache-Control: no-cache, no-store' "$base/api/public/release?$q" || true)
              if RELEASE="$release" node <<'NODE'
          const r=JSON.parse(process.env.RELEASE||'{}');
          if(r.reservationFinalization!==process.env.RESERVATION_FINALIZATION_RELEASE)process.exit(1);
          if(!r.clientReservationTruth||!r.reservationStripeReturn)process.exit(1);
          NODE
              then ready=1; echo "$base reservation release ready on attempt $attempt"; break; fi
              sleep 5
            done
            test "$ready" = 1
          }
          verify_page() {
            local base="$1"; local ready=0
            for attempt in $(seq 1 48); do
              q="v180=$GITHUB_SHA&attempt=$attempt"
              html=$(curl -fsS -H 'Cache-Control: no-cache, no-store' "$base/reserver?$q" || true)
              if grep -Fq '/reserver/assets/app-v163.js' <<<"$html" \
                && grep -Fq '/reserver/assets/tunnel-runtime-v179.js' <<<"$html" \
                && ! grep -Fq '/reserver/assets/sales-experience-v165.js' <<<"$html" \
                && ! grep -Fq '/reserver/assets/sales-experience-v166.js' <<<"$html" \
                && ! grep -Fq '/reserver/assets/tunnel-copy-v175.js' <<<"$html" \
                && ! grep -Fq '/reserver/assets/tunnel-conversion-v176.js' <<<"$html"; then
                ready=1; echo "$base/reserver finalized on attempt $attempt"; break
              fi
              sleep 5
            done
            test "$ready" = 1
          }
          verify_release "$WORKERS_URL"
          verify_release "$MEDIA_URL"
          verify_page "$MEDIA_URL"
          verify_page "$TV_URL"
