name: Verify Catalog Commercial Cockpit V144 Production

on:
  workflow_run:
    workflows: ["Deploy Neptune Media to Cloudflare"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify v144 assets on both production domains
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          verify() {
            local base="$1"
            local slug="$2"
            local ok=0
            mkdir -p /tmp/v144
            for attempt in $(seq 1 24); do
              local q="v144=$HEAD_SHA&attempt=$attempt"
              curl --fail --silent --show-error -D "/tmp/v144/$slug.headers" -H 'Cache-Control: no-cache, no-store' "$base/studio/advanced.html?$q" > "/tmp/v144/$slug.html" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$base/studio/studio-catalog-commercial-cockpit-v144.css?$q" > "/tmp/v144/$slug.css" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$base/studio/studio-catalog-commercial-cockpit-v144.js?$q" > "/tmp/v144/$slug.js" || true
              if grep -Fqi 'x-neptune-catalog-cockpit: v144' "/tmp/v144/$slug.headers" \
                && grep -Fq '/studio/studio-catalog-commercial-cockpit-v144.css?v=1' "/tmp/v144/$slug.html" \
                && grep -Fq '/studio/studio-catalog-commercial-cockpit-v144.js?v=1' "/tmp/v144/$slug.html" \
                && grep -Fq '.v144-cockpit' "/tmp/v144/$slug.css" \
                && grep -Fq "document.body.dataset.neptuneCatalogCockpit='v144'" "/tmp/v144/$slug.js" \
                && grep -Fq "import '/studio/studio-catalog-commerce-v143-4.js?v=1'" "/tmp/v144/$slug.js"; then
                ok=1
                echo "$base: v144 cockpit verified on attempt $attempt"
                break
              fi
              sleep 5
            done
            test "$ok" = 1
          }
          verify "https://neptune-media-webtv.neptunebusinessclub.workers.dev" workers
          verify "https://tv.neptunebusiness.com" public
