name: Diagnose Studio Panel Visibility

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-studio-mobile-production.yml'

permissions:
  contents: read

jobs:
  diagnose-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          mkdir -p /tmp/neptune-panels
          cd /tmp/neptune-panels
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install chromium
      - name: Diagnose panel visibility
        run: |
          cd /tmp/neptune-panels
          cat > diagnose.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const order={id:'audit-order-v12',clientId:'c1',email:'lea.audit@example.com',fullName:'Léa Depoulain',company:'Neptune business',title:'Passage Neptune Media',format:'Hors Norme',paymentStatus:'paid',amountTotal:180000,currency:'eur',status:'studio_date_confirmation_pending',appointmentAt:'2026-07-27T06:00:00.000Z',appointmentSource:'google_calendar',filmingAt:null,nextAction:'Neptune attend la confirmation définitive du studio.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),steps:[],files:[],schedules:[],workflow:{supplierStatus:'pending',preparationStatus:'completed',currentLabel:'Date du passage en confirmation',nextAction:'Neptune attend la confirmation définitive du studio.',requestedFilmingAt:null,appointmentSource:'google_calendar',broadcastStatus:'not_scheduled',sourceQcStatus:'not_started',inventory:{sourceCount:0,finalCount:0,shortCount:0,hasSource:false,hasFinal:false,hasShort:false}}};
          const clients={clients:[{id:'c1',email:order.email,fullName:order.fullName,company:order.company,active:true,orderCount:1}],orders:[order],supplierPayments:[],refundRequests:[],deletionRequests:[],finance:{}};
          const control={ok:true,summary:{active:1,actions:1},actions:[{type:'order',orderId:order.id,title:'Confirmation du studio attendue',reason:'REC BOX doit confirmer ou proposer une autre date sous 48 heures.'}],upcoming:[]};
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const viewport of [{name:'desktop',width:1440,height:900},{name:'laptop',width:1180,height:820},{name:'tablet',width:768,height:900},{name:'mobile',width:390,height:844}]){
            const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});
            await context.addInitScript(()=>localStorage.setItem('neptune_studio_sidebar_collapsed','1'));
            const page=await context.newPage();
            await page.route('**/api/**',async(route)=>{
              const path=new URL(route.request().url()).pathname;
              const json=(body)=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
              if(path==='/api/auth/status')return json({authenticated:true,csrfToken:'audit',user:{id:'a',email:'audit@neptunebusiness.com',role:'admin'}});
              if(path==='/api/admin/clients')return json(clients);
              if(path==='/api/admin/control-room')return json(control);
              if(path==='/api/admin/workflow/events')return json({ok:true,events:[]});
              if(path==='/api/admin/feedback')return json({items:[]});
              return json({ok:true});
            });
            await page.goto(`https://tv.neptunebusiness.com/studio/clients?diagnose=${viewport.name}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('.workflow-stage-tabs',{timeout:30000});
            await page.waitForSelector('[data-order-card="audit-order-v12"]',{state:'attached',timeout:30000});
            await page.waitForTimeout(800);
            const state=await page.evaluate(()=>{
              const card=document.querySelector('[data-order-card="audit-order-v12"]');
              const cardRect=card?.getBoundingClientRect();
              const panel=card?.closest('[data-stage-panel]');
              const panels=[...document.querySelectorAll('[data-stage-panel]')].map((item)=>({id:item.dataset.stagePanel,hidden:item.hidden,display:getComputedStyle(item).display,cards:item.querySelectorAll('[data-order-card]').length}));
              return {active:document.querySelector('.workflow-stage-tabs button.active')?.dataset.workflowStage||'',activeLabel:document.querySelector('.workflow-stage-tabs button.active span')?.textContent||'',cardDisplay:card?getComputedStyle(card).display:'missing',cardVisibility:card?getComputedStyle(card).visibility:'missing',cardRect:cardRect?{x:cardRect.x,y:cardRect.y,width:cardRect.width,height:cardRect.height}:null,panel:panel?{id:panel.dataset.stagePanel,hidden:panel.hidden,display:getComputedStyle(panel).display}:null,panels,html:document.querySelector('#pipeline')?.innerHTML.slice(0,500)};
            });
            report.push({viewport,state});
            await page.screenshot({path:`${viewport.name}.png`,fullPage:true});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          EOF
          node diagnose.mjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-panel-diagnostic-v12
          path: |
            /tmp/neptune-panels/*.png
            /tmp/neptune-panels/report.json
          if-no-files-found: warn
