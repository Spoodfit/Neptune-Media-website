name: Verify Neptune Media after deploy

on:
  workflow_run:
    workflows: ['Deploy Neptune Media to Cloudflare']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-media-production-verification
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_URL: https://tv.neptunebusiness.com
      MEDIA_URL: https://media.neptunebusiness.com
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify production contracts
        run: node neptune-tv-media-cloudflare/scripts/verify-production-contracts.mjs

      - name: Verify Neptune JT production smoke
        run: node neptune-tv-media-cloudflare/scripts/verify-neptune-jt-production.mjs

      - name: Verify canonical Studio information architecture
        run: node neptune-tv-media-cloudflare/scripts/verify-studio-information-architecture-production-v65.mjs

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neptune-production-contracts-${{ github.run_id }}
          path: artifacts/production-contracts.json
          if-no-files-found: warn
          retention-days: 14
