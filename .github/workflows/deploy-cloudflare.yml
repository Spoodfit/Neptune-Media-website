name: Deploy Neptune Media to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-media-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: https://tv.neptunebusiness.com
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      RELEASE_ID: neptune-verified-content-runtime-20260730-v18
      EFFICIENCY_RELEASE: neptune-efficiency-delta-analytics-20260730-v4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Validate JavaScript
        run: npm run check

      - name: Validate Worker bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Deploy validated Worker and assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed runtime and preserved secrets
        shell: bash
        run: |
          set -euo pipefail
          for base in "$WORKERS_URL" "$PUBLIC_URL"; do
            ok=0
            for attempt in $(seq 1 12); do
              curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/api/public/release?attempt=$attempt&sha=$GITHUB_SHA" > /tmp/release.json || true
              if grep -Fq "\"release\":\"$RELEASE_ID\"" /tmp/release.json \
                && grep -Fq "\"efficiencyRelease\":\"$EFFICIENCY_RELEASE\"" /tmp/release.json \
                && grep -Fq '"resendSecretPresent":true' /tmp/release.json \
                && grep -Fq '"webhookSecretPresent":true' /tmp/release.json \
                && grep -Fq '"driveSecretPresent":true' /tmp/release.json \
                && grep -Fq '"workflowStore":"store-v7"' /tmp/release.json \
                && grep -Fq '"clientVideoLibrary":"passage-selector-horizontal-rails-4-long-8-short-v4"' /tmp/release.json \
                && grep -Fq '"clientCalendarLibrary":"passage-selector-paginated-eight-shorts-v5"' /tmp/release.json \
                && grep -Fq '"studioContentLibrary":"visual-grid-paginated-eight-items"' /tmp/release.json \
                && grep -Fq '"contentScrollModel":"bounded-by-passage-horizontal-rails-and-pagination"' /tmp/release.json; then
                ok=1
                break
              fi
              sleep 10
            done
            cat /tmp/release.json
            test "$ok" = 1
          done

      - name: Verify current client and Studio assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/espace-client/?release=$GITHUB_SHA" > /tmp/client.html
          grep -Fq '/espace-client/content-snapshot-v48.css?v=1' /tmp/client.html
          grep -Fq '/espace-client/content-snapshot-drive-v49.css?v=1' /tmp/client.html
          grep -Fq '/espace-client/content-snapshot-v48.js?v=3' /tmp/client.html
          grep -Fq '/assets/media-dialog-safety-v50.js?v=1' /tmp/client.html
          curl --fail --silent --show-error "$PUBLIC_URL/espace-client/content-snapshot-v48.js?v=3" > /tmp/client-snapshot.js
          grep -Fq 'new MutationObserver' /tmp/client-snapshot.js
          grep -Fq 'shortFiles.slice(0, 4)' /tmp/client-snapshot.js
          grep -Fq 'snapshotSignature' /tmp/client-snapshot.js

          curl --fail --silent --show-error "$PUBLIC_URL/espace-client/videos/?release=$GITHUB_SHA" > /tmp/videos.html
          grep -Fq '/espace-client/videos/videos-compact-v3.css?v=2' /tmp/videos.html
          grep -Fq '/espace-client/videos/videos-drive-preview-v4.css?v=1' /tmp/videos.html
          grep -Fq '/espace-client/videos/videos-compact-v3.js?v=3' /tmp/videos.html
          grep -Fq '/assets/media-dialog-safety-v50.js?v=1' /tmp/videos.html
          curl --fail --silent --show-error "$PUBLIC_URL/espace-client/videos/videos-compact-v3.js?v=3" > /tmp/videos.js
          grep -Fq 'const INITIAL_LIMITS = { final: 4, short: 8 };' /tmp/videos.js
          grep -Fq 'data-toggle-media' /tmp/videos.js
          grep -Fq 'passage-selector' /tmp/videos.js

          curl --fail --silent --show-error "$PUBLIC_URL/espace-client/calendrier/?release=$GITHUB_SHA" > /tmp/calendar.html
          grep -Fq '/espace-client/calendrier/calendar-compact-v5.js?v=1' /tmp/calendar.html
          grep -Fq '/espace-client/calendrier/calendar-compact-v5.css?v=1' /tmp/calendar.html
          curl --fail --silent --show-error "$PUBLIC_URL/espace-client/calendrier/calendar-compact-v5.js?v=1" > /tmp/calendar.js
          grep -Fq 'const PAGE_SIZE=8' /tmp/calendar.js
          grep -Fq 'observer?.disconnect()' /tmp/calendar.js

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/studio/clients?release=$GITHUB_SHA" > /tmp/studio.html
          grep -Fq '/studio/content-gallery-v49.css?v=1' /tmp/studio.html
          grep -Fq '/studio/content-gallery-v49.js?v=1' /tmp/studio.html
          grep -Fq '/studio/drive-sync-v47.js?v=2' /tmp/studio.html
          grep -Fq '/assets/media-dialog-safety-v50.js?v=1' /tmp/studio.html
          curl --fail --silent --show-error "$PUBLIC_URL/studio/content-gallery-v49.js?v=1" > /tmp/studio-gallery.js
          grep -Fq 'const PAGE_SIZE=8' /tmp/studio-gallery.js
          grep -Fq 'observer?.disconnect()' /tmp/studio-gallery.js
          grep -Fq 'studio-upload-details' /tmp/studio-gallery.js

          curl --fail --silent --show-error "$PUBLIC_URL/assets/media-dialog-safety-v50.js?v=1" > /tmp/media-safety.js
          grep -Fq "document.addEventListener('cancel'" /tmp/media-safety.js
          grep -Fq "frame.src = 'about:blank'" /tmp/media-safety.js

      - name: Verify Resend authentication from production
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/api/public/email-health?release=$GITHUB_SHA" > /tmp/email-health.json
          cat /tmp/email-health.json
          grep -Fq '"configured":true' /tmp/email-health.json
          grep -Fq '"providerKeyAccepted":true' /tmp/email-health.json

      - name: Verify trusted Neptune client login
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --cookie-jar /tmp/client-cookie.txt \
            -X POST "$PUBLIC_URL/api/client/request-code" \
            -H "Origin: $PUBLIC_URL" \
            -H 'Content-Type: application/json' \
            -H 'Cache-Control: no-cache, no-store' \
            --data '{"email":"contact@neptunebusiness.com"}' > /tmp/trusted-login.json
          cat /tmp/trusted-login.json
          grep -Fq '"ok":true' /tmp/trusted-login.json
          grep -Fq '"authenticated":true' /tmp/trusted-login.json
          grep -Fq '"trustedAccess":true' /tmp/trusted-login.json
          curl --fail --silent --show-error --cookie /tmp/client-cookie.txt \
            "$PUBLIC_URL/api/client/session" > /tmp/client-session.json
          grep -Fq '"client"' /tmp/client-session.json
          grep -Fq '"orders"' /tmp/client-session.json
