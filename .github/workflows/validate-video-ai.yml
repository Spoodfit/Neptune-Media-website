name: Validate Neptune Video Engine Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'neptune-video-engine/**'
      - 'neptune-tv-media-cloudflare/src/**'
      - 'neptune-tv-media-cloudflare/public/studio/**'
      - 'neptune-tv-media-cloudflare/local-video-engine/**'
      - 'neptune-tv-media-cloudflare/scripts/**'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'neptune-tv-media-cloudflare/package.json'
      - '.github/workflows/validate-video-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Validate v75 architecture
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            neptune-video-engine/app.py \
            neptune-video-engine/runtime.py \
            neptune-video-engine/runtime_v74.py \
            neptune-video-engine/runtime_v75.py
          ! grep -Fq '"VIDEO_PROCESSOR"' wrangler.jsonc
          ! grep -Fq '"VIDEO_JOBS"' wrangler.jsonc
          ! grep -Fq '"class_name": "VideoProcessor"' wrangler.jsonc
          grep -Fq '"class_name": "WebTvEncoder"' wrangler.jsonc
          grep -Fq 'from runtime_v75 import app as app' neptune-video-engine/runtime.py
          grep -Fq 'neptune-video-engine-20260803-v75' neptune-video-engine/runtime_v75.py
          grep -Fq 'FaceDetectorYN_create' neptune-video-engine/runtime_v75.py
          grep -Fq 'core.select_candidates = select_candidates' neptune-video-engine/runtime_v75.py
          grep -Fq 'core.write_subtitles = write_subtitles' neptune-video-engine/runtime_v75.py
          grep -Fq 'core.render_clip = render_clip' neptune-video-engine/runtime_v75.py
          grep -Fq 'runtime:app' neptune-video-engine/Dockerfile
          grep -Fq 'restart: unless-stopped' neptune-video-engine/docker-compose.yml
          grep -Fq 'neptune_video_data' neptune-video-engine/docker-compose.yml
          grep -Fq '/studio/video-ai-engine-v73.js?v=75' neptune-tv-media-cloudflare/public/studio/video-ai.html
          grep -Fq 'neptune-video-engine-20260803-v75' neptune-tv-media-cloudflare/public/studio/video-ai-engine-v73.js
          grep -Fq 'docker compose up -d --build' neptune-tv-media-cloudflare/public/studio/install-neptune-video-engine.ps1

      - name: Install and validate Worker application
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm run check

      - name: Validate deployable Cloudflare Studio bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-compatibility-dry-run
