name: Verify HORS NORME production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-entry-v48-and-deploy.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify landing on public and workers domains
        shell: bash
        env:
          MEDIA_URL: https://media.neptunebusiness.com
          WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
        run: |
          set -euo pipefail
          verify_landing() {
            local base="$1"
            local ready=0
            for attempt in $(seq 1 12); do
              html=$(curl -L --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$base/hors-norme?release=$GITHUB_SHA&attempt=$attempt" || true)
              if grep -Fq "Une demi-journée." <<<"$html" \
                && grep -Fq "3 mois de contenus" <<<"$html" \
                && grep -Fq "Diffusé aussi par Neptune" <<<"$html"; then
                ready=1
                echo "$base/hors-norme: landing verified on attempt $attempt."
                break
              fi
              sleep 3
            done
            test "$ready" = 1
          }
          verify_landing "$WORKERS_URL"
          verify_landing "$MEDIA_URL"
