name: Deploy Neptune Media to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-media-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_URL: https://tv.neptunebusiness.com
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      RELEASE_ID: neptune-verified-content-runtime-20260730-v18
      EDITORIAL_RELEASE: neptune-editorial-workspace-20260730-v2
      VIDEO_AI_RELEASE: neptune-video-local-engine-20260730-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Build and validate application
        run: npm run check

      - name: Validate free Worker bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run

      - name: Deploy Worker and local engine assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed local Video AI runtime
        shell: bash
        run: |
          set -euo pipefail
          for base in "$WORKERS_URL" "$PUBLIC_URL"; do
            ready=0
            for attempt in $(seq 1 18); do
              curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/api/public/release?attempt=$attempt&sha=$GITHUB_SHA" > /tmp/release.json || true
              if grep -Fq "\"release\":\"$RELEASE_ID\"" /tmp/release.json \
                && grep -Fq "\"editorialWorkspace\":\"$EDITORIAL_RELEASE\"" /tmp/release.json \
                && grep -Fq "\"videoAiStudio\":\"$VIDEO_AI_RELEASE\"" /tmp/release.json \
                && grep -Fq '"videoAiEngineMode":"browser-local"' /tmp/release.json \
                && grep -Fq '"videoAiMinimumScore":60' /tmp/release.json \
                && grep -Fq '"videoAiEditorialProposals":3' /tmp/release.json \
                && grep -Fq '"videoAiSourcePrivacy":"source-never-uploaded"' /tmp/release.json \
                && grep -Fq '"videoAiContainerRequired":false' /tmp/release.json \
                && grep -Fq '"videoAiContainerBindingPresent":false' /tmp/release.json \
                && grep -Fq '"videoAiInternalSecretRequired":false' /tmp/release.json \
                && grep -Fq '"videoAiR2SourceUploadRequired":false' /tmp/release.json \
                && grep -Fq '"videoAiWorkersAiBindingPresent":true' /tmp/release.json \
                && grep -Fq '"editorialProposals":3' /tmp/release.json \
                && grep -Fq '"resendSecretPresent":true' /tmp/release.json \
                && grep -Fq '"webhookSecretPresent":true' /tmp/release.json \
                && grep -Fq '"driveSecretPresent":true' /tmp/release.json \
                && grep -Fq '"workflowStore":"store-v7"' /tmp/release.json; then
                ready=1
                break
              fi
              sleep 10
            done
            cat /tmp/release.json
            test "$ready" = 1
          done

      - name: Verify Studio local engine and editorial assets
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 18); do
            query="release=$GITHUB_SHA&attempt=$attempt"
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$PUBLIC_URL/studio/video-ai.html?$query" > /tmp/video-ai.html \
              && grep -Fq 'Studio Vidéo IA local' /tmp/video-ai.html \
              && grep -Fq '100 % local pour la source' /tmp/video-ai.html \
              && grep -Fq '/studio/video-ai-local-v3.css?v=1' /tmp/video-ai.html \
              && grep -Fq '/studio/local-engine/neptune-video-local-engine-v1.js?v=1' /tmp/video-ai.html \
              && curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$PUBLIC_URL/studio/local-engine/neptune-video-local-engine-v1.js?$query" > /tmp/video-local.js \
              && grep -Fq 'indexedDB' /tmp/video-local.js \
              && grep -Fq 'X-Clip-Size' /tmp/video-local.js \
              && curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$PUBLIC_URL/assets/neptune-editorial-workspace-v59.js?$query" > /tmp/editorial.js \
              && grep -Fq 'publishExpress' /tmp/editorial.js; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1

      - name: Verify Resend authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/api/public/email-health?release=$GITHUB_SHA" > /tmp/email-health.json
          cat /tmp/email-health.json
          grep -Fq '"configured":true' /tmp/email-health.json
          grep -Fq '"providerKeyAccepted":true' /tmp/email-health.json

      - name: Verify trusted Neptune client login
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --cookie-jar /tmp/client-cookie.txt \
            -X POST "$PUBLIC_URL/api/client/request-code" \
            -H "Origin: $PUBLIC_URL" \
            -H 'Content-Type: application/json' \
            -H 'Cache-Control: no-cache, no-store' \
            --data '{"email":"contact@neptunebusiness.com"}' > /tmp/trusted-login.json
          cat /tmp/trusted-login.json
          grep -Fq '"ok":true' /tmp/trusted-login.json
          grep -Fq '"authenticated":true' /tmp/trusted-login.json
          grep -Fq '"trustedAccess":true' /tmp/trusted-login.json
