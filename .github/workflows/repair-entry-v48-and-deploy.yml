name: Diagnose HORS NORME Cloudflare routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-entry-v48-and-deploy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect DNS and Workers custom domains
        shell: bash
        run: |
          set -euo pipefail
          echo '=== public DNS ==='
          dig +short CNAME media.neptunebusiness.com || true
          dig +short A media.neptunebusiness.com || true
          dig +short AAAA media.neptunebusiness.com || true

          echo '=== Cloudflare zone lookup ==='
          zone_json=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/zones?name=neptunebusiness.com')
          echo "$zone_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,errors:j.errors,result:(j.result||[]).map(z=>({id:z.id,name:z.name,status:z.status}))},null,2))})"
          zone_id=$(echo "$zone_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write((j.result&&j.result[0]&&j.result[0].id)||'')})")

          if [ -n "$zone_id" ]; then
            echo '=== Cloudflare DNS record ==='
            dns_json=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=media.neptunebusiness.com")
            echo "$dns_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,errors:j.errors,result:(j.result||[]).map(r=>({id:r.id,type:r.type,name:r.name,content:r.content,proxied:r.proxied,ttl:r.ttl}))},null,2))})"

            echo '=== Workers routes on zone ==='
            route_json=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")
            echo "$route_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,errors:j.errors,result:j.result||[]},null,2))})"
          fi

          echo '=== Workers custom domains ==='
          domains_json=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")
          echo "$domains_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,errors:j.errors,result:(j.result||[]).map(d=>({id:d.id,hostname:d.hostname,service:d.service,zone_id:d.zone_id,environment:d.environment}))},null,2))})"
