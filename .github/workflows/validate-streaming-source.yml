name: Validate streaming source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-streaming-source.yml'
      - 'scripts/apply-streaming-index.py'
      - 'neptune-tv-media-cloudflare/public/index.html'
      - 'neptune-tv-media-cloudflare/public/app.js'
      - 'neptune-tv-media-cloudflare/public/ux-aida.js'
      - 'neptune-tv-media-cloudflare/public/live-channel.js'
      - 'neptune-tv-media-cloudflare/src/public-layout.js'
      - 'neptune-tv-media-cloudflare/src/public-render.js'
      - 'neptune-tv-media-cloudflare/public/styles/neptune-streaming.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-streaming-source-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate current source without mutating it
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 -m py_compile scripts/apply-streaming-index.py
            node --check neptune-tv-media-cloudflare/src/public-layout.js
            node --check neptune-tv-media-cloudflare/src/public-render.js
            node --check neptune-tv-media-cloudflare/public/app.js
            node --check neptune-tv-media-cloudflare/public/ux-aida.js
            node --check neptune-tv-media-cloudflare/public/live-channel.js
            grep -q 'data-home-structure=' neptune-tv-media-cloudflare/public/index.html
            grep -q 'data-content-rail' neptune-tv-media-cloudflare/public/index.html
            grep -q 'content-rail-shell' neptune-tv-media-cloudflare/public/styles/neptune-streaming.css
          } 2>&1 | tee /tmp/streaming-validation.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build validation report
        if: always()
        env:
          VALIDATION_STATUS: ${{ steps.validate.outputs.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          log_path = Path('/tmp/streaming-validation.log')
          log = log_path.read_text(encoding='utf-8', errors='replace')[-8000:] if log_path.exists() else 'Validation step did not produce a log.'
          status = os.environ.get('VALIDATION_STATUS', '1')
          report = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'ready': status == '0',
              'status': int(status) if status.isdigit() else status,
              'mode': 'read-only-source-validation-v113',
              'log': log,
          }
          Path('streaming-source-validation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-source-validation-${{ github.run_id }}
          path: streaming-source-validation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce validation
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: test "$VALIDATION_OUTCOME" = "success"
