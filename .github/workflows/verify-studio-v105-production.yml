name: Verify Studio v105 Production

on:
  push:
    branches:
      - 'fix/studio-v105-production-verifier-v2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        base:
          - https://neptune-media-webtv.neptunebusinessclub.workers.dev
          - https://tv.neptunebusiness.com
    steps:
      - name: Verify canonical Studio shell
        shell: bash
        env:
          BASE: ${{ matrix.base }}
          STUDIO_UI_RELEASE: neptune-studio-ui-20260812-v105-three-tab-canonical-shell
        run: |
          set -uo pipefail
          tmp="$(mktemp -d)"
          q="verify_v105=${GITHUB_SHA}-${RANDOM}"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE/api/public/release?$q" > "$tmp/release.json"
          curl --fail --silent --show-error -D "$tmp/clients.headers" -H 'Cache-Control: no-cache, no-store' "$BASE/studio/clients?$q" > "$tmp/clients.html"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE/studio/video-ai.html?$q" > "$tmp/video.html"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE/studio/webtv.html?$q" > "$tmp/webtv.html"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE/studio/advanced.html?$q" > "$tmp/advanced.html"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE/studio/studio-information-architecture-v65-1.js?v=105&$q" > "$tmp/shell.js"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' "$BASE/studio/studio-shell-v105.css?v=1&$q" > "$tmp/shell.css"

          failures=0
          check() {
            local label="$1"; shift
            if "$@"; then echo "✓ $label"; else echo "✗ $label"; failures=$((failures+1)); fi
          }

          node - "$tmp/release.json" "$STUDIO_UI_RELEASE" <<'NODE'
          const fs=require('node:fs');
          const [file,release]=process.argv.slice(2);
          const data=JSON.parse(fs.readFileSync(file,'utf8'));
          const checks={
            studioPrimaryNavigation: JSON.stringify(data.studioPrimaryNavigation)===JSON.stringify(['Parcours clients','Diffusion','Réglages']),
            studioUi: data.studioUi===release,
            studioShell: data.studioShell===release,
          };
          console.log('Release Studio fields:', JSON.stringify({studioPrimaryNavigation:data.studioPrimaryNavigation,studioUi:data.studioUi,studioShell:data.studioShell},null,2));
          if(Object.values(checks).some(v=>!v)){console.error('Release v105 contract failed:',checks);process.exit(1)}
          NODE
          check 'release declares exact 3-tab v105 contract' test $? -eq 0

          for page in clients video webtv advanced; do
            check "$page injects v105 CSS" grep -Fq '/studio/studio-shell-v105.css?v=1' "$tmp/$page.html"
            check "$page injects v105 JS" grep -Fq '/studio/studio-information-architecture-v65-1.js?v=105' "$tmp/$page.html"
          done

          check 'shell route: Parcours clients' grep -Fq "link('clients', '/studio/clients'" "$tmp/shell.js"
          check 'shell route: Diffusion' grep -Fq "link('diffusion', '/studio/webtv.html'" "$tmp/shell.js"
          check 'shell route: Réglages' grep -Fq "link('settings', '/studio/advanced.html#programs'" "$tmp/shell.js"
          if grep -Fq "link('production'" "$tmp/shell.js"; then echo '✗ Production vidéo still exists in primary shell'; failures=$((failures+1)); else echo '✓ Production vidéo absent from primary shell'; fi
          check 'single canonical logout component exists in shell source' grep -Fq 'id="neptuneStudioLogout"' "$tmp/shell.js"
          check 'canonical account block CSS exists' grep -Fq 'body.studio-shell-v105 .neptune-studio-account' "$tmp/shell.css"
          check 'production response identifies v105 Studio UI' grep -Fqi 'X-Neptune-Studio-UI: neptune-studio-ui-20260812-v105-three-tab-canonical-shell' "$tmp/clients.headers"

          echo "Failures: $failures"
          test "$failures" -eq 0
