name: Verify WebTV Live V119.7.1

on:
  pull_request:
    paths:
      - 'neptune-tv-media-cloudflare/src/webtv-control-v118.js'
      - 'neptune-tv-media-cloudflare/src/entry-v39.js'
      - 'neptune-tv-media-cloudflare/src/entry-v40.js'
      - 'neptune-tv-media-cloudflare/src/entry-v41.js'
      - 'neptune-tv-media-cloudflare/src/entry-v42.js'
      - 'neptune-tv-media-cloudflare/public/studio/webtv-native-v118.js'
      - 'neptune-tv-media-cloudflare/containers/webtv/**'
      - 'neptune-tv-media-cloudflare/wrangler.jsonc'
      - '.github/workflows/diagnose-streaming-production.yml'
      - '.github/workflows/verify-webtv-live-v1195.yml'
  workflow_run:
    workflows: ["Deploy Neptune Media to Cloudflare"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neptune-webtv-live-v11971-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify playback, readiness and Studio embed contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"main": "src/entry-v42.js"' neptune-tv-media-cloudflare/wrangler.jsonc
          grep -q "from './entry-v41.js'" neptune-tv-media-cloudflare/src/entry-v42.js
          grep -q "from './entry-v40.js'" neptune-tv-media-cloudflare/src/entry-v41.js
          grep -q "neptune-webtv-playback-20260815-v119.5" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "neptune-webtv-player-selection-20260815-v119.6" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "neptune-webtv-container-readiness-20260817-v119.7" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "worker-src" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "blob:" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "child-src" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -Fq "if((!window.Hls||!window.Hls.isSupported())&&video.canPlayType('application/vnd.apple.mpegurl'))" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "body.replace(NATIVE_FIRST,HLS_FIRST)" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "getContainer(env.WEBTV_ENCODER,WEBTV_INSTANCE)" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "startAndWaitForPorts" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "maintainWebTvV118(env)" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -q "retryableLiveResponse" neptune-tv-media-cloudflare/src/entry-v40.js
          grep -Fq 'src="/direct/?embed=1"' neptune-tv-media-cloudflare/public/studio/webtv-native-v118.js
          grep -Fq 'allow="autoplay; fullscreen"' neptune-tv-media-cloudflare/public/studio/webtv-native-v118.js

  live-probe:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        base:
          - https://neptune-media-webtv.neptunebusinessclub.workers.dev
          - https://tv.neptunebusiness.com
    steps:
      - uses: actions/checkout@v4
      - name: Probe state, repeated manifests and actual MPEG-TS segment
        shell: bash
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/webtv
          curl -fsS --retry 2 --retry-delay 1 "$BASE/api/public/webtv/state" -o /tmp/webtv/state.json
          cat /tmp/webtv/state.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/webtv/state.json'))
          e=s.get('encoder') or {}
          assert s.get('enabled') is True, s
          assert e.get('status') in ('streaming','live','running'), e
          assert not e.get('lastError'), e
          PY
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --retry 2 --retry-delay 1 -D "/tmp/webtv/manifest-$attempt.headers" "$BASE/direct/live/index.m3u8" -o "/tmp/webtv/index-$attempt.m3u8"
            grep -q '^#EXTM3U' "/tmp/webtv/index-$attempt.m3u8"
            echo "manifest attempt $attempt OK"
            sleep 1
          done
          cp /tmp/webtv/index-6.m3u8 /tmp/webtv/index.m3u8
          cp /tmp/webtv/manifest-6.headers /tmp/webtv/manifest.headers
          cat /tmp/webtv/manifest.headers
          cat /tmp/webtv/index.m3u8
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            grep -qi '^x-neptune-webtv-readiness: neptune-webtv-container-readiness-20260817-v119.7' /tmp/webtv/manifest.headers
          fi
          segment="$(grep -E '^segment-[0-9]+\.ts$' /tmp/webtv/index.m3u8 | tail -1)"
          test -n "$segment"
          code="$(curl -sS --retry 2 --retry-delay 1 -D /tmp/webtv/segment.headers -o /tmp/webtv/segment.ts -w '%{http_code}' "$BASE/direct/live/$segment")"
          echo "SEGMENT=$segment STATUS=$code BYTES=$(wc -c </tmp/webtv/segment.ts)"
          cat /tmp/webtv/segment.headers
          test "$code" = 200
          test "$(wc -c </tmp/webtv/segment.ts)" -gt 10000
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/webtv/segment.ts').read_bytes()
          assert len(p)>10000
          assert p[0]==0x47, p[:16]
          hits=sum(1 for i in range(0,min(len(p),188*20),188) if p[i:i+1]==b'G')
          assert hits>=10, hits
          print('segment MPEG-TS valide',len(p),'bytes',hits,'sync packets')
          PY

  browser-playback:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://tv.neptunebusiness.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright client
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0
          google-chrome --version
      - name: Verify Hls.js playback standalone and on exact Studio embed URL
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          const base=process.env.BASE;
          const browser=await chromium.launch({headless:true,channel:'chrome',args:['--autoplay-policy=no-user-gesture-required']});
          const context=await browser.newContext({viewport:{width:1365,height:900}});
          const page=await context.newPage();
          const log=[];
          page.on('console',m=>log.push(`console:${m.type()}:${m.text()}`));
          page.on('pageerror',e=>log.push(`pageerror:${e.message}`));
          page.on('requestfailed',r=>log.push(`requestfailed:${r.url()}:${r.failure()?.errorText||''}`));
          page.on('response',r=>{if(/direct\/live|hls\.js/.test(r.url()))log.push(`response:${r.status()}:${r.url()}`)});

          async function readState(target){
            return target.evaluate(()=>{
              const v=document.querySelector('#player');
              const s=document.querySelector('#playerState');
              return {readyState:v?.readyState,networkState:v?.networkState,currentTime:v?.currentTime,paused:v?.paused,muted:v?.muted,error:v?.error?{code:v.error.code,message:v.error.message}:null,stateHidden:s?.hidden,stateText:s?.innerText,currentSrc:v?.currentSrc||'',hlsSupported:Boolean(window.Hls?.isSupported?.())};
            });
          }
          async function inspect(target,label){
            await target.waitForSelector('#player',{state:'attached',timeout:20000});
            const deadline=Date.now()+45000;let state=await readState(target);
            while(Date.now()<deadline){if(state.currentTime>0.5&&state.readyState>=2&&!state.paused&&!state.error&&state.stateHidden===true&&state.hlsSupported&&state.currentSrc.startsWith('blob:'))break;await target.waitForTimeout(1000);state=await readState(target);}
            console.log(label,JSON.stringify(state,null,2));
            if(!(state.currentTime>0.5)||state.readyState<2||state.paused||state.error||state.stateHidden!==true||!state.hlsSupported||!state.currentSrc.startsWith('blob:')){console.log(log.join('\n'));throw new Error(`${label} Hls.js playback failed: ${JSON.stringify(state)}`);}
          }
          const standaloneResponse=await page.goto(`${base}/direct/?probe=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});if(!standaloneResponse?.ok())throw new Error(`standalone direct HTTP ${standaloneResponse?.status()}`);await inspect(page,'standalone');
          const embedResponse=await page.goto(`${base}/direct/?embed=1&probe=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});if(!embedResponse?.ok())throw new Error(`Studio embed direct HTTP ${embedResponse?.status()}`);await inspect(page,'studio-embed-document');
          const headers=embedResponse.headers();const csp=headers['content-security-policy']||'';const xfo=(headers['x-frame-options']||'').toUpperCase();const playback=headers['x-neptune-webtv-playback']||'';const player=headers['x-neptune-webtv-player']||'';const readiness=headers['x-neptune-webtv-readiness']||'';
          if(!/worker-src[^;]*blob:/.test(csp))throw new Error(`worker-src blob missing: ${csp}`);if(!/frame-ancestors[^;]*'self'/.test(csp))throw new Error(`same-origin frame permission missing: ${csp}`);if(xfo!=='SAMEORIGIN')throw new Error(`unexpected X-Frame-Options: ${xfo}`);if(playback!=='neptune-webtv-playback-20260815-v119.5')throw new Error(`unexpected playback release: ${playback}`);if(player!=='neptune-webtv-player-selection-20260815-v119.6')throw new Error(`unexpected player release: ${player}`);if(readiness!=='neptune-webtv-container-readiness-20260817-v119.7')throw new Error(`unexpected readiness release: ${readiness}`);
          console.log(log.join('\n'));await browser.close();
          NODE
