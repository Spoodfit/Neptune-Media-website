<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Confirmation · Neptune JT</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/assets/logo-neptune.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/reserver/neptune-jt/assets/styles.css?v=20260914-1">
  <style>
    .confirm-wrap{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:40px 16px}.confirm-card{width:min(660px,100%);padding:38px;border:1px solid #acc1e43d;border-radius:28px;background:linear-gradient(145deg,#0a1428ed,#07101fed);box-shadow:0 28px 90px #0007;text-align:center}.confirm-mark{width:70px;height:70px;margin:0 auto 20px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(135deg,#20a9ff,#755cff);font-size:2rem;font-weight:950}.confirm-card h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1;letter-spacing:-.055em;margin:12px 0}.confirm-card p{color:#aebbd0;line-height:1.65}.confirm-card .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}.confirm-card .actions a{min-height:48px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-weight:850;border:1px solid #ffffff1b;background:#0d1830}.confirm-card .actions a.primary{background:linear-gradient(105deg,#4258ff,#8238ff 34%,#c63aca 61%,#ff6a18)}.spinner{width:30px;height:30px;margin:16px auto;border:3px solid #ffffff1c;border-top-color:#20a9ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/neptune-jt/"><img src="/assets/logo-neptune.svg" alt=""><span>Neptune Media</span></a><div class="secure">Paiement sécurisé · Neptune JT</div></header>
  <main class="confirm-wrap">
    <section class="confirm-card" id="confirmCard" aria-live="polite">
      <div class="spinner" id="spinner"></div>
      <div class="confirm-mark" id="mark" hidden>✓</div>
      <div class="step-label" style="justify-content:center">NEPTUNE JT</div>
      <h1 id="title">Vérification du paiement…</h1>
      <p id="message">Nous vérifions votre règlement auprès de Stripe. Ne fermez pas cette page.</p>
      <div class="actions" id="actions" hidden>
        <a class="primary" href="/neptune-jt/">Voir Neptune JT</a>
        <a href="mailto:contact@neptunebusiness.com">Nous contacter</a>
      </div>
    </section>
  </main>
  <script>
    (async()=>{
      const params=new URLSearchParams(location.search),sessionId=params.get('session_id')||'';
      const title=document.getElementById('title'),message=document.getElementById('message'),spinner=document.getElementById('spinner'),mark=document.getElementById('mark'),actions=document.getElementById('actions');
      const finish=(ok,t,m)=>{spinner.hidden=true;mark.hidden=!ok;title.textContent=t;message.textContent=m;actions.hidden=false;};
      if(!sessionId){finish(false,'Confirmation introuvable.','Le paiement a peut-être été effectué, mais aucun identifiant de session Stripe n’a été transmis. Contactez Neptune Media si vous avez été débité.');return;}
      try{
        const response=await fetch(`/api/neptune-jt/payment-status?session_id=${encodeURIComponent(sessionId)}`,{cache:'no-store',credentials:'same-origin'});
        const data=await response.json().catch(()=>({}));
        if(response.ok&&data.confirmed){finish(true,'Votre place est confirmée.','Paiement validé. Votre passage au Neptune JT est désormais confirmé. Neptune vous recontactera pour le formulaire éditorial et l’appel de préparation.');return;}
        if(response.ok&&String(data.paymentStatus||'').toLowerCase()!=='paid'){finish(false,'Paiement en cours de validation.','Stripe n’a pas encore confirmé le règlement. Vous pouvez fermer cette page : nous traiterons automatiquement la confirmation dès réception du paiement.');return;}
        finish(false,'Nous devons vérifier votre paiement.','Votre session a bien été retrouvée, mais la confirmation automatique n’a pas abouti. Neptune Media vérifiera le règlement avant de valider votre place.');
      }catch(error){finish(false,'Vérification temporairement indisponible.','Votre paiement Stripe n’est pas annulé pour autant. Conservez votre reçu : Neptune Media pourra vérifier la transaction.');}
    })();
  </script>
</body>
</html>
