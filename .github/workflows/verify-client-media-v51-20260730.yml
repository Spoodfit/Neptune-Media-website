name: Verify Client Media V51 20260730

on:
  pull_request:
    paths:
      - '.github/workflows/verify-client-media-v51-20260730.yml'
      - 'neptune-tv-media-cloudflare/src/portal-client-media-v51.js'
      - 'neptune-tv-media-cloudflare/src/portal-youtube-client-v52.js'
      - 'neptune-tv-media-cloudflare/src/store-v7.js'
      - 'neptune-tv-media-cloudflare/src/entry-v11.js'
      - 'neptune-tv-media-cloudflare/public/espace-client/client-media-runtime-v51.js'
      - 'google-apps-script/NeptuneDriveTokenRelay.gs'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact-title YouTube matching and Drive relay state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://tv.neptunebusiness.com'

          ready=0
          for attempt in $(seq 1 30); do
            curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$BASE/api/public/release?client_media_attempt=$attempt" > /tmp/release.json || true
            if grep -Fq '"clientMediaTransport":"authenticated-same-origin-drive-proxy-with-range-v1"' /tmp/release.json \
              && grep -Fq '"youtubePublicationMatcher":"channel-feed-and-exact-long-title-search-v2"' /tmp/release.json; then
              ready=1
              break
            fi
            sleep 10
          done
          cat /tmp/release.json
          test "$ready" = 1

          curl --silent --show-error --cookie-jar /tmp/client-cookie.txt \
            -X POST "$BASE/api/client/request-code" \
            -H "Origin: $BASE" \
            -H 'Content-Type: application/json' \
            --data '{"email":"contact@neptunebusiness.com"}' > /tmp/login.json
          cat /tmp/login.json
          grep -Fq '"authenticated":true' /tmp/login.json

          curl --fail --silent --show-error --cookie /tmp/client-cookie.txt \
            "$BASE/api/client/session" > /tmp/session.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/session.json'))
          files=[f for o in data.get('orders',[]) for f in o.get('files',[])]
          drive=[f for f in files if f.get('driveFileId')]
          long_files=[f for f in files if str(f.get('fileType','')).lower() in {'final','emission','full','master','episode','long'}]
          assert files and drive and len(long_files) >= 2
          assert all(f.get('previewUrl') and f.get('downloadUrl') for f in drive)
          open('/tmp/file-id.txt','w').write(drive[0]['id'])
          print({'files':len(files),'drive':len(drive),'long':len(long_files),'long_titles':[f['name'] for f in long_files[:3]]})
          PY

          curl --fail --silent --show-error --cookie /tmp/client-cookie.txt \
            "$BASE/api/client/youtube-publications?validation=1&matcher=v2" > /tmp/youtube.json
          cat /tmp/youtube.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/youtube.json'))
          assert data.get('ok') is True
          assert data.get('matching') == 'channel-feed-and-exact-long-title-search-v2'
          assert data.get('matched'), data.get('diagnostics')
          top=data['matched'][0]
          assert top.get('videoId') and top.get('embedUrl') and top.get('watchUrl')
          print({'matched':len(data['matched']),'title':top['title'],'matchedFile':top.get('matchedFile'),'score':top.get('score')})
          PY

          FILE_ID="$(cat /tmp/file-id.txt)"
          status="$(curl --silent --show-error --output /tmp/media.bin --write-out '%{http_code}' \
            --cookie /tmp/client-cookie.txt -H 'Range: bytes=0-1023' \
            "$BASE/api/client/files/$FILE_ID?inline=1")"
          echo "Drive media status: $status"
          head -c 1000 /tmp/media.bin || true
          echo
          if test "$status" = 200 -o "$status" = 206; then
            test "$(wc -c < /tmp/media.bin)" -gt 0
            echo 'Drive OAuth relay operational.'
          else
            test "$status" = 502
            grep -Eq 'drive_access_token_missing|drive_file_unavailable' /tmp/media.bin
            echo 'Drive OAuth relay server deployed; Apps Script token publication or file authorization still pending.'
          fi

# validation-trigger: exact-title-youtube-v52-private-drive-relay-v5
