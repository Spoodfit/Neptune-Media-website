name: Diagnose Sales V97 Production

on:
  push:
    branches: ['diagnose/sales-v97-production']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public V97 state
        shell: bash
        run: |
          set -euo pipefail
          for base in \
            'https://neptune-media-webtv.neptunebusinessclub.workers.dev' \
            'https://tv.neptunebusiness.com'; do
            echo "=== $base ==="
            release=$(curl -fsS -H 'Cache-Control: no-cache, no-store' "$base/api/public/release?diag=${GITHUB_SHA}" || true)
            catalog=$(curl -fsS -H 'Cache-Control: no-cache, no-store' "$base/api/reservation/catalog-v96?diag=${GITHUB_SHA}" || true)
            RELEASE="$release" CATALOG="$catalog" node <<'NODE'
          const safeParse=(value)=>{try{return JSON.parse(value||'{}')}catch{return {parseError:true,rawLength:String(value||'').length}}};
          const r=safeParse(process.env.RELEASE),c=safeParse(process.env.CATALOG);
          const formats=Array.isArray(c.cities)?c.cities.flatMap(city=>city.formats||[]):[];
          const offers=formats.flatMap(format=>format.offers||[]);
          console.log(JSON.stringify({
            release:{release:r.release,salesTunnel:r.salesTunnel,videoImport:r.videoImport},
            catalog:{ok:c.ok,release:c.release,enhancementRelease:c.enhancementRelease,tier:c.pricing?.tierKey,paidCount:c.pricing?.paidCount,remaining:c.pricing?.remaining,cities:Array.isArray(c.cities)?c.cities.length:null,formats:formats.length,offers:offers.length,redirectSync:c.redirectSync||null},
          },null,2));
          NODE
          done
