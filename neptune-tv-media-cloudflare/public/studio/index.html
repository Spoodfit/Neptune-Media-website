<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#06183f">
  <title>Connexion · Neptune Media Studio</title>
  <link rel="icon" href="/assets/logo-neptune.svg">
  <link rel="stylesheet" href="/studio/studio-login-v48.css?v=1">
</head>
<body>
  <main id="auth" class="login-shell">
    <form id="login" class="login-card" novalidate>
      <a class="login-brand" href="/studio/clients" aria-label="Neptune Media Studio">
        <img src="/assets/logo-neptune.svg" alt="">
        <span><b>Neptune Media</b><small>Studio Admin</small></span>
      </a>
      <p class="eyebrow">ACCÈS PRIVÉ</p>
      <h1>Un seul Studio.<br><span>Un seul parcours.</span></h1>
      <p class="login-intro">Connectez-vous pour accéder directement au dernier espace de pilotage des clients.</p>
      <label><span>Adresse e-mail</span><input name="email" type="email" autocomplete="username" value="contact@neptunebusiness.com" required></label>
      <label id="passwordField"><span>Mot de passe</span><input name="password" type="password" autocomplete="current-password" minlength="12" required></label>
      <label id="confirmField" hidden><span>Confirmer le mot de passe</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="12"></label>
      <button id="loginSubmit" class="primary" type="submit">Accéder au Studio</button>
      <button id="requestReset" class="quiet" type="button">Première connexion ou mot de passe oublié</button>
      <p id="authHint" class="hint">Un lien sécurisé sera envoyé à l’adresse administrateur.</p>
      <p id="authMsg" class="message" aria-live="polite">Vérification de votre session…</p>
    </form>
  </main>
  <script type="module" src="/studio/studio-login-v48.js?v=1"></script>
</body>
</html>
