name: Diagnose Studio Mobile Production

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-studio-mobile-production.yml'

permissions:
  contents: read

jobs:
  diagnose-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          mkdir -p /tmp/neptune-mobile
          cd /tmp/neptune-mobile
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose mobile flow
        run: |
          cd /tmp/neptune-mobile
          cat > diagnose.mjs <<'EOF'
          import { chromium } from 'playwright';
          const order={id:'audit-order-v12',clientId:'c1',email:'lea.audit@example.com',fullName:'Léa Depoulain',company:'Neptune business',title:'Passage Neptune Media',format:'Hors Norme',paymentStatus:'paid',amountTotal:180000,currency:'eur',status:'studio_date_confirmation_pending',appointmentAt:'2026-07-27T06:00:00.000Z',appointmentSource:'google_calendar',filmingAt:null,nextAction:'Neptune attend la confirmation définitive du studio.',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),steps:[],files:[],schedules:[],workflow:{supplierStatus:'pending',preparationStatus:'completed',currentLabel:'Date du passage en confirmation',nextAction:'Neptune attend la confirmation définitive du studio.',requestedFilmingAt:null,appointmentSource:'google_calendar',broadcastStatus:'not_scheduled',sourceQcStatus:'not_started',inventory:{sourceCount:0,finalCount:0,shortCount:0,hasSource:false,hasFinal:false,hasShort:false}}};
          const clients={clients:[{id:'c1',email:order.email,fullName:order.fullName,company:order.company,active:true,orderCount:1}],orders:[order],supplierPayments:[],refundRequests:[],deletionRequests:[],finance:{}};
          const control={ok:true,summary:{active:1,actions:1},actions:[{type:'order',orderId:order.id,title:'Confirmation du studio attendue',reason:'REC BOX doit confirmer ou proposer une autre date sous 48 heures.'}],upcoming:[]};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
          await context.addInitScript(()=>localStorage.setItem('neptune_studio_sidebar_collapsed','1'));
          const page=await context.newPage();
          page.on('pageerror',(error)=>console.log('PAGE_ERROR',error.message));
          page.on('console',(message)=>console.log('BROWSER',message.type(),message.text()));
          await page.route('**/api/**',async(route)=>{
            const path=new URL(route.request().url()).pathname;
            const json=(body)=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
            if(path==='/api/auth/status')return json({authenticated:true,csrfToken:'audit',user:{id:'a',email:'audit@neptunebusiness.com',role:'admin'}});
            if(path==='/api/admin/clients')return json(clients);
            if(path==='/api/admin/control-room')return json(control);
            if(path==='/api/admin/workflow/events')return json({ok:true,events:[]});
            if(path==='/api/admin/feedback')return json({items:[]});
            return json({ok:true});
          });
          const step=async(name,fn)=>{console.log('STEP_START',name);try{const result=await fn();console.log('STEP_OK',name,result??'');return result;}catch(error){console.log('STEP_FAIL',name,error.stack||error.message);await page.screenshot({path:`failure-${name.replaceAll(' ','-')}.png`,fullPage:true}).catch(()=>{});throw error;}};
          try{
            await step('goto',()=>page.goto('https://tv.neptunebusiness.com/studio/clients?diagnose-mobile=1',{waitUntil:'domcontentloaded',timeout:60000}));
            await step('tabs',()=>page.waitForSelector('.workflow-stage-tabs',{timeout:30000}));
            await step('card',()=>page.waitForSelector('[data-order-card="audit-order-v12"]',{timeout:30000}));
            await page.screenshot({path:'mobile-list.png',fullPage:true});
            console.log('GEOMETRY',await page.evaluate(()=>({width:innerWidth,doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,active:document.querySelector('.workflow-stage-tabs button.active span')?.textContent,focus:document.querySelector('[data-focus-order]')?.getBoundingClientRect(),card:document.querySelector('[data-order-card]')?.getBoundingClientRect(),sidebar:document.querySelector('.studio-sidebar')?.getBoundingClientRect()})));
            await step('focus-click',()=>page.locator('[data-focus-order]').click({timeout:10000}));
            await step('dialog',()=>page.waitForSelector('#clientDialog[open]',{timeout:10000}));
            await step('command',()=>page.waitForSelector('#workflowCommandCenter',{timeout:10000}));
            await page.screenshot({path:'mobile-detail.png',fullPage:true});
            console.log('DETAIL',await page.evaluate(()=>({dialog:document.querySelector('#clientDialog')?.getBoundingClientRect(),bodyHidden:document.querySelector('#detailBody')?.hidden,command:!!document.querySelector('#workflowCommandCenter')})));
            await step('calendar-click',()=>page.locator('[data-detail-tab="calendar"]').click({timeout:10000}));
            await page.waitForTimeout(300);
            await page.screenshot({path:'mobile-calendar.png',fullPage:true});
            console.log('DONE');
          } finally {
            await browser.close();
          }
          EOF
          node diagnose.mjs
      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-mobile-diagnostic-v12
          path: /tmp/neptune-mobile/*.png
          if-no-files-found: warn
