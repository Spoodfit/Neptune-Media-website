name: Verify Studio Unified Production v14.2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-studio-unified-production-v14-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check production contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            'https://tv.neptunebusiness.com/api/public/release?verify=v14-2' > /tmp/release.json
          grep -Fq '"studioCanonicalPath":"/studio/clients"' /tmp/release.json
          grep -Fq '"legacyStudioDashboard":"removed"' /tmp/release.json
          grep -Fq '"retiredStudioAssets":"blocked-with-404"' /tmp/release.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://tv.neptunebusiness.com/studio/control-v37.js')" = '404'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://tv.neptunebusiness.com/studio/control-v36.css')" = '404'
          echo 'Contrat de production Studio unifié : OK'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright silently
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Diagnose canonical authenticated landing
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-studio-v14-2.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          const pageErrors = [];
          const consoleMessages = [];
          const requests = [];
          page.on('pageerror', (error) => pageErrors.push(String(error.message || error)));
          page.on('console', (message) => consoleMessages.push(`${message.type()}: ${message.text()}`));
          page.on('request', (request) => {
            const url = new URL(request.url());
            if (url.pathname.startsWith('/api/')) requests.push(url.pathname);
          });

          await page.route('**/api/**', async (route) => {
            const pathname = new URL(route.request().url()).pathname;
            const body = pathname === '/api/auth/status'
              ? { authenticated: true, csrfToken: 'verification-token', user: { email: 'contact@neptunebusiness.com', role: 'admin' } }
              : pathname === '/api/admin/clients'
                ? { clients: [], orders: [], supplierPayments: [], refundRequests: [], deletionRequests: [], finance: {} }
                : {};
            await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(body) });
          });

          let failure = '';
          try {
            await page.goto('https://tv.neptunebusiness.com/studio/?behavior=unified-v14-2', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(5000);
          } catch (error) {
            failure = String(error.stack || error.message || error);
          }

          const state = await page.evaluate(() => ({
            href: location.href,
            path: location.pathname,
            title: document.title,
            heading: document.querySelector('.clients-topbar h1')?.textContent?.trim() || '',
            rootHeading: document.querySelector('h1')?.textContent?.trim() || '',
            oldControlTitle: document.body.textContent?.includes('Contrôle automatique') || false,
            oldSecureCard: document.body.textContent?.includes('points à sécuriser') || false,
            loginGatewayVisible: Boolean(document.querySelector('.login-shell')),
            bodyStart: document.body.textContent?.trim().slice(0, 500) || '',
          })).catch(() => ({}));

          const report = { state, pageErrors, consoleMessages, requests, failure };
          fs.writeFileSync('/tmp/studio-unified-v14-2.json', JSON.stringify(report, null, 2));
          console.log(`STUDIO_DIAGNOSTIC=${JSON.stringify(report)}`);
          await page.screenshot({ path: '/tmp/studio-unified-v14-2.png', fullPage: true }).catch(() => {});
          await browser.close();
          EOF
          node /tmp/verify-studio-v14-2.mjs

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-unified-production-v14-2
          path: |
            /tmp/studio-unified-v14-2.png
            /tmp/studio-unified-v14-2.json
          if-no-files-found: warn
