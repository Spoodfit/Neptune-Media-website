name: Finalize canonical filenames once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-canonical-filenames-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Replace obsolete canonical filenames and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'entry-v48.js': 'worker.js',
              'app_v69.py': 'processor.py',
              'app_v71.py': 'entry.py',
              'encoder-v118.mjs': 'encoder.mjs',
              'encoder-smoothness-v124.mjs': 'apply-smoothness-patch.mjs',
          }
          skip_dirs = {'.git', 'node_modules', '.wrangler', 'dist', 'coverage'}
          self_path = Path('.github/workflows/finalize-canonical-filenames-once.yml')
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path == self_path or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  raw = path.read_bytes()
                  if b'\x00' in raw:
                      continue
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Updated canonical filename references:')
          for name in changed:
              print(f' - {name}')
          PY
          git rm -f .github/workflows/finalize-canonical-filenames-once.yml
          git config user.name 'Neptune Repository Cleaner'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Normalize canonical runtime filename references'
          git push origin HEAD:main
