name: Verify Media Catalog V116

on:
  pull_request:
    paths:
      - 'neptune-tv-media-cloudflare/src/portal-media-catalog-v98.js'
      - 'neptune-tv-media-cloudflare/src/catalog-commerce-v143.js'
      - 'neptune-tv-media-cloudflare/src/portal-presenters-v146.js'
      - 'neptune-tv-media-cloudflare/src/store-v29.js'
      - 'neptune-tv-media-cloudflare/public/studio/media-catalog-form-v116.js'
      - 'neptune-tv-media-cloudflare/public/studio/media-catalog-services-v116.js'
      - 'neptune-tv-media-cloudflare/public/studio/media-catalog-runtime-fix-v115.js'
      - 'neptune-tv-media-cloudflare/public/studio/studio-catalog-commerce-v143-4.js'
      - 'neptune-tv-media-cloudflare/scripts/verify-media-catalog-v116.mjs'
      - 'neptune-tv-media-cloudflare/tests/audit-media-catalog-v116.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/verify-media-catalog-v116.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Worker dependencies
        working-directory: neptune-tv-media-cloudflare
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Syntaxe et contrat v116
        working-directory: neptune-tv-media-cloudflare
        run: |
          node --check src/portal-media-catalog-v98.js
          node --check src/store-v29.js
          node --check public/studio/media-catalog-form-v116.js
          node --check public/studio/media-catalog-services-v116.js
          node --check public/studio/media-catalog-runtime-fix-v115.js
          node --check public/studio/studio-catalog-commerce-v143-4.js
          node --check tests/audit-media-catalog-v116.mjs
          node scripts/verify-media-catalog-v116.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local Worker from canonical config
        shell: bash
        run: |
          set -euo pipefail
          ./neptune-tv-media-cloudflare/node_modules/.bin/wrangler dev --config wrangler.jsonc --local --port 8787 > /tmp/wrangler-v116.log 2>&1 &
          ready=0
          for attempt in $(seq 1 120); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8787/studio/advanced.html >/dev/null; then
              ready=1
              echo "Catalogue Worker ready after ${attempt} attempts"
              break
            fi
            if (( attempt % 20 == 0 )); then echo "Waiting for Catalogue Worker (${attempt}/120)…"; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/wrangler-v116.log; exit 1; fi
      - name: Audit Catalogue v116 dans Chromium
        env:
          STUDIO_BASE_URL: http://127.0.0.1:8787
        run: node neptune-tv-media-cloudflare/tests/audit-media-catalog-v116.mjs
      - name: Worker log on failure
        if: failure()
        run: cat /tmp/wrangler-v116.log || true
