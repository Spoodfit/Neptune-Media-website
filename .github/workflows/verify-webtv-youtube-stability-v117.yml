name: Verify WebTV YouTube Stability V117

on:
  pull_request:
    paths:
      - 'neptune-tv-media-cloudflare/containers/webtv/encoder.mjs'
      - 'neptune-tv-media-cloudflare/public/studio/webtv-live-monitor-v1.js'
      - 'neptune-tv-media-cloudflare/scripts/verify-webtv-youtube-stability-v117.mjs'
      - '.github/workflows/verify-webtv-youtube-stability-v117.yml'
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/containers/webtv/encoder.mjs'
      - 'neptune-tv-media-cloudflare/public/studio/webtv-live-monitor-v1.js'
      - 'neptune-tv-media-cloudflare/scripts/verify-webtv-youtube-stability-v117.mjs'
      - '.github/workflows/verify-webtv-youtube-stability-v117.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate v117 source contracts
        run: |
          node --check neptune-tv-media-cloudflare/containers/webtv/encoder.mjs
          node --check neptune-tv-media-cloudflare/public/studio/webtv-live-monitor-v1.js
          node --check neptune-tv-media-cloudflare/scripts/verify-webtv-youtube-stability-v117.mjs
          node neptune-tv-media-cloudflare/scripts/verify-webtv-youtube-stability-v117.mjs
      - name: Install FFmpeg test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Validate continuous FFmpeg relay across media boundaries
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null
          command -v ffprobe >/dev/null
          work="$(mktemp -d)"
          port=23117
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i 'testsrc=size=640x360:rate=30:duration=6' \
            -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=6' \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$work/a.mp4"
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i 'testsrc2=size=320x240:rate=25:duration=3' \
            -c:v libx264 -pix_fmt yuv420p "$work/b.mp4"
          ffmpeg -hide_banner -nostdin -loglevel warning \
            -fflags +genpts+discardcorrupt -use_wallclock_as_timestamps 1 \
            -i "udp://127.0.0.1:${port}?fifo_size=1000000&overrun_nonfatal=1" \
            -map 0:v:0 -map 0:a:0? -c:v copy -c:a copy \
            -flvflags no_duration_filesize -f flv "$work/out.flv" \
            >"$work/relay.out" 2>"$work/relay.err" &
          relay_pid=$!
          cleanup() { kill -KILL "$relay_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 0.4
          send_item() {
            local input="$1"
            local audio="$2"
            local args=( -hide_banner -nostdin -loglevel error -re -i "$input" )
            if [ "$audio" = no ]; then args+=( -re -f lavfi -i 'anullsrc=channel_layout=stereo:sample_rate=48000' ); fi
            args+=( -map 0:v:0 )
            if [ "$audio" = yes ]; then args+=( -map '0:a:0?' ); else args+=( -map '1:a:0' ); fi
            args+=(
              -vf 'scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p,setpts=PTS-STARTPTS'
              -c:v libx264 -preset ultrafast -tune zerolatency
              -b:v 2000k -maxrate 2000k -bufsize 4000k
              -g 60 -keyint_min 60 -sc_threshold 0 -x264-params repeat-headers=1
              -c:a aac -b:a 128k -ar 48000 -ac 2
              -af 'aresample=async=1:first_pts=0' -shortest
              -muxdelay 0 -muxpreload 0 -mpegts_flags +resend_headers+initial_discontinuity
              -f mpegts "udp://127.0.0.1:${port}?pkt_size=1316"
            )
            ffmpeg "${args[@]}"
          }
          send_item "$work/a.mp4" yes
          sleep 0.2
          kill -0 "$relay_pid"
          send_item "$work/b.mp4" no
          sleep 2
          kill -0 "$relay_pid"
          kill -KILL "$relay_pid" 2>/dev/null || true
          wait "$relay_pid" 2>/dev/null || true
          trap - EXIT
          test -s "$work/out.flv"
          ffprobe -hide_banner -loglevel error -select_streams v:0 \
            -show_entries packet=pts_time -of csv=p=0 "$work/out.flv" > "$work/pts.txt"
          awk '
            BEGIN { count=0; bad=0; first=-1; last=-1 }
            {
              split($1,a,","); value=a[1]+0;
              if(count==0) first=value;
              if(count>0 && value+0.0001<last) bad++;
              last=value; count++;
            }
            END {
              if(count<120 || bad>0 || last-first<7.0) exit 1;
              printf("continuous relay verified: packets=%d span=%.3fs\n",count,last-first);
            }
          ' "$work/pts.txt"
