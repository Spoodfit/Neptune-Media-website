name: Verify Studio Unified Production v14

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-studio-unified-production-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_URL: https://tv.neptunebusiness.com
    steps:
      - name: Wait for unified Studio deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            curl --silent --show-error -H 'Cache-Control: no-cache, no-store' \
              "$PUBLIC_URL/api/public/release?studio-unified=$attempt" > /tmp/release.json || true
            if grep -Fq '"studioCanonicalPath":"/studio/clients"' /tmp/release.json \
              && grep -Fq '"studioEntryMode":"login-gateway-to-canonical-workspace"' /tmp/release.json \
              && grep -Fq '"legacyStudioDashboard":"removed"' /tmp/release.json \
              && grep -Fq '"retiredStudioAssets":"blocked-with-404"' /tmp/release.json; then
              cat /tmp/release.json
              exit 0
            fi
            sleep 10
          done
          cat /tmp/release.json
          exit 1

      - name: Verify served pages and retired assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/studio/?verify=$GITHUB_SHA" > /tmp/studio-entry.html
          grep -Fq '<title>Connexion · Neptune Media Studio</title>' /tmp/studio-entry.html
          grep -Fq '/studio/studio-login-v48.css?v=1' /tmp/studio-entry.html
          grep -Fq '/studio/studio-login-v48.js?v=1' /tmp/studio-entry.html
          ! grep -Fq 'Contrôle automatique' /tmp/studio-entry.html
          ! grep -Fq 'id="app"' /tmp/studio-entry.html
          ! grep -Fq '/studio/control-v37.js' /tmp/studio-entry.html
          ! grep -Fq '/studio/control-v36.css' /tmp/studio-entry.html

          curl --fail --silent --show-error "$PUBLIC_URL/studio/studio-login-v48.js?v=1" > /tmp/studio-login.js
          grep -Fq "const CANONICAL_STUDIO_PATH = '/studio/clients'" /tmp/studio-login.js
          grep -Fq 'location.replace(destination)' /tmp/studio-login.js

          curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
            "$PUBLIC_URL/studio/clients?verify=$GITHUB_SHA" > /tmp/studio-clients.html
          grep -Fq '<h1>Parcours clients</h1>' /tmp/studio-clients.html
          grep -Fq 'aria-current="page"' /tmp/studio-clients.html
          ! grep -Fq 'href="/studio/"' /tmp/studio-clients.html
          ! grep -Fq '>Vue d’ensemble<' /tmp/studio-clients.html
          ! grep -Fq '>Surveillance clients<' /tmp/studio-clients.html

          status_js="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/studio/control-v37.js")"
          status_css="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/studio/control-v36.css")"
          echo "control-v37.js=$status_js control-v36.css=$status_css"
          test "$status_js" = '404'
          test "$status_css" = '404'

          curl --silent --show-error --get --dump-header /tmp/legacy-headers.txt --output /dev/null \
            --data-urlencode "verify=$GITHUB_SHA" "$PUBLIC_URL/studio/control.html"
          cat /tmp/legacy-headers.txt
          grep -Eiq '^location: https://tv\.neptunebusiness\.com/studio/clients\?verify=' /tmp/legacy-headers.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify authenticated landing behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-studio.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(String(error.message || error)));

          await page.route('**/api/auth/status', async (route) => {
            await route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({ authenticated: true, csrfToken: 'verification-token', user: { email: 'contact@neptunebusiness.com', role: 'admin' } }),
            });
          });
          await page.route('**/api/admin/clients', async (route) => {
            await route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({ clients: [], orders: [], supplierPayments: [], refundRequests: [], deletionRequests: [], finance: {} }),
            });
          });

          await page.goto('https://tv.neptunebusiness.com/studio/?behavior=unified', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForURL(/\/studio\/clients(?:\?|$)/u, { timeout: 20000 });
          await page.waitForSelector('h1', { timeout: 15000 });
          const state = await page.evaluate(() => ({
            path: location.pathname,
            title: document.title,
            heading: document.querySelector('.clients-topbar h1')?.textContent?.trim() || '',
            oldDashboard: document.body.textContent?.includes('2 points à sécuriser') || document.body.textContent?.includes('Contrôle automatique'),
          }));
          if (state.path !== '/studio/clients') throw new Error(`Chemin final incorrect: ${JSON.stringify(state)}`);
          if (state.heading !== 'Parcours clients') throw new Error(`Workspace incorrect: ${JSON.stringify(state)}`);
          if (state.oldDashboard) throw new Error(`Ancien dashboard encore visible: ${JSON.stringify(state)}`);
          if (errors.length) throw new Error(`Erreurs JavaScript: ${errors.join(' | ')}`);
          await page.screenshot({ path: '/tmp/studio-unified.png', fullPage: true });
          await browser.close();
          console.log(JSON.stringify(state));
          EOF
          node /tmp/verify-studio.mjs

      - name: Upload verification screenshot
        uses: actions/upload-artifact@v4
        with:
          name: studio-unified-production-v14
          path: /tmp/studio-unified.png
          if-no-files-found: error
