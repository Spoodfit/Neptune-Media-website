name: Diagnose HORS NORME routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-entry-v48-and-deploy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare workers.dev and media domain
        shell: bash
        env:
          MEDIA_URL: https://media.neptunebusiness.com
          WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
        run: |
          set -euo pipefail
          check() {
            local base="$1"
            local slug="$2"
            echo "=== $base ==="
            curl -sS -L -D "/tmp/$slug.headers" -o "/tmp/$slug.html" -H 'Cache-Control: no-cache, no-store' "$base/hors-norme?diag=$GITHUB_SHA" || true
            echo "--- final headers ---"
            grep -Ei '^(HTTP/|location:|server:|cf-ray:|cf-cache-status:|x-neptune-|content-type:)' "/tmp/$slug.headers" || true
            echo "--- landing markers ---"
            grep -oF 'Une demi-journée.' "/tmp/$slug.html" | head -1 || true
            grep -oF '3 mois de contenus' "/tmp/$slug.html" | head -1 || true
            grep -oF 'Diffusé aussi par Neptune' "/tmp/$slug.html" | head -1 || true
            echo "--- title ---"
            grep -oE '<title>[^<]+' "/tmp/$slug.html" | head -1 || true
            echo "--- release endpoint ---"
            curl -sS -L -H 'Cache-Control: no-cache, no-store' "$base/api/public/release?diag=$GITHUB_SHA" | head -c 1200 || true
            echo
          }
          check "$WORKERS_URL" workers
          check "$MEDIA_URL" media
