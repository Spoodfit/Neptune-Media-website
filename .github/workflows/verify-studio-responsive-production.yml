name: Verify Studio Responsive Production

on:
  pull_request:
    paths:
      - '.github/workflows/verify-studio-responsive-production.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Verify production assets
        shell: bash
        run: |
          set -euo pipefail
          public='https://tv.neptunebusiness.com'
          workers='https://neptune-media-webtv.neptunebusinessclub.workers.dev'
          expected='neptune-studio-responsive-audit-20260724-v12'
          for base in "$workers" "$public"; do
            for attempt in $(seq 1 18); do
              curl --silent --show-error -H 'Cache-Control: no-cache, no-store' "$base/api/public/release?attempt=$attempt" > /tmp/release.json || true
              if grep -Fq "\"release\":\"$expected\"" /tmp/release.json; then break; fi
              sleep 10
            done
            cat /tmp/release.json
            grep -Fq "\"release\":\"$expected\"" /tmp/release.json
            grep -Fq '"studioWorkflowUi":"workspace-v42-responsive-audit"' /tmp/release.json
            grep -Fq '"interactionModel":"inline-confirmation-no-native-popup"' /tmp/release.json
          done
          for attempt in $(seq 1 18); do
            curl --silent --show-error -H 'Cache-Control: no-cache, no-store' "$public/studio/clients?asset=$attempt" > /tmp/studio.html || true
            if grep -Fq '/studio/workspace-v43.css?v=1' /tmp/studio.html; then break; fi
            sleep 10
          done
          grep -Fq '/studio/workspace-v43.css?v=1' /tmp/studio.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/neptune-ui-audit
          cd /tmp/neptune-ui-audit
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Audit desktop, tablet and mobile layouts
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/neptune-ui-audit
          mkdir -p screenshots
          cat > audit.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const base='https://tv.neptunebusiness.com';
          const now=new Date().toISOString();
          const order={id:'audit-order-v12',clientId:'c1',email:'lea.audit@example.com',fullName:'Léa Depoulain',company:'Neptune business',title:'Passage Neptune Media',format:'Hors Norme',paymentStatus:'paid',amountTotal:180000,currency:'eur',status:'studio_date_confirmation_pending',appointmentAt:'2026-07-27T06:00:00.000Z',appointmentSource:'google_calendar',filmingAt:null,nextAction:'Neptune attend la confirmation définitive du studio.',createdAt:now,updatedAt:now,steps:[],files:[],schedules:[],workflow:{supplierStatus:'pending',preparationStatus:'completed',currentLabel:'Date du passage en confirmation',nextAction:'Neptune attend la confirmation définitive du studio.',requestedFilmingAt:null,appointmentSource:'google_calendar',broadcastStatus:'not_scheduled',sourceQcStatus:'not_started',inventory:{sourceCount:0,finalCount:0,shortCount:0,hasSource:false,hasFinal:false,hasShort:false}}};
          const clients={clients:[{id:'c1',email:order.email,fullName:order.fullName,company:order.company,active:true,orderCount:1}],orders:[order],supplierPayments:[],refundRequests:[],deletionRequests:[],finance:{}};
          const control={ok:true,summary:{active:1,actions:1},actions:[{type:'order',orderId:order.id,title:'Confirmation du studio attendue',reason:'REC BOX doit confirmer ou proposer une autre date sous 48 heures.'}],upcoming:[]};
          const viewports=[{name:'desktop-1440',width:1440,height:900},{name:'laptop-1180',width:1180,height:820},{name:'tablet-768',width:768,height:900},{name:'mobile-390',width:390,height:844}];
          const browser=await chromium.launch({headless:true});
          const failures=[];

          for(const viewport of viewports){
            let context;
            try{
              context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1});
              await context.addInitScript(()=>localStorage.setItem('neptune_studio_sidebar_collapsed','1'));
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',(error)=>pageErrors.push(String(error.message||error)));
              await page.route('**/api/**',async(route)=>{
                const path=new URL(route.request().url()).pathname;
                const json=(body)=>route.fulfill({status:200,contentType:'application/json; charset=utf-8',body:JSON.stringify(body)});
                if(path==='/api/auth/status')return json({authenticated:true,csrfToken:'audit',user:{id:'a',email:'audit@neptunebusiness.com',role:'admin'}});
                if(path==='/api/admin/clients')return json(clients);
                if(path==='/api/admin/control-room')return json(control);
                if(path==='/api/admin/workflow/events')return json({ok:true,events:[]});
                if(path==='/api/admin/feedback')return json({items:[]});
                return json({ok:true});
              });

              await page.goto(`${base}/studio/clients?responsive-audit=${viewport.name}`,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('.workflow-stage-tabs',{timeout:30000});
              await page.waitForSelector('[data-order-card="audit-order-v12"]',{timeout:30000});
              await page.waitForTimeout(350);
              await page.screenshot({path:`screenshots/${viewport.name}-list.png`,fullPage:true});

              const list=await page.evaluate(()=>{
                const card=document.querySelector('[data-order-card]')?.getBoundingClientRect();
                const pipeline=document.querySelector('#pipeline')?.getBoundingClientRect();
                const sidebar=document.querySelector('.studio-sidebar')?.getBoundingClientRect();
                const visible=(element)=>{const style=getComputedStyle(element),rect=element.getBoundingClientRect();return style.display!=='none'&&style.visibility!=='hidden'&&rect.width>0&&rect.height>0;};
                const clipped=[...document.querySelectorAll('button,a,input,select,[role="button"]')].filter((element)=>{if(!visible(element)||element.closest('.workflow-stage-tabs,.studio-nav,.tabs'))return false;const rect=element.getBoundingClientRect();return rect.left<-1||rect.right>innerWidth+1;}).map((element)=>({tag:element.tagName,className:String(element.className),left:element.getBoundingClientRect().left,right:element.getBoundingClientRect().right})).slice(0,10);
                return {innerWidth,docWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,active:document.querySelector('.workflow-stage-tabs button.active span')?.textContent?.trim()||'',cardWidth:card?.width||0,pipelineWidth:pipeline?.width||0,sidebarWidth:sidebar?.width||0,sidebarHeight:sidebar?.height||0,clipped};
              });
              if(Math.max(list.docWidth,list.bodyWidth)>list.innerWidth+1)failures.push(`${viewport.name}: débordement horizontal ${JSON.stringify(list)}`);
              if(list.active!=='À confirmer')failures.push(`${viewport.name}: étape active ${list.active}`);
              if(list.pipelineWidth&&list.cardWidth/list.pipelineWidth<.88)failures.push(`${viewport.name}: carte trop étroite ${list.cardWidth}/${list.pipelineWidth}`);
              if(list.clipped.length)failures.push(`${viewport.name}: éléments coupés ${JSON.stringify(list.clipped)}`);
              if(viewport.width>=721&&viewport.width<=1080&&(list.sidebarWidth<78||list.sidebarHeight<viewport.height-2))failures.push(`${viewport.name}: sidebar tablette invalide ${list.sidebarWidth}x${list.sidebarHeight}`);
              if(viewport.width<=720&&(list.sidebarWidth<viewport.width-2||list.sidebarHeight<60))failures.push(`${viewport.name}: navigation mobile invalide ${list.sidebarWidth}x${list.sidebarHeight}`);

              if(viewport.width>=1081){
                const before=await page.locator('.studio-sidebar').boundingBox();
                await page.locator('#studioSidebarToggle').click();
                await page.waitForTimeout(280);
                const after=await page.locator('.studio-sidebar').boundingBox();
                if(!before||!after||before.width>100||after.width<240)failures.push(`${viewport.name}: sidebar rétractable ${before?.width}->${after?.width}`);
                await page.locator('#studioSidebarToggle').click();
                await page.waitForTimeout(280);
              }

              await page.locator('[data-focus-order]').click({timeout:10000});
              await page.waitForSelector('#clientDialog[open]',{timeout:10000});
              await page.waitForSelector('#workflowCommandCenter',{timeout:10000});
              await page.waitForTimeout(220);
              await page.screenshot({path:`screenshots/${viewport.name}-detail.png`,fullPage:true});
              const detail=await page.evaluate(()=>{const rect=document.querySelector('#clientDialog')?.getBoundingClientRect();return{left:rect?.left||0,right:rect?.right||0,bodyHidden:Boolean(document.querySelector('#detailBody')?.hidden),command:!!document.querySelector('#workflowCommandCenter')};});
              if(viewport.width>720&&detail.left<78)failures.push(`${viewport.name}: dossier recouvre la sidebar ${JSON.stringify(detail)}`);
              if(viewport.width<=720&&Math.abs(detail.left)>1)failures.push(`${viewport.name}: dossier mobile décalé ${JSON.stringify(detail)}`);
              if(!detail.bodyHidden||!detail.command)failures.push(`${viewport.name}: suivi dupliqué ${JSON.stringify(detail)}`);

              await page.locator('[data-detail-tab="calendar"]').click({timeout:10000});
              await page.waitForTimeout(250);
              await page.screenshot({path:`screenshots/${viewport.name}-calendar.png`,fullPage:true});
              const calendar=await page.evaluate(()=>({bodyHidden:Boolean(document.querySelector('#detailBody')?.hidden),command:!!document.querySelector('#workflowCommandCenter'),docWidth:document.documentElement.scrollWidth,innerWidth}));
              if(calendar.bodyHidden||calendar.command)failures.push(`${viewport.name}: onglet Calendrier ${JSON.stringify(calendar)}`);
              if(calendar.docWidth>calendar.innerWidth+1)failures.push(`${viewport.name}: calendrier déborde ${JSON.stringify(calendar)}`);
              if(pageErrors.length)failures.push(`${viewport.name}: erreurs JS ${pageErrors.join(' | ')}`);
            }catch(error){
              failures.push(`${viewport.name}: exception ${error.stack||error.message}`);
            }finally{
              await context?.close().catch(()=>{});
            }
          }

          await browser.close();
          fs.writeFileSync('screenshots/failures.txt',failures.join('\n')||'OK');
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          console.log('Audit responsive Studio réussi sur 1440, 1180, 768 et 390 px.');
          EOF
          node audit.mjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-responsive-v12
          path: /tmp/neptune-ui-audit/screenshots
          if-no-files-found: warn
