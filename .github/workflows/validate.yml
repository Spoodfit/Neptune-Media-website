name: Validate Neptune Media

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install production worker dependencies
        run: npm install --package-lock=false --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
      - name: Validate production application
        run: npm run check
      - name: Validate production Worker bundle
        run: npx wrangler deploy --config wrangler.jsonc --dry-run --outdir .wrangler-pr-dry-run
