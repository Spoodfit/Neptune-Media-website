name: Verify Neptune Video Cloud Production V67

on:
  push:
    branches: [main]
    paths:
      - 'neptune-tv-media-cloudflare/src/entry-v16.js'
      - 'neptune-tv-media-cloudflare/src/video-ai-routes-v3.js'
      - 'neptune-tv-media-cloudflare/src/openai-video-analysis-v1.js'
      - 'neptune-tv-media-cloudflare/src/video-ai-openai-routes-v1.js'
      - 'neptune-tv-media-cloudflare/containers/video-ai/**'
      - 'neptune-tv-media-cloudflare/public/studio/video-ai.html'
      - 'neptune-tv-media-cloudflare/public/studio/video-ai-v1.js'
      - 'neptune-tv-media-cloudflare/public/studio/video-ai-cloud-resilience-v67.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/verify-openai-video-production-v66.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-neptune-video-cloud-production-v67
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKERS_URL: https://neptune-media-webtv.neptunebusinessclub.workers.dev
      PUBLIC_URL: https://tv.neptunebusiness.com
      VIDEO_AI_RELEASE: neptune-video-cloud-engine-20260731-v67
      OPENAI_RELEASE: neptune-openai-video-analysis-20260731-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cloud engine on both production domains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/video-cloud-v67

          verify_domain() {
            local base="$1"
            local slug="$2"
            local ready=0

            for attempt in $(seq 1 90); do
              local query="video_cloud_v67=$GITHUB_SHA&attempt=$attempt"
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/api/public/release?$query" > "/tmp/video-cloud-v67/$slug-release.json" || true
              curl --fail --silent --show-error --location --max-redirs 5 -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai?$query" > "/tmp/video-cloud-v67/$slug-video-ai.html" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai-cloud-resilience-v67.js?v=1&$query" > "/tmp/video-cloud-v67/$slug-resilience.js" || true
              curl --fail --silent --show-error -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai-v1.js?v=67&$query" > "/tmp/video-cloud-v67/$slug-client.js" || true
              curl --fail --silent --show-error -I -H 'Cache-Control: no-cache, no-store' \
                "$base/studio/video-ai.html?$query" > "/tmp/video-cloud-v67/$slug-headers.txt" || true

              if RELEASE_FILE="/tmp/video-cloud-v67/$slug-release.json" node <<'NODE'
          const fs = require('node:fs');
          let data;
          try { data = JSON.parse(fs.readFileSync(process.env.RELEASE_FILE, 'utf8')); } catch { process.exit(1); }
          const exact = {
            videoAiStudio: process.env.VIDEO_AI_RELEASE,
            videoAiOpenAiIntegration: process.env.OPENAI_RELEASE,
            videoAiEngineMode: 'cloud-asynchronous-with-local-fallback',
            videoAiPipeline: 'resumable-multipart-r2-container-ffmpeg-openai-transcription-semantic-selection-review-drive',
            videoAiSemanticPriority: 'openai-then-workers-ai',
            videoAiOpenAiMode: 'server-analysis-before-render-when-configured',
            videoAiOpenAiDataPolicy: 'store-false-for-responses-api-no-source-video',
            videoAiSourcePrivacy: 'encrypted-cloud-temporary-source-storage',
            videoAiUpload: 'r2-multipart-16mb-three-way-parallel-retry',
            videoAiSourceRetention: 'deleted-after-successful-generation',
            videoAiLocalFallback: 'browser-engine-retained-not-primary',
          };
          for (const [key, value] of Object.entries(exact)) if (data[key] !== value) process.exit(1);
          for (const key of [
            'videoAiOpenAiConfigured',
            'videoAiOpenAiStructuredOutputs',
            'videoAiContainerRequired',
            'videoAiContainerBindingPresent',
            'videoAiStorageBindingPresent',
            'videoAiWorkersAiBindingPresent',
            'videoAiInternalSecretRequired',
            'videoAiInternalSecretPresent',
            'videoAiR2SourceUploadRequired',
            'videoAiBackgroundProcessing',
            'videoAiSafeToCloseAfterUpload',
            'videoAiReady',
          ]) if (data[key] !== true) process.exit(1);
          NODE
              then
                if grep -Fq 'TRAITEMENT CLOUD RÉSILIENT' "/tmp/video-cloud-v67/$slug-video-ai.html" \
                  && grep -Fq 'Production cloud' "/tmp/video-cloud-v67/$slug-video-ai.html" \
                  && grep -Fq 'Importer et lancer la production' "/tmp/video-cloud-v67/$slug-video-ai.html" \
                  && grep -Fq 'Aucun fichier vidéo source n’est envoyé à OpenAI' "/tmp/video-cloud-v67/$slug-video-ai.html" \
                  && grep -Fq 'multipartUpload' "/tmp/video-cloud-v67/$slug-client.js" \
                  && grep -Fq 'fetchWithRetry' "/tmp/video-cloud-v67/$slug-resilience.js" \
                  && grep -Fqi "x-neptune-video-ai: $VIDEO_AI_RELEASE" "/tmp/video-cloud-v67/$slug-headers.txt" \
                  && grep -Fqi "x-neptune-openai-video: $OPENAI_RELEASE" "/tmp/video-cloud-v67/$slug-headers.txt"; then
                  ready=1
                  echo "$base: Neptune Video Cloud v67 verified on attempt $attempt."
                  break
                fi
              fi

              echo "$base: cloud v67 not fully propagated on attempt $attempt; retrying."
              sleep 10
            done

            test "$ready" = 1
          }

          verify_domain "$WORKERS_URL" workers
          verify_domain "$PUBLIC_URL" public

          node <<'NODE'
          const fs = require('node:fs');
          const workers = JSON.parse(fs.readFileSync('/tmp/video-cloud-v67/workers-release.json', 'utf8'));
          const custom = JSON.parse(fs.readFileSync('/tmp/video-cloud-v67/public-release.json', 'utf8'));
          const fields = [
            'videoAiStudio',
            'videoAiOpenAiIntegration',
            'videoAiEngineMode',
            'videoAiOpenAiModel',
            'videoAiPipeline',
            'videoAiUpload',
            'videoAiSourceRetention',
            'videoAiReady',
          ];
          for (const field of fields) {
            if (workers[field] !== custom[field]) throw new Error(`domain_mismatch:${field}`);
          }
          const status = {
            status: 'success',
            verifier: 'neptune-video-cloud-production-verifier-v67',
            source_sha: process.env.GITHUB_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            checked_at: new Date().toISOString(),
            production_domains: [process.env.WORKERS_URL, process.env.PUBLIC_URL],
            release: workers.videoAiStudio,
            openai_release: workers.videoAiOpenAiIntegration,
            ready: workers.videoAiReady === true && custom.videoAiReady === true,
            engine_mode: workers.videoAiEngineMode,
            container_binding: workers.videoAiContainerBindingPresent,
            storage_binding: workers.videoAiStorageBindingPresent,
            workers_ai_binding: workers.videoAiWorkersAiBindingPresent,
            internal_secret: workers.videoAiInternalSecretPresent,
            openai_configured: workers.videoAiOpenAiConfigured,
            safe_to_close_after_upload: workers.videoAiSafeToCloseAfterUpload,
            source_retention: workers.videoAiSourceRetention,
            outcome: 'success',
          };
          fs.writeFileSync('video-cloud-v67-production-status.json', `${JSON.stringify(status, null, 2)}\n`);
          console.log(JSON.stringify(status, null, 2));
          NODE

      - name: Record cloud production verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video-cloud-v67-production-status.json
          if git diff --cached --quiet; then
            echo 'Production status already current.'
            exit 0
          fi
          git commit -m 'chore: record Neptune video cloud v67 production verification [skip ci]'
          git push origin HEAD:main
